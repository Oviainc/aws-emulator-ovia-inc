[workspace]
members = [
    "services/service-com-amazonaws-accessanalyzer-accessanalyzer",
    "services/service-com-amazonaws-account-account",
    "services/service-com-amazonaws-accountaccess-awsaccountaccess",
    "services/service-com-amazonaws-acm-certificatemanager",
    "services/service-com-amazonaws-acmpca-acmprivateca",
    "services/service-com-amazonaws-agentregistry-agentregistry",
    "services/service-com-amazonaws-agentregistrycontrol-agentregistrycontrol",
    "services/service-com-amazonaws-aiops-aiops",
    "services/service-com-amazonaws-amp-amazonprometheusservice",
    "services/service-com-amazonaws-amplify-amplify",
    "services/service-com-amazonaws-amplifybackend-amplifybackend",
    "services/service-com-amazonaws-amplifyuibuilder-amplifyuibuilder",
    "services/service-com-amazonaws-apigateway-backplanecontrolservice",
    "services/service-com-amazonaws-apigatewaymanagementapi-apigatewaymanagementapi",
    "services/service-com-amazonaws-apigatewayv2-apigatewayv2",
    "services/service-com-amazonaws-appconfig-amazonappconfig",
    "services/service-com-amazonaws-appconfigdata-appconfigdata",
    "services/service-com-amazonaws-appfabric-fabricfrontendservice",
    "services/service-com-amazonaws-appflow-sandstoneconfigurationservicelambda",
    "services/service-com-amazonaws-appintegrations-amazonappintegrationservice",
    "services/service-com-amazonaws-applicationautoscaling-anyscalefrontendservice",
    "services/service-com-amazonaws-applicationcostprofiler-awsapplicationcostprofiler",
    "services/service-com-amazonaws-applicationdiscoveryservice-awsposeidonservice-v2015-11-01",
    "services/service-com-amazonaws-applicationinsights-ec2windowsbarleyservice",
    "services/service-com-amazonaws-applicationsignals-applicationsignals",
    "core/router",
    "core/embedded",
]
exclude = [
    "vendor/smithy-macros",
    "vendor/smithy-schema-server",
    "vendor/smithy-server-runtime",
    "vendor/server",
    "vendor/engine",
    "vendor/build-support",
    "vendor/emulator-telemetry",
    "vendor/emulator-paths",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"

# Debuginfo is the largest term in this workspace's build time and disk, and
# nothing reads it — the emulator is exercised over HTTP, not in a debugger.
# Line tables keep panic backtraces. `profile.test` inherits `dev`.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Workspace-local crates
service-com-amazonaws-accessanalyzer-accessanalyzer = { path = "services/service-com-amazonaws-accessanalyzer-accessanalyzer" }
service-com-amazonaws-account-account = { path = "services/service-com-amazonaws-account-account" }
service-com-amazonaws-accountaccess-awsaccountaccess = { path = "services/service-com-amazonaws-accountaccess-awsaccountaccess" }
service-com-amazonaws-acm-certificatemanager = { path = "services/service-com-amazonaws-acm-certificatemanager" }
service-com-amazonaws-acmpca-acmprivateca = { path = "services/service-com-amazonaws-acmpca-acmprivateca" }
service-com-amazonaws-agentregistry-agentregistry = { path = "services/service-com-amazonaws-agentregistry-agentregistry" }
service-com-amazonaws-agentregistrycontrol-agentregistrycontrol = { path = "services/service-com-amazonaws-agentregistrycontrol-agentregistrycontrol" }
service-com-amazonaws-aiops-aiops = { path = "services/service-com-amazonaws-aiops-aiops" }
service-com-amazonaws-amp-amazonprometheusservice = { path = "services/service-com-amazonaws-amp-amazonprometheusservice" }
service-com-amazonaws-amplify-amplify = { path = "services/service-com-amazonaws-amplify-amplify" }
service-com-amazonaws-amplifybackend-amplifybackend = { path = "services/service-com-amazonaws-amplifybackend-amplifybackend" }
service-com-amazonaws-amplifyuibuilder-amplifyuibuilder = { path = "services/service-com-amazonaws-amplifyuibuilder-amplifyuibuilder" }
service-com-amazonaws-apigateway-backplanecontrolservice = { path = "services/service-com-amazonaws-apigateway-backplanecontrolservice" }
service-com-amazonaws-apigatewaymanagementapi-apigatewaymanagementapi = { path = "services/service-com-amazonaws-apigatewaymanagementapi-apigatewaymanagementapi" }
service-com-amazonaws-apigatewayv2-apigatewayv2 = { path = "services/service-com-amazonaws-apigatewayv2-apigatewayv2" }
service-com-amazonaws-appconfig-amazonappconfig = { path = "services/service-com-amazonaws-appconfig-amazonappconfig" }
service-com-amazonaws-appconfigdata-appconfigdata = { path = "services/service-com-amazonaws-appconfigdata-appconfigdata" }
service-com-amazonaws-appfabric-fabricfrontendservice = { path = "services/service-com-amazonaws-appfabric-fabricfrontendservice" }
service-com-amazonaws-appflow-sandstoneconfigurationservicelambda = { path = "services/service-com-amazonaws-appflow-sandstoneconfigurationservicelambda" }
service-com-amazonaws-appintegrations-amazonappintegrationservice = { path = "services/service-com-amazonaws-appintegrations-amazonappintegrationservice" }
service-com-amazonaws-applicationautoscaling-anyscalefrontendservice = { path = "services/service-com-amazonaws-applicationautoscaling-anyscalefrontendservice" }
service-com-amazonaws-applicationcostprofiler-awsapplicationcostprofiler = { path = "services/service-com-amazonaws-applicationcostprofiler-awsapplicationcostprofiler" }
service-com-amazonaws-applicationdiscoveryservice-awsposeidonservice-v2015-11-01 = { path = "services/service-com-amazonaws-applicationdiscoveryservice-awsposeidonservice-v2015-11-01" }
service-com-amazonaws-applicationinsights-ec2windowsbarleyservice = { path = "services/service-com-amazonaws-applicationinsights-ec2windowsbarleyservice" }
service-com-amazonaws-applicationsignals-applicationsignals = { path = "services/service-com-amazonaws-applicationsignals-applicationsignals" }

# The vendored framework (under vendor/, Apache-2.0, see vendor/README.md).
#
# `engine` is deliberately ONE crate shared by every service crate and the
# router: the router builds a single `Arc<InMemoryEngine>` and hands it to each
# service's operations through their constructor (`new(engine)`), so a
# second `engine` crate anywhere in the tree would be a second, incompatible
# `InMemoryEngine` type that the shared engine could not be handed to.
smithy-macros = { path = "vendor/smithy-macros", package = "aws-emulator-smithy-macros" }
aws-smithy-schema-server = { path = "vendor/smithy-schema-server", package = "aws-emulator-smithy-schema-server" }
smithy-server-runtime = { path = "vendor/smithy-server-runtime", package = "aws-emulator-smithy-server-runtime" }
emulator-server = { path = "vendor/server", package = "aws-emulator-server" }
engine = { path = "vendor/engine", package = "aws-emulator-engine" }
emulator-core-build-support = { path = "vendor/build-support", package = "aws-emulator-build-support" }
emulator-telemetry = { path = "vendor/emulator-telemetry", package = "aws-emulator-emulator-telemetry" }
emulator-paths = { path = "vendor/emulator-paths", package = "aws-emulator-emulator-paths" }

# Public crates.io deps
aws-smithy-schema = "0.2.1"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-types = "1"
# Generated crates use tokio only for `#[tokio::main]` / `#[tokio::test]`.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
bytes = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sha2 = "0.10"
hex = "0.4"
