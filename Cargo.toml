# The vendored framework (under vendor/, Apache-2.0, see vendor/README.md).
#
# `engine` is deliberately ONE crate shared by every service crate and the
# router: the router builds a single `Arc<InMemoryEngine>` and hands it to each
# service's operations through their constructor (`new(engine)`), so a
# second `engine` crate anywhere in the tree would be a second, incompatible
# `InMemoryEngine` type that the shared engine could not be handed to.
smithy-macros = { path = "vendor/smithy-macros", package = "aws-emulator-smithy-macros" }
aws-smithy-schema-server = { path = "vendor/smithy-schema-server", package = "aws-emulator-smithy-schema-server" }
smithy-server-runtime = { path = "vendor/smithy-server-runtime", package = "aws-emulator-smithy-server-runtime" }
emulator-server = { path = "vendor/server", package = "aws-emulator-server" }
engine = { path = "vendor/engine", package = "aws-emulator-engine" }
emulator-core-build-support = { path = "vendor/build-support", package = "aws-emulator-build-support" }
emulator-telemetry = { path = "vendor/emulator-telemetry", package = "aws-emulator-emulator-telemetry" }
emulator-paths = { path = "vendor/emulator-paths", package = "aws-emulator-emulator-paths" }

# Public crates.io deps
aws-smithy-schema = "0.2.1"
aws-smithy-runtime-api = { version = "1", features = ["client", "http-1x"] }
aws-smithy-types = "1"
# Generated crates use tokio only for `#[tokio::main]` / `#[tokio::test]`.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
bytes = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
sha2 = "0.10"
hex = "0.4"
