[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"

# Debuginfo is the largest term in this workspace's build time and disk, and
# nothing reads it — the emulator is exercised over HTTP, not in a debugger.
# Line tables keep panic backtraces. `profile.test` inherits `dev`.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"

