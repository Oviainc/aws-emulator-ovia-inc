[package]
name = "aws-emulator-emulator-telemetry"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
name = "emulator_telemetry"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = ">=0.37, <0.42", features = ["bundled"] }
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
toml = "0.9"
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }
emulator-paths = { path = "../emulator-paths", package = "aws-emulator-emulator-paths", version = "*" }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
