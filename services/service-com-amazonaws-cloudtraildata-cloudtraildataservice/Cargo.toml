[package]
name = "service-com-amazonaws-cloudtraildata-cloudtraildataservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Verifies AuditEvent.eventDataChecksum (base64 of the SHA-256 of eventData) and
# supplies the random bytes of the eventID this service mints.
sha2 = { workspace = true }
# Hex-codes those bytes into the eventID's UUID form.
hex = { workspace = true }
# The shared ARN parse every service reads its own resource ARNs with, and the shared
# constraint-violation renderer this service states a boundary refusal with.
service-common = { path = "../common" }
# Reads the canonical UUID form a channel id is minted in, so a channel ARN's resource
# suffix is held to that form rather than to a hand-written grammar.
uuid = { version = "1" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Percent-encodes a channel reference into the request URI, so a reference carrying
# multi-byte characters reaches the service as the caller sent it.
percent-encoding = "2"

[lints]
workspace = true
