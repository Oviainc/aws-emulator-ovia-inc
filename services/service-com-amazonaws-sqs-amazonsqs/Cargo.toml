[package]
name = "service-com-amazonaws-sqs-amazonsqs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` is needed for ReceiveMessage long polling (WaitTimeSeconds).
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# MD5 of a message body / of the message-attribute encoding, which SQS returns.
md-5 = "0.10"
# Hex rendering of those digests.
hex = { workspace = true }
# SHA-256 of a message body, which is the deduplication token a FIFO queue with
# ContentBasedDeduplication derives for it.
sha2 = { workspace = true }
# MessageId / ReceiptHandle identifiers.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
