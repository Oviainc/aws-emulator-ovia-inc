[package]
name = "service-com-amazonaws-pi-performanceinsightsv20180227"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digest behind the minted `AnalysisReportId` suffix and behind the
# `GetResourceMetrics` pagination scope.
sha2 = { workspace = true }
# Hex for the report-id suffix and for the opaque, self-describing `NextToken`
# (hex stays inside the modelled `^[a-zA-Z0-9_=-]+$` pattern).
hex = { workspace = true }
# The IAM store, for the identity-based policies of the identity a request's
# signing key belongs to: authorization is decided from the account's own IAM
# records, never from a second copy of them kept here.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The STS session registry, which is what tells whether a signing key is an
# assumed-role session and which role it was minted from.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# `db_data_sources`: the shared directory the database control planes record a
# minted DB resource id in, which is how this service decides whether a request's
# `ServiceType` is the service that owns the addressed data source.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
