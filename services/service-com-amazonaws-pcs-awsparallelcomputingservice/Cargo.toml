[package]
name = "service-com-amazonaws-pcs-awsparallelcomputingservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` a paginated list hands back.
hex = { workspace = true }
# The AWS SDK for IAM, driven over the in-process callback
# (`OperationContext::callback`): `CreateComputeNodeGroup` resolves the instance profile
# its `iamInstanceProfileArn` references with `GetInstanceProfile` before it resolves
# anything of its own. Only the generated client is needed — the emulator supplies the
# transport, so the SDK's own HTTPS stack and runtime are left out.
aws-sdk-iam = { version = "1", default-features = false }
# The tree's shared IAM-ARN reading, in-process IAM client and `@pattern` rendering.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# `tokio::time::sleep` lets a test wait out a lifecycle transition the clock owes.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
