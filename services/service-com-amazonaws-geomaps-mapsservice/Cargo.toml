[package]
name = "service-com-amazonaws-geomaps-mapsservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Stable ETags: a SHA-256 of the bytes actually served, rendered as hex.
sha2 = { workspace = true }
hex = { workspace = true }
# PNG codec for the lossless raster assets (sprite sheets, DEM tiles).
png = "0.17"
# JPEG codec for the photographic raster assets: the model documents
# GetStaticMap's blob as a jpeg, and satellite tiles are served as one too.
jpeg-encoder = "0.6"
# Protobuf codec for the two protobuf formats this service serves: Mapbox
# Vector Tiles (GetTile) and SDF glyph ranges (GetGlyphs).
prost = "0.13"
# The typeface the glyph ranges and the rendered map labels are drawn from: an
# 8x8 monochrome bitmap font, shipped as data, covering Basic Latin, Latin-1,
# Greek and Hiragana.
font8x8 = "0.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Decoder used only by the tests, to prove the JPEG assets really decode to the
# requested image size.
zune-jpeg = "0.4"

[lints]
workspace = true
