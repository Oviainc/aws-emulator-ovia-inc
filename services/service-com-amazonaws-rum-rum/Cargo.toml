[package]
name = "service-com-amazonaws-rum-rum"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digests the id seed and counter into the modelled 36-character `AppMonitorId`.
sha2 = { workspace = true }
# Hex codec for that id's bytes and for the opaque ListAppMonitors NextToken.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` for the one test that must cross a whole-second boundary, since
# `ISOTimestampString` has one-second resolution.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
