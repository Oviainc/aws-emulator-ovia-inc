[package]
name = "service-com-amazonaws-rum-rum"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digests the id seed and counter into the modelled 36-character `AppMonitorId`.
sha2 = { workspace = true }
# Hex codec for that id's bytes and for the opaque ListAppMonitors NextToken.
hex = { workspace = true }
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource, principal), which every RUM operation's authorization check runs.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks
# for, and the STS store resolves which principal that is: RUM reads both services'
# OWN state accessors rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The CloudWatch Logs client that provisions the vended log group RUM reports as
# `DataStorage.CwLog.CwLogGroup` when log delivery is enabled, over the in-process
# callback into this same emulator (no network client feature is enabled: the
# transport is the emulator's own).
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` for the one test that must cross a whole-second boundary, since
# `ISOTimestampString` has one-second resolution.
tokio = { workspace = true, features = ["time"] }
# The authorization tests mount the CloudWatch Logs service beside RUM, because
# enabling `CwLogEnabled` provisions the vended log group by calling it.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }

[lints]
workspace = true
