[package]
name = "service-com-amazonaws-eventbridgev2-awseventsv2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex, to render the opaque ListEventBuses NextToken from the page cursor and
# the content-deduplication digest PutEvents indexes an event under.
hex = { workspace = true }
# SHA-256, for the "hash of the event content" CONTENT_BASED deduplication keys
# PutEvents entries on: a fixed-width key keeps that index small whatever the
# size of the event.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
