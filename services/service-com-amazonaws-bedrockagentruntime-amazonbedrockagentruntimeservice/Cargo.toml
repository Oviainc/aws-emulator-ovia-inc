[package]
name = "service-com-amazonaws-bedrockagentruntime-amazonbedrockagentruntimeservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share, and the
# one evaluation of an IAM identity-based policy this service authorizes a caller with.
service-common = { path = "../common" }
# The caller's identity, from the same registry `sts:GetCallerIdentity` answers from, and
# the identity-based policies the account holds for it. Read-only: this service writes
# neither store.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The knowledge bases, data sources and the vector store binding a retrieval reads, from
# the plane that OWNS them, and the vector index their ingestions wrote. Read-only: this
# service writes no part of either.
service-com-amazonaws-bedrockagent-amazonbedrockagentbuildtimelambda = { workspace = true }
service-com-amazonaws-s3vectors-s3vectors = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` is for the retrieval test's wait over the ingestion spans the Bedrock Agent
# plane's clock owes; `macros`/`rt` come from the workspace entry.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The retrieval test seeds the objects a data source is crawled from, and follows a
# citation back to one, through S3 itself.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
