[package]
name = "service-com-amazonaws-kinesisanalyticsv2-kinesisanalytics-20180523"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The shared request-claim rule for one endpoint serving several API versions.
service-common = { path = "../common" }
# The Glue service, for ONE read: the Data Catalog database a Studio notebook's
# `GlueDataCatalogConfiguration$DatabaseARN` names, which a create or an update of that
# notebook has to resolve before it persists anything. The database lives in Glue's own
# store in the shared engine, so this is a cross-service READ of it rather than a copy of
# the value the request carried. No cycle: that crate does not depend on this one.
service-com-amazonaws-glue-awsglue = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Server-assigned ids (OperationId, InputId, ConditionalToken) are digest-derived.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
