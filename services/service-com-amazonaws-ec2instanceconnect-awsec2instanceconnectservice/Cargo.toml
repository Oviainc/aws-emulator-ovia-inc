[package]
name = "service-com-amazonaws-ec2instanceconnect-awsec2instanceconnectservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Both are used in `src/`: the per-call `RequestId` is a digest (`sha2`) rendered as hex
# (`hex`). See `state::ComAmazonawsEc2instanceconnectAwsec2instanceconnectserviceState::next_request_id`.
sha2 = { workspace = true }
hex = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): an EC2 instance is EC2's resource, so `src/state/ec2.rs`
# asks EC2 whether the instance a key push names exists, what state it is in and which zone
# and instance type it has, rather than deciding that from records kept here. Only the
# generated client is needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource), which both key pushes are decided by, plus `iam_role`'s readings of a
# principal ARN. See `src/state/authorization.rs`.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks for,
# and the STS store resolves which principal that is: this service reads both services' OWN
# state accessors rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[dev-dependencies]
# The EC2 service, mounted beside this one in tests/all/ec2_owned_instances.rs and
# tests/all/identity_policy_authorization.rs: a push at an instance EC2 launched can only be
# driven end to end with the owner of the instance on the same engine.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# RFC 3986 percent-encoding, so tests/all/identity_policy_authorization.rs can put a whole
# IAM policy document in an `application/x-www-form-urlencoded` component.
percent-encoding = "2.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
