[package]
name = "service-com-amazonaws-ec2instanceconnect-awsec2instanceconnectservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Both are used in `src/`: the per-call `RequestId` is a digest (`sha2`) rendered as hex
# (`hex`). See `state::ComAmazonawsEc2instanceconnectAwsec2instanceconnectserviceState::next_request_id`.
sha2 = { workspace = true }
hex = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): an EC2 instance is EC2's resource, so `src/state/ec2.rs`
# asks EC2 whether the instance a key push names exists, what state it is in and which zone
# and instance type it has, rather than deciding that from records kept here. Only the
# generated client is needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }

[dev-dependencies]
# The EC2 service, mounted beside this one in tests/all/ec2_owned_instances.rs: a push at an
# instance EC2 launched can only be driven end to end with the owner of the instance on the
# same engine. DEV-ONLY: this crate depends on no other service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
