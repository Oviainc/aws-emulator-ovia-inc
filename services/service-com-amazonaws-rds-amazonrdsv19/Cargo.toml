[package]
name = "service-com-amazonaws-rds-amazonrdsv19"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The DB instance DATA plane (`src/state/data_plane/`): the engine endpoint a PostgreSQL
# or MySQL client connects to.
#
# `rusqlite` (the `bundled` SQLite already in this workspace — `vendor/emulator-telemetry`
# and the Athena, Redshift Data and RDS Data services build the same version and feature
# set) is the SQL engine each instance's statements run against, in memory and per
# instance.
#
# The `backup` feature is SQLite's own online-backup API, which is what COPYING one
# instance's database is: taking a DB snapshot of an instance and restoring that snapshot
# into a new instance's storage are both a page-for-page copy made by the engine. The
# `functions` feature registers this endpoint's own server functions
# (`pg_postmaster_start_time`, `pg_is_in_recovery`, `pg_sleep`, `current_setting`) on each
# database's connection, so a statement that calls one is planned and run by the engine.
rusqlite = { version = "0.37", features = [
    "backup",
    "bundled",
    "column_decltype",
    "functions",
    "hooks",
    "limits",
] }
# `sqlparser` reads a statement as the TOKENS of its own dialect, which is how the wire
# tells a server command (`SHOW`, `SET`) from a query and substitutes the session's values
# into one without inspecting its text.
sqlparser = "0.59"
# `sha1` is the digest the MySQL `mysql_native_password` handshake is defined in terms of,
# and the only form a native-password login can be verified against.
sha1 = "0.10"
# `getrandom` draws the per-connection nonce that handshake challenges a client with from
# the operating system's own entropy, so the proof the client answers with cannot be
# replayed.
getrandom = "0.3"
# `rds_cluster_parameters`: the cluster parameter catalog and the parameter rules the
# Amazon RDS, DocumentDB and Neptune models of the one `rds` front door share
# (`src/state.rs`).
# `db_data_sources`: the shared directory a minted `DbiResourceId` is recorded in, so a
# monitoring service (Performance Insights) can tell which service owns that id.
# `audited_operation` / `management_events`: the shared operation wrapper that records each
# call this front door serves in the account's management-event log, and the log itself —
# the one store CloudTrail's `LookupEvents` reads (`src/service/management_events.rs`).
# `query_decimal_floats`: the wrapper that renders a floating-point member of a response as
# the decimal AWS renders one as, which every operation of this front door is served behind
# (`src/service/management_events.rs`).
service-common = { path = "../common" }
# `ManageMasterUserPassword` has RDS generate the master user password and manage it in
# Amazon Web Services Secrets Manager: this is the Secrets Manager client the create and
# the rotation of that secret go out over the in-process callback with
# (`src/state/managed_master_secret.rs`).
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The same module reports WHICH KMS key that secret is encrypted under, resolved through
# KMS so the key's own ARN is reported rather than an alias that may be re-targeted.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `state::new_request_id`'s digest: a maintained hash, so the per-response request id in
# an awsQuery `<ErrorResponse>` envelope is shaped by library code rather than by hand.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The engine-endpoint tests drive a real client against the data plane in ONE process:
# `sha1` computes the `mysql_native_password` proof a client sends, and
# `rustls`/`tokio-rustls` run the client side of the in-band TLS upgrade the core's
# upgrader answers. Both are the versions this workspace already builds.
sha1 = "0.10"
rustls = { workspace = true }
tokio-rustls = "0.26"
# The managed-master-password suite mounts Secrets Manager (and KMS, which encrypts a
# secret's value) beside this service on one engine, exactly as the assembled router
# mounts them, so the secret a cluster or instance reports is a real secret of this
# emulator, read back through Secrets Manager's own operations.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
service-com-amazonaws-kms-trentservice = { workspace = true }

[lints]
workspace = true
