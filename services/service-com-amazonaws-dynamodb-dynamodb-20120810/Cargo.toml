[package]
name = "service-com-amazonaws-dynamodb-dynamodb-20120810"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Exact decimal arithmetic for the `N` attribute type: an `ADD`ed or `SET`-computed
# number carries up to 38 significant digits, which no primitive float can hold.
bigdecimal = "0.4"
# Mints the UUID-format `TableId` DynamoDB generates for every table it creates
# (`state::new_table_id`).
uuid = { version = "1", features = ["v4"] }
# The policy revision id is a digest of the policy document, so the same document
# always gets the same id (PutResourcePolicy's documented idempotency).
sha2 = { workspace = true }
# Hex rendering for that digest.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
