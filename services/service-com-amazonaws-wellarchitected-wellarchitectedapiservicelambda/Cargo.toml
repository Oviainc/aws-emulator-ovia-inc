[package]
name = "service-com-amazonaws-wellarchitected-wellarchitectedapiservicelambda"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the 32-hex WorkloadId and fingerprints idempotent request parameters.
sha2 = { workspace = true }
# Hex codec for the minted ids and the opaque paging NextToken.
hex = { workspace = true }
# Writes the PDF document a lens review is reported as (`GetLensReviewReport`), so the
# report a caller decodes is produced by a PDF writer rather than hand-assembled bytes.
pdf-writer = "0.13"
# Wraps the stored notes that document prints to the page's text column. Only the crate's
# own first-fit wrapping is needed, so every optional feature is left off.
textwrap = { version = "0.16", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
