[package]
name = "service-com-amazonaws-ssmcontacts-ssmcontacts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Derives the stable opaque id inside a minted contact-channel ARN from the channel's identity.
sha2 = { workspace = true }
# Renders that digest, and the opaque `NextToken` payload, as printable text.
hex = { workspace = true }
# `service-common` carries the workspace's ONE caller-supplied-ARN parse, which the tagging
# operations read their unpatterned `ResourceARN` against before resolving it, its ONE
# reading of a caller-supplied email address, which a contact channel's delivery address is
# read against when the channel's type is the one documented to carry an email format, and
# its ONE grammar of a resource-based policy document, which a contact's resource policy is
# read against before it is attached.
service-common = { path = "../common" }
# Resolves a rotation's `TimeZoneId` against the IANA time zone database it compiles in, so a
# zone name the service cannot resolve is refused instead of stored.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
