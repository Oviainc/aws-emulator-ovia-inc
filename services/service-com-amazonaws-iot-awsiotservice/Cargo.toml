[package]
name = "service-com-amazonaws-iot-awsiotservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The IoT job-execution store shared with the IoT Jobs data plane, which serves the
# executions `CreateJob` creates when a job targets a thing (`services/common`).
service-common = { path = "../common" }
# Endpoint identifiers: an account's IoT endpoint prefix is derived from the
# account id and the region with SHA-256 (see `state::derive_endpoint_identifier`).
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }

[lints]
workspace = true
