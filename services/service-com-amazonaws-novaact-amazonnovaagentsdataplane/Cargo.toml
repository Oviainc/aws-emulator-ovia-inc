[package]
name = "service-com-amazonaws-novaact-amazonnovaagentsdataplane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mint the server-side ids this model constrains to the UUID form: SHA-256 over a
# monotonic counter (`sha2`), rendered as hex (`hex`) — the same pattern the other
# services in this workspace mint their ids with.
sha2 = { workspace = true }
hex = { workspace = true }
# `service-common` carries the workspace's ONE rendering of a constraint-violation
# refusal — the counted envelope, the per-class requirement and the `@pattern`
# expression quoted without its whole-value anchors — which `src/service.rs` states
# this service's `@pattern` refusals through. It also carries `iam_authorization`, the
# shared evaluation of policy documents against an action on a resource, and `iam_role`,
# which reads which IAM entity a principal ARN names.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Amazon S3 client a `WorkflowExportConfig`'s `s3BucketName` is resolved through: a
# definition's export destination is read before the definition is stored, and S3 is
# called over the in-process callback into this same emulator (no network client feature
# is enabled: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The export-destination suite mounts the S3 service beside this one on a single engine,
# because CreateWorkflowDefinition resolves an `exportConfig`'s bucket by calling S3 in
# process.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
