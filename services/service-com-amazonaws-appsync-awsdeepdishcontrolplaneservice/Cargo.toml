[package]
name = "service-com-amazonaws-appsync-awsdeepdishcontrolplaneservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Parses the OIDC `issuer`, which AppSync requires to be a valid URL.
url = "2"
# Parses a caller-supplied GraphQL type definition (SDL), which `CreateType` and
# `UpdateType` carry.
apollo-parser = "0.8"
# Parses an `associationId` to decide whether it has the UUID form the AppSync service
# issues its source-API association references in.
uuid = "1"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
