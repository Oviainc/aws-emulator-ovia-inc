[package]
name = "service-com-amazonaws-swf-simpleworkflowservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the unique, server-generated `runId` StartWorkflowExecution mints and stores
# (moved up from `[dev-dependencies]`, where the scaffold placed them).
sha2 = { workspace = true }
hex = { workspace = true }
# Writes the server-generated `runId` in base64, the alphabet Amazon SWF's own run ids
# are written in.
base64 = "0.22"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
