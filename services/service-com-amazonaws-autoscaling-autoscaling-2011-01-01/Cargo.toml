[package]
name = "service-com-amazonaws-autoscaling-autoscaling-2011-01-01"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the `<RequestId>` the awsQuery error envelope carries (see
# `service::query_error_envelope`), the same v4 UUID form the framework's query
# renderer puts in a successful response's `ResponseMetadata/RequestId`.
uuid = { version = "1", features = ["v4"] }
# The EC2 store holds the account's subnets, and a subnet's Availability Zone is a fact
# about that subnet: a group that names only `VPCZoneIdentifier` has its zones resolved
# from EC2's own state (`state::ec2_subnets`) rather than asked of the caller.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
