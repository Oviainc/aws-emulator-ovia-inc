[package]
name = "service-com-amazonaws-ssmguiconnect-ssmguiconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# NO dependency is added by this service. Everything it needs — the `@pattern`
# sub-checks, the `@idempotencyToken` mint and the test's audit capture — is built on
# the standard library and on `tracing`, which the scaffold already declares. A new
# entry here would also change the workspace `Cargo.lock`, the one file every other
# service's change rewrites, which keeps the serialized squash-merge from resolving.

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
