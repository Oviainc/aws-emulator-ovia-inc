[package]
name = "service-com-amazonaws-keyspaces-keyspacesservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# Generated crates use tokio only for `#[tokio::main]` / `#[tokio::test]`; `time` is for
# the integration test's wait on a clock-owed status transition.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque `nextToken` ListTables issues (encode/decode only).
hex = { workspace = true }
# The CDC STREAM STORE, which that crate owns: Amazon Keyspaces creates a table's CDC
# stream when `CreateTable`/`UpdateTable` is given a `cdcSpecification`, and
# KeyspacesStreams reports that stream and serves its records. Both sides reach the ONE
# store in the shared engine (`state::enable_stream` / `state::disable_stream`), so the
# stream this control plane enables is the stream that data plane answers for.
service-com-amazonaws-keyspacesstreams-keyspacesstreams = { workspace = true }
# A table's auto scaling settings ARE Application Auto Scaling resources — a scalable
# target per capacity dimension, plus the target-tracking policy that steers it — so they
# are written into, and read back out of, that emulator's own store through the shared
# engine, which needs its state TYPE.
service-com-amazonaws-applicationautoscaling-anyscalefrontendservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
