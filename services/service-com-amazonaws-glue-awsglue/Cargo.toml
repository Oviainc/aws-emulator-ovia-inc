[package]
name = "service-com-amazonaws-glue-awsglue"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The content digest a resource policy's `PolicyHash` is derived from, hex-rendered.
sha2 = { workspace = true }
hex = { workspace = true }
# The `Expression` filter of `GetTables` is a regular expression, matched here by the
# regex crate rather than by a hand-rolled matcher.
regex = "1.13"
# The shared IAM policy evaluator and IAM-ARN reading, for the crawler-role checks.
service-common = { path = "../common" }
# The account's own IAM records, read through the same shared engine, so a crawler's
# `Role` is resolved against the roles `CreateRole`/`PutRolePolicy` wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The account's own IAM Identity Center instances, read through the same shared engine, so
# the `InstanceArn` of a Glue Identity Center configuration is resolved against the
# instances `CreateInstance`/`ListInstances` answer for.
service-com-amazonaws-ssoadmin-swbexternalservice = { workspace = true }
# The KMS client the catalog resolves `EncryptionAtRest$SseAwsKmsKeyId` through, and
# encrypts and decrypts a catalog object's data key with, over the in-process callback
# into this same emulator (no network client feature is enabled: the transport is the
# emulator's own).
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The Amazon S3 client a column statistics task run reads the objects behind a table's
# `StorageDescriptor.Location` through, over the in-process callback into this same
# emulator (no network client feature is enabled: the transport is the emulator's own, so
# no socket is opened and no host is resolved).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Reads the delimited text behind a Data Catalog table when a column statistics task run
# aggregates its columns; a library computing over data in this process, with no native or
# build-time code.
csv = "1.3"
# Decodes the base64 a text-format table writes a binary column's value as, so the lengths
# a run reports for that column are the value's rather than the encoding's.
base64 = "0.22"
# Parses an Avro schema document and decides, by Avro's own schema-resolution rules,
# whether a reader schema can read data written with a writer schema — the question the
# schema registry's compatibility modes ask of two versions of a schema set. Only the
# schema algebra is used; no codec feature is enabled.
apache-avro = { version = "0.17", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The catalog-encryption suite mounts the KMS service beside Glue on one engine, because a
# catalog write and a catalog read of an SSE-KMS catalog each call it.
service-com-amazonaws-kms-trentservice = { workspace = true }
# Amazon S3, mounted beside Glue on one engine, so a column statistics task run aggregates
# the objects a test staged with `PutObject` at the covered table's location.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
