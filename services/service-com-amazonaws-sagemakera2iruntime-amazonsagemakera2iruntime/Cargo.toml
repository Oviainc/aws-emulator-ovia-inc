[package]
name = "service-com-amazonaws-sagemakera2iruntime-amazonsagemakera2iruntime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque `ListHumanLoops` pagination token and the stored input digest.
hex = { workspace = true }
# SHA-256: a record keeps the digest of a human loop's input content, never the content.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` for `tokio::time::sleep` in the lifecycle tests: the clock-owed Stopping -> Stopped
# transition is observed by waiting past its due instant without blocking the test's worker.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
