[package]
name = "service-com-amazonaws-databasemigrationservice-amazondmsv20160101"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Resource-id minting: SHA-256 over a per-store counter and the clock, folded into
# the uppercase alphanumeric alphabet a DMS ARN's resource id uses.
sha2 = { workspace = true }
# Opaque pagination markers: a describe's `Marker` is the hex of the ARN it resumes at.
hex = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the account's subnets and the Region's Availability
# Zones are EC2's resources, so `CreateReplicationSubnetGroup` resolves the subnets it is
# given against EC2 before it persists a group. Only the generated client is needed — the
# emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# `iam_role::role_is_unassumable`: the ONE reading of a caller-supplied role ARN against
# the account's IAM records, which `CreateEndpoint` resolves `ServiceAccessRoleArn`
# through. `arn::region_label` is the one reading of a caller-supplied Region as a Region
# LABEL, which the EC2 endpoint above is built from.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The AWS SDK for IAM, used by the test harness to CREATE the roles an endpoint names,
# over the same in-process callback the handler resolves them through.
aws-sdk-iam = { version = "1", default-features = false }
# The owners of the resources this service RESOLVES, mounted beside it in the test
# harness: Amazon EC2 holds the account's subnets and the Region's Availability Zones,
# IAM the roles an endpoint asks DMS to assume, so the resolution can only be driven end
# to end with them on the same engine. DEV-ONLY: this crate depends on no other service's
# crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[lints]
workspace = true
