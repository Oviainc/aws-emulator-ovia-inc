[package]
name = "service-com-amazonaws-bedrockagentcore-amazonbedrockagentcore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share, and the
# tree's one base64url coding of a compact-JWS segment.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `tokio` beyond the workspace's own features: `InvokeCodeInterpreter` runs a script on
# the blocking pool (`rt`), bounds how many run at once with a `sync` semaphore, and
# bounds the wait for one of those slots with `time`.
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# `regex`: runs a modelled `@pattern` against a value the request boundary's own walk does
# not reach (a map's key, a leaf inside a map entry's value) — see
# `src/service/map_entry_constraints.rs`.
regex = "1.13"
tracing = { workspace = true }
# `rquickjs`: the QuickJS JavaScript engine, embedded in this process, which is what
# actually RUNS the JavaScript a caller submits to `InvokeCodeInterpreter`'s
# `executeCode` tool — nothing about a run is synthesized. Default features only: the
# `dyn-load` feature (native module loading) is deliberately NOT enabled, and no
# module loader is installed on this runtime at all, so a submitted script can import
# nothing, and plain QuickJS exposes no filesystem, process or socket API. (The
# `loader` feature is compiled in the workspace build because the Lambda emulator's
# own engine resolves a deployment package's modules through it; a feature being
# compiled installs nothing here.) Each run is bounded by a memory limit, a stack
# limit, an interrupt deadline and an output cap, on a blocking thread — see
# `src/ops/invoke_code_interpreter.rs`.
#
# It is also a NATIVE component: `rquickjs-sys` compiles the QuickJS C sources with
# `cc` at build time, on the builder's machine and with the builder's authority, and
# that C is outside this crate's `#![forbid(unsafe_code)]`. The version is pinned and
# resolves with a checksum in Cargo.lock, so the engine every user runs is the one
# reviewed here. One version is pinned for the whole workspace, so the binary carries
# a single QuickJS.
rquickjs = "0.14"
# The AgentCore CONTROL plane, whose store owns the browsers a browser session is
# started on: `StartBrowserSession` names one it did not create, so the data plane
# resolves the `browserIdentifier` against the component that owns it rather than
# taking a session's existence on trust (src/state/browser.rs).
service-com-amazonaws-bedrockagentcorecontrol-amazonbedrockagentcorecontrol = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Percent-encodes an `@httpLabel` / `@httpQuery` value the way an AWS SDK does, so the
# test harness never hand-rolls RFC 3986 escaping.
percent-encoding = "2.3"
# Decodes one `application/vnd.amazon.eventstream` frame, so a test reads
# `InvokeCodeInterpreter`'s response the way an SDK's event-stream decoder does.
aws-smithy-eventstream = "0.60"

[lints]
workspace = true
