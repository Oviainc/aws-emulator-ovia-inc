[package]
name = "service-com-amazonaws-sts-awssecuritytokenservicev20110615"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Stable AWS unique ids (AROA…/AIDA…) are derived from a SHA-256 digest of the
# thing they name, so a role keeps one id across calls; see `src/state.rs`.
sha2 = { workspace = true }
# The IAM store in the same shared engine: the account's roles (their `RoleId`, trust
# policy and `MaxSessionDuration`) and the access keys that name their owning IAM user.
# The IAM service's OWN accessor is called rather than copied, so STS resolves a role
# against the very records `iam:CreateRole` wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The tree's ONE evaluation of IAM policy documents against a request, which is how a
# role's trust policy is read here: two services handed the same document must not
# answer differently.
service-common = { path = "../common" }
# The modelled character class a session tag's key and value must satisfy is a regular
# expression over Unicode properties, so it is matched with a maintained regex engine
# rather than by hand; see `src/state.rs`.
regex = "1.12"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }

[lints]
workspace = true
