[package]
name = "service-com-amazonaws-elasticloadbalancing-elasticloadbalancing-v7"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256, for the stable per-record id in a load balancer's generated DNS name.
sha2 = { workspace = true }
# The ELBv2 model, whose operations this crate serves on the endpoint the two models
# SHARE: an awsQuery envelope names the API version it is for, and `Version=2015-12-01`
# is answered out of that model's own service over the one shared engine (see
# `src/service/api_version.rs`). Reaching its operations needs its routing table, which
# only its crate carries.
service-com-amazonaws-elasticloadbalancingv2-elasticloadbalancing-v10 = { path = "../service-com-amazonaws-elasticloadbalancingv2-elasticloadbalancing-v10" }
# The EC2 store, which OWNS instances: a health check of a registered instance observes
# whether EC2 reports that instance running, so the inventory a check reads is EC2's own
# (`src/state/instance_checks.rs`).
service-com-amazonaws-ec2-amazonec2 = { path = "../service-com-amazonaws-ec2-amazonec2" }
# `query_error_envelope`: the `<RequestId>` element an awsQuery `<ErrorResponse>` carries
# beside its `<Error>`, which no model declares and the framework's error renderers do not
# write. Shared with the ELBv2 crate, which this front door serves on the endpoint the two
# models share, so one endpoint cannot answer two envelopes.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
