[package]
name = "service-com-amazonaws-configservice-starlingdoveservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): a rule's compliance change is published onto the
# account's default event bus with `PutEvents`, the way an Amazon Web Services service
# delivers its own events. Only the generated client is needed — the emulator supplies
# the transport, so the SDK's own HTTPS stack and runtime are left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The AWS SDK for Amazon S3, driven over the same in-process callback: a running
# configuration recorder OBSERVES the resources it records through the owning service's
# own API (`state::recording`), so the buckets it records and their configuration come
# from S3 itself rather than from another crate's state. Only the generated client is
# needed — the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false }
# The AWS SDK for Amazon SQS, driven over the same callback: a running configuration
# recorder observes this account's queues and their configuration through Amazon SQS's own
# API (`state::recording`), the way it observes every other resource type it records.
aws-sdk-sqs = { version = "1", default-features = false }
# The AWS SDK for Amazon SNS: a delivery channel "sends notifications and updated
# configuration states" to the topic its `snsTopicARN` names, so each configuration item
# Config records is published to that topic with `Publish`
# (`state::change_notification`).
aws-sdk-sns = { version = "1", default-features = false }
# `sqlparser`: the SQL `SELECT` command `SelectResourceConfig` takes is PARSED with it,
# so a malformed expression is refused because the parser cannot read it rather than
# because this emulator searched its text.
sqlparser = "0.59"
# `yaml-rust2`: a conformance pack `TemplateBody` is a YAML (or JSON, which YAML 1.2 is a
# superset of) CloudFormation template, so one YAML parser reads both spellings and
# `PutConformancePack` judges the template it IS. Pure Rust, no `unsafe`, no C.
yaml-rust2 = { version = "0.10", default-features = false }
# `flate2`: a delivered configuration snapshot is a gzip-framed object, so the snapshot
# delivery writes its payload through this crate's gzip encoder.
flate2 = "1"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# `time` lets a test await the clock-owed recorder status transition.
tokio = { workspace = true, features = ["time"] }
# S3, EventBridge, SNS and SQS are mounted beside Config on one engine in the integration
# tests: the recorder READS the resources it records from S3 and Amazon SQS, a rule's
# compliance change is published onto the default EventBridge bus, whose rule delivers it
# to an SQS queue, and a recorded configuration item is streamed to the delivery channel's
# SNS topic, whose subscriber is an SQS queue — without them mounted there is nothing to
# record and nowhere to publish.
service-com-amazonaws-s3-amazons3 = { workspace = true }
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }

[lints]
workspace = true
