[package]
name = "service-com-amazonaws-qconnect-wisdomservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` is what `GetRecommendations` waits on: `waitTimeSeconds` is a caller-requested
# long poll, so the handler sleeps between re-reads of the session's feed.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries the workspace's ONE rendering of a `@pattern` as the service
# publishes it, which this crate's constraint-violation messages state.
service-common = { path = "../common" }
# The digest the opaque `assistantId`/`sessionId` mint spreads the store's own sequence
# number over, and the hex codec that renders it (and the opaque list cursor).
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
