[package]
name = "service-com-amazonaws-signer-wallabyservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# Calendar arithmetic for a signature's expiry: a `signatureValidityPeriod` is a
# count of days, months or years, which months of unequal length rule out doing
# in seconds.
chrono = { version = "0.4", default-features = false, features = ["std"] }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec and digest for the opaque `nextToken` the profile listing hands out.
hex = { workspace = true }
sha2 = { workspace = true }
# ECDSA key generation and signing for the payload-signing data plane: the
# signature `SignPayload` answers with is made by this library, over the caller's
# payload, under the signing profile version's key pair.
aws-lc-rs = "1"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
