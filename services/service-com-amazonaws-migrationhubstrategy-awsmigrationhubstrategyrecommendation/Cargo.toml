[package]
name = "service-com-amazonaws-migrationhubstrategy-awsmigrationhubstrategyrecommendation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex-encodes the opaque pagination cursors this service's list operations issue
# (`state::encode_page_token`, shared by ListImportFileTask and ListServers).
hex = { workspace = true }
# Fingerprints the selection a ListServers page was taken under, so its cursor stays
# short and is only accepted back for the same list.
sha2 = { workspace = true }
# Amazon S3 client StartImportFileTask writes the import's status report object with,
# over the in-process callback into this same emulator (no network client feature is
# enabled: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The import status report suite mounts the S3 service beside Strategy Recommendations on
# one engine, because StartImportFileTask writes its status report object there by calling
# S3 in process and the suite reads that object back.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
