[package]
name = "service-com-amazonaws-amplifybackend-amplifybackend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `hex` renders the opaque `ListBackendJobs` pagination token, so a position in this
# service's own job order travels as bytes the caller cannot read as a job id.
hex = { workspace = true }
# The S3 service's bucket store: `ListS3Buckets` reports the S3 buckets the account
# holds, which S3 owns, so it is read from S3's own state in the shared engine rather
# than kept a second time here.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# `sha2` derives the `ETag` validator this service puts on an error response from the
# response bytes themselves (see `service.rs`).
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` is for the integration tests' `tokio::time::sleep`, which waits out a job's
# completion delay without parking the test runtime's worker.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
