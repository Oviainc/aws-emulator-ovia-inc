[package]
name = "service-com-amazonaws-sagemaker-sagemaker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque NextToken (the page boundary, encoded) this service's
# listings mint, and for rendering the hex id a lineage entity's ARN carries.
hex = { workspace = true }
# Digest behind `state::mint_opaque_resource_id`, the one scheme every server-generated
# id in this service is minted with (cluster/compute-quota/scheduler-config ids, EC2
# instance ids, node logical ids, presigned-URL grant tokens).
sha2 = { workspace = true }
# RFC 3986 percent-encoding, for the authorization token a presigned MLflow URL carries
# in a query parameter (the minted secret's alphabet includes `+` and `/`).
percent-encoding = "2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
