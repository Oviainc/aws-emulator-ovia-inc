[package]
name = "service-com-amazonaws-ssmincidents-ssmincidents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque `nextToken` encoding for ListIncidentRecords.
hex = { workspace = true }
# Incident-record ids: Incident Manager names each record with a UUID.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# Percent-encoding for the `@httpQuery`-bound ARNs the integration tests send.
percent-encoding = "2"

[lints]
workspace = true
