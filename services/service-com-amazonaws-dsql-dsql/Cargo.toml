[package]
name = "service-com-amazonaws-dsql-dsql"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the entropy half of a minted cluster identifier (a ULID).
sha2 = { workspace = true }
# Encodes the opaque `nextToken` cursor ListClusters pages with.
hex = { workspace = true }
# `kinesis_client` / `iam_role` / `arn`: the shared in-process clients a CreateStream
# resolves its `targetDefinition` through — the delivery service's own streams and this
# account's IAM records — and the one reading of a caller-supplied ARN's Region.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` on top of the workspace features: the clock-settling tests await the due
# instant rather than blocking the runtime thread.
tokio = { workspace = true, features = ["time"] }
# Amazon Kinesis and IAM, mounted beside Aurora DSQL on one engine so the stream-target
# suite resolves a `targetDefinition` against the very streams and roles a client created
# through those services' own APIs.
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Percent-encodes the form fields the IAM query-protocol requests in that suite carry.
percent-encoding = "2.3"

[lints]
workspace = true
