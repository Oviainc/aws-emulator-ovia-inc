[package]
name = "service-com-amazonaws-licensemanagerlinuxsubscriptions-licensemanagerlinuxsubscriptions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes this service's opaque pagination cursors.
hex = { workspace = true }
# The Secrets Manager client `RegisterSubscriptionProvider` reads the subscription
# provider's access token through, over the in-process callback into this same emulator (no
# network client feature is enabled: the transport is the emulator's own).
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `jwt`: the shared reading of a compact JWS, which the provider access token held in that
# secret is — the one reading of a token in this tree, bound included.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The registration suites mount Secrets Manager beside this service on one engine, because
# `RegisterSubscriptionProvider` reads the secret its `SecretArn` names by calling it.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }

[lints]
workspace = true
