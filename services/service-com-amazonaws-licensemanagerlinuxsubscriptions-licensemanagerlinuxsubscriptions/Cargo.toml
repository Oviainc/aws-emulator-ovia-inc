[package]
name = "service-com-amazonaws-licensemanagerlinuxsubscriptions-licensemanagerlinuxsubscriptions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes this service's opaque pagination cursors.
hex = { workspace = true }
# SHA-256 over the description of the list a pagination cursor belongs to, so the cursor
# binds to that list at a fixed size instead of carrying the request's whole selection.
sha2 = { workspace = true }
# The Secrets Manager client `RegisterSubscriptionProvider` reads the subscription
# provider's access token through, over the in-process callback into this same emulator (no
# network client feature is enabled: the transport is the emulator's own).
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# `jwt`: the shared reading of a compact JWS, which the provider access token held in that
# secret is — the one reading of a token in this tree, bound included.
service-common = { path = "../common" }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): Linux subscription discovery reads the account's EC2
# instance inventory and the AMIs those instances were launched from, which are EC2's
# resources, so `src/state/discovery.rs` asks the service that owns them instead of keeping
# an inventory of its own. Only the generated client is needed — the emulator supplies the
# transport.
aws-sdk-ec2 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The registration suites mount Secrets Manager beside this service on one engine, because
# `RegisterSubscriptionProvider` reads the secret its `SecretArn` names by calling it.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
# The EC2 service, mounted beside this one in the discovery suite: that the instances a
# client launched are the ones the two discovery lists report can only be driven end to end
# with the owner of instances and AMIs on the same engine. DEV-ONLY for this crate's own
# suites; `src/` names no other service's crate.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
