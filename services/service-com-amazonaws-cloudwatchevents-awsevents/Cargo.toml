[package]
name = "service-com-amazonaws-cloudwatchevents-awsevents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The `EventId` `PutEvents` answers with is derived from the store's own
# counter through SHA-256 and laid out as a UUID; these two do that.
sha2 = { workspace = true }
hex = { workspace = true }
# `event_pattern`: the ONE reading and matching of the EventBridge event-pattern
# language, shared with every other service whose API accepts one, so a pattern this
# service stores and a pattern another service filters with are read the same way.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
