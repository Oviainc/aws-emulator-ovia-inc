[package]
name = "service-com-amazonaws-entityresolution-awsveniceservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `addresses_modeled_http_route`: the one reader that decides which operation a request
# ADDRESSES when the REST router's required-header discrimination matched no route.
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource), which this service's authorization gate runs.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks for, and
# the STS store resolves WHICH principal a request is: the authorization gate reads both
# services' OWN state accessors rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The AWS Glue Data Catalog holds the TABLE every `InputSource$inputSourceARN` of a matching
# workflow names: a matching job's run resolves each input table — where its objects live and
# what its columns are — through Glue's own state accessor rather than keeping a second copy
# of the catalog.
service-com-amazonaws-glue-awsglue = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Deterministic Data Exchange identifiers for the provider-service catalog entries
# (`ProviderMarketplaceConfiguration`): the first 16 bytes of SHA-256 over the entry,
# rendered as hex.
sha2 = { workspace = true }
hex = { workspace = true }
# The Amazon S3 client a matching job's run reads its input tables through and writes its
# output table with, over the in-process callback into this same emulator (no network client
# feature: the transport is the emulator's own, so no socket is opened and no host is
# resolved).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Reads the comma-separated input tables a matching job matches and writes its output table;
# a library computing over data in this process, with no native or build-time code.
csv = "1.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The account's own IAM records, mounted beside this service on one shared engine by the
# role-resolution suite: a write that hands this service a `roleArn` asks IAM about that
# role over the emulator's in-process callback, so IAM has to be there to answer.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The authorization suite makes the principals it calls as through IAM's and STS's own
# operations, so the policies the gate reads are the ones those services wrote.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Amazon S3, mounted beside Entity Resolution on one engine by the matching-run suite: a job
# run reads the objects a test staged with `PutObject` and writes its output table where
# `ListObjectsV2` then lists it.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
