[package]
name = "service-com-amazonaws-sfn-awsstepfunctions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `query_error_envelope`: the one statement, shared by every emulated service, of the
# response header a response names the request it answers in.
# `jsonata`: the shared bounded seam onto the maintained JSONata interpreter, which
# states and enforces the ceilings that confine an engine evaluating a caller's own
# text — how this crate evaluates the other query language the Amazon States
# Language's `QueryLanguage` member selects, rather than through a hand-written subset
# or a call site of that engine here.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` is for `GetActivityTask`'s long poll: it holds the request open with
# `tokio::time::sleep` between looks at the store, instead of blocking a thread.
# `sync` is the channel a `Task` state's integration call is handed over on, from
# the blocking thread the walk runs on to the async request that makes the call.
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# Signs the in-process call a `Task` state's service integration makes to the service
# that owns the operation: the emulator verifies every request signature, and the
# credential scope is what routes the call. The SDK's own signer, as the emulator's
# verifier uses; `http1` carries `apply_to_request_http1x`, which puts the signature on
# the `http` 1.x request `state::integration` builds.
aws-sigv4 = { version = "1", features = ["http1"] }
# The identity (access key pair) that signer signs with, and the provider the
# emulator's own callback hands out.
aws-credential-types = "1"
# JSONPath: the query language every Amazon States Language `*Path` member is
# written in, evaluated by this maintained RFC 9535 implementation rather than a
# hand-written subset.
serde_json_path = "0.7"
tracing = { workspace = true }
# The key policy of a state machine's customer managed KMS key, and the ONE decision
# KMS makes about it: read out of the KMS service's own store, so this service and KMS
# cannot disagree about what a key permits the caller of a read.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The identity-based policies in force on a state machine's EXECUTION ROLE, which is
# what a `Task` state's integration call is made as: read out of IAM's own store, so
# this service judges that call against the documents IAM's handlers wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The service a `Task` state's integration call is made to in `tests/all/task_integrations.rs`:
# mounted beside Step Functions on the one engine the test router builds, the same shape
# `core/router/src/lib.rs` mounts them in, so the call a task makes is served for real.
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }

[lints]
workspace = true
