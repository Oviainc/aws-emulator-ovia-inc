[package]
name = "service-com-amazonaws-s3-amazons3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# An object's ETag and the `Content-MD5` request header are both the MD5 digest of the
# payload, so storing or checking either needs a real MD5 implementation.
md-5 = "0.10"
# Renders that digest as the lowercase hex an ETag carries.
hex = { workspace = true }
# An object version id is the SHA-256 of the bucket, the key and the store's mint
# sequence, Base64 encoded (`state::mint_version_id`).
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Reads the restXml bodies the tagging tests assert on, instead of slicing strings.
quick-xml = "0.41"

[lints]
workspace = true
