[package]
name = "service-com-amazonaws-s3-amazons3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# An object's ETag and the `Content-MD5` request header are both the MD5 digest of the
# payload, so storing or checking either needs a real MD5 implementation.
md-5 = "0.10"
# Renders that digest as the lowercase hex an ETag carries.
hex = { workspace = true }
# An object version id is the SHA-256 of the bucket, the key and the store's mint
# sequence, hex encoded (`state::mint_version_id`), and SHA-512 is one of the checksum
# algorithms an object may be stored with (`state::checksum_digest`).
sha2 = { workspace = true }
# The five checksum algorithms S3 publishes for an object (`CRC32`, `CRC32C`, `CRC64NVME`,
# `SHA1`, `SHA256`), computed by the AWS SDK's own implementation of them rather than by
# anything hand-rolled here (`state::checksum_digest`).
aws-smithy-checksums = "0.65"
# The three `XXHASH` checksum algorithms the model's `ChecksumAlgorithm` also names, which
# no other crate in this workspace implements (`state::checksum_digest`).
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
# `encoding-type=url` asks a listing to percent-encode the key-name elements of its
# response ("non-ASCII characters that are used in an object's key name will be
# percent-encoded according to UTF-8 code values" — the `EncodingType` enum's own
# documentation), which is exactly RFC 3986 percent-encoding over a chosen character set.
percent-encoding = "2"
# Normalizes the ONE member this service's model marks `@xmlAttribute` between the
# attribute the API publishes and the element the framework's XML codec binds
# (`src/service/wire.rs`), rather than editing XML documents as strings.
quick-xml = "0.41"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `quick-xml` above is also what the tests read a restXml body with.

[lints]
workspace = true
