[package]
name = "service-com-amazonaws-s3-amazons3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The shared ARN parse: a notification destination's stored ARN is read for the Region it
# names and the queue it addresses through the one parse every service reads an ARN with.
service-common = { path = "../common" }
# The KMS store holds the key an SSE-KMS object was encrypted under, its key policy and
# the authorization decision over it: a read that serves such an object's bytes asks that
# service's own `kms:Decrypt` gate rather than keeping a second copy of either
# (`state::sse_kms`).
service-com-amazonaws-kms-trentservice = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# The clock a delivery task is bounded by: `tokio::time::timeout` abandons one request's
# object-event fan-out past `state::notifications::DELIVERY_DEADLINE`.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# An object's ETag and the `Content-MD5` request header are both the MD5 digest of the
# payload, so storing or checking either needs a real MD5 implementation.
md-5 = "0.10"
# Renders that digest as the lowercase hex an ETag carries.
hex = { workspace = true }
# An object version id is the SHA-256 of the bucket, the key and the store's mint
# sequence, hex encoded (`state::mint_version_id`), and SHA-512 is one of the checksum
# algorithms an object may be stored with (`state::checksum_digest`).
sha2 = { workspace = true }
# The five checksum algorithms S3 publishes for an object (`CRC32`, `CRC32C`, `CRC64NVME`,
# `SHA1`, `SHA256`), computed by the AWS SDK's own implementation of them rather than by
# anything hand-rolled here (`state::checksum_digest`).
aws-smithy-checksums = "0.65"
# The three `XXHASH` checksum algorithms the model's `ChecksumAlgorithm` also names, which
# no other crate in this workspace implements (`state::checksum_digest`).
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh3"] }
# Renders an instant as the calendar date S3's `<ArgumentValue>` reports a refused
# timestamp as (`state::refused_timestamp_text`), weekday and month names included.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The zone that rendering names: a real zone, so the abbreviation is the one the instant
# falls in rather than a fixed offset spelled by hand.
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
# `encoding-type=url` asks a listing to percent-encode the key-name elements of its
# response ("non-ASCII characters that are used in an object's key name will be
# percent-encoded according to UTF-8 code values" — the `EncodingType` enum's own
# documentation), which is exactly RFC 3986 percent-encoding over a chosen character set.
percent-encoding = "2"
# Normalizes the ONE member this service's model marks `@xmlAttribute` between the
# attribute the API publishes and the element the framework's XML codec binds
# (`src/service/wire.rs`), rather than editing XML documents as strings.
quick-xml = "0.41"
# The AWS SDKs for the four destinations a bucket's event notification configuration
# publishes to, driven over the in-process callback (`OperationContext::callback`): an
# object event becomes a `PutEvents` onto the default event bus, a `SendMessage`, a
# `Publish` or an asynchronous `Invoke` (`state::notifications`). Only the generated
# clients are needed — the emulator supplies the transport, so the SDKs' own HTTPS stacks
# and runtimes are left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
aws-sdk-sqs = { version = "1", default-features = false }
aws-sdk-sns = { version = "1", default-features = false }
aws-sdk-lambda = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `quick-xml` above is also what the tests read a restXml body with.
# EventBridge, SQS and Lambda are mounted beside S3 in the event-notification test:
# without them there is nowhere for an object event to be delivered, and what that suite
# asserts is the message each destination really received.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }
# The SSE-KMS read suite makes the principals its key policies name through IAM's and STS's
# own operations (`CreateRole` + `PutRolePolicy` + `AssumeRole`), so the role sessions and
# the documents the decision reads are the ones those services wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[lints]
workspace = true
