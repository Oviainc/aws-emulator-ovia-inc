[package]
name = "service-com-amazonaws-rdsdata-rdsdataservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The SQL engine this service's data plane runs on: caller statements are parsed,
# planned and executed by SQLite in-process, never by a hand-written SQL subset.
# DELIBERATE: `bundled` compiles SQLite's C sources here (libsqlite3-sys + `cc` run
# on the build host) rather than linking whatever the host happens to ship, so the
# engine version is pinned by Cargo.lock and reproducible.
# `backup` copies a database for a transaction's snapshot, `column_decltype`
# supplies the declared type of each result column for `columnMetadata`, `functions`
# defines the ONE function this data plane adds (the reader of a binary value's
# documented input format), `hooks`
# installs BOTH the progress handler that bounds a statement and the default-deny
# authorizer that confines it, and `limits` sets the engine's size, depth and
# ATTACH limits. Every escape this re-opens is closed in `Database::open` (see the
# `src/state.rs` module docs): ATTACH/DETACH (and so `VACUUM INTO`), PRAGMA,
# foreign virtual tables and the file-touching SQL functions are refused by the
# authorizer, extension loading is off, defensive mode is on, and memory, value
# size, statement size, expression depth and query complexity are all capped.
#
# PINNED at 0.41, the release reviewed and built here: it is the first one whose
# `libsqlite3-sys` (0.39) carries a SQLite C library without RUSTSEC-2026-0459 (a
# page-cache disclosure through an undersized-page WAL file, fixed in SQLite 3.54.0),
# which 0.37's `libsqlite3-sys` 0.35 shipped. The two components 0.41 adds —
# `sqlite-wasm-rs` and its `rsqlite-vfs` — are gated to `wasm32` upstream and are not
# linked into a host build, so the engine in the process is still one bundled SQLite.
# `tests/all/engine_release_floor.rs` asserts the linked release against that floor.
rusqlite = { version = "0.41", features = ["bundled", "backup", "column_decltype", "functions", "hooks", "limits"] }
# The PostgreSQL and MySQL parsers in front of that engine: a Data API statement is
# written in the dialect of the engine the caller addresses, so it is parsed with this
# crate's PostgreSQL dialect and, failing that, its MySQL one, and rendered
# back out in the form the engine's own grammar accepts. `visitor` is what walks
# the parsed statement to rewrite it; no SQL text is inspected by hand.
sqlparser = { version = "0.59", features = ["visitor"] }
# Opaque, unique transaction identifiers for BeginTransaction.
uuid = { version = "1", features = ["v4"] }
# The calendar and clock behind the DATE/TIME/TIMESTAMP `typeHint`s: a hinted
# string is accepted only if this crate parses it as the date or time the model's
# documented format names, and a time of day is RENDERED back out by it at the
# precision that format carries, so no date arithmetic or format parsing is written
# here. Same version the rest of the tree pins.
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing", "macros", "std"] }
# Hexadecimal: the INPUT FORMAT PostgreSQL documents for a binary value is a `\x`
# prefix and two hex digits per byte, so the digits are decoded by this crate's codec
# rather than by a loop written here — and this crate's suites write a byte string as
# hex text for the same reason.
hex = { workspace = true }
# `iam_authorization` / `iam_role`: the tree's ONE evaluation of IAM policy documents
# against (action, resource), and the readings of a principal ARN, used by the
# authorization leg of the request precondition chain (`src/state/authorization.rs`).
# `stable_hex_id`: the digest the opaque transaction id a BeginTransaction mints carries
# its resource binding as, taken from the same shared module rather than written again here.
service-common = { path = "../common" }
# The CLUSTER a request addresses is Amazon RDS's resource, so whether it exists, whether
# its Data API HTTP endpoint is turned on and which user it was created with are ASKED of
# that service: the AWS SDK driven over the emulator's own in-process transport, through
# the operation callback, so this crate names no other service's crate and an emulator
# assembled without Amazon RDS is told apart from one that holds no such cluster.
aws-sdk-rds = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The identity a request speaks for and the policies in force on it: the IAM store maps
# an access key id to the user that holds it and holds that user's documents, and the STS
# store resolves a session credential. No API answers "whose key is this", which is why
# these stores are read rather than called.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The SECRET a request names is Secrets Manager's resource, and its value is sealed under
# the key the secret names — only its owner can open it. So it is RETRIEVED the way any
# emulated service reaches another: the AWS SDK driven over the in-process callback.
aws-sdk-secretsmanager = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The SAME SQL engine binding this crate's data plane runs on (see `[dependencies]`),
# so `engine_release_floor` can read which engine release the workspace actually
# linked rather than infer it from the lock file.
rusqlite = { version = "0.41", features = ["bundled"] }
# The owners of the cluster, the secret and the caller's identity, mounted beside this
# service in the precondition suite so the facts the Data API resolves are real resources
# of this emulator, created through those services' own operations.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
service-com-amazonaws-kms-trentservice = { workspace = true }
service-com-amazonaws-rds-amazonrdsv19 = { workspace = true }

[lints]
workspace = true
