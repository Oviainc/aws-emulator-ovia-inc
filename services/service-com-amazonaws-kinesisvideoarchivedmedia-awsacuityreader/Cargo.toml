[package]
name = "service-com-amazonaws-kinesisvideoarchivedmedia-awsacuityreader"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `validation_message`: the shared wording of a framework-level constraint refusal —
# AWS's envelope, its clauses, and the element constraint set a collection member's
# clause states — so this service's `override_refusal` chooses the rendering rather
# than re-implementing it.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The Kinesis Video Streams control plane's own store: `CreateStream` is what creates
# the streams this read plane serves, so a stream's existence, ARN and current
# retention are read from that state in the shared engine rather than kept a second
# time here.
service-com-amazonaws-kinesisvideo-kinesisvideo-20170930 = { workspace = true }
# Decodes the frame a fragment's archived bytes carry and re-encodes it in the format
# `GetImages` was asked for (PNG, JPEG, at a requested size and JPEG quality).
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
