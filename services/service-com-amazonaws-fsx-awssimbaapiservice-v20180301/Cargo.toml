[package]
name = "service-com-amazonaws-fsx-awssimbaapiservice-v20180301"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The fixed-size digest the `@idempotencyToken` comparison remembers per client request
# token, and the hex codec the opaque pagination `NextToken` is built with (hex's alphabet
# is a subset of the modelled base64-shaped `NextToken` pattern).
sha2 = { workspace = true }
hex = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the subnets a `CreateFileSystem` places a file system in
# are EC2's resources, so `src/state/ec2_subnets.rs` asks EC2 what the account has rather
# than deciding it here. Only the generated client is needed — the emulator supplies the
# transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# `arn::region_label`: the ONE reading of a caller-supplied Region as a Region LABEL,
# which is what the endpoint the EC2 call above is made at is built from.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The EC2 service, mounted beside this one in the test harness: that a file system can be
# created in a subnet a client minted with `ec2:CreateSubnet` can only be driven end to end
# with the owner of subnets on the same engine. DEV-ONLY: this crate depends on no other
# service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
