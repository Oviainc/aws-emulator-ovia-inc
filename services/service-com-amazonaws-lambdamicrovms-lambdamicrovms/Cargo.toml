[package]
name = "service-com-amazonaws-lambdamicrovms-lambdamicrovms"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` ListMicrovms pages with, and renders the
# digest a MicroVM endpoint recognises an authentication token by.
hex = { workspace = true }
# Digests a MicroVM endpoint authentication token, so the store holds no token secret,
# and the opaque bytes a minted MicroVM image `id` is rendered from.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Builds the opaque `nextToken` candidates the pagination suites hand back.
hex = { workspace = true }
# `tokio::time::sleep` for the clock-owed transitions the tests wait out.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
