[package]
name = "service-com-amazonaws-pcaconnectorscep-pcaconnectorscep"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mixes the per-identifier counter and the clock into the UUID-format connector/challenge
# ids and the challenge passwords the ARN patterns and the `Password` member's doc require.
sha2 = { workspace = true }
# Lays those digest bytes out as a UUID: the version and variant nibbles, and the canonical
# hyphenated rendering (see `state::new_uuid`). No feature is named because
# `Builder::from_random_bytes` needs none — the bytes come from the digest above, not from
# `uuid`'s own generators, so the `v4` feature other crates here enable is deliberately off.
uuid = "1"
# Hex: the opaque `NextToken` both listings page with.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
