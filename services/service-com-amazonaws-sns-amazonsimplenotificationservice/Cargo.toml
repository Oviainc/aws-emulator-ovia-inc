[package]
name = "service-com-amazonaws-sns-amazonsimplenotificationservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# The policy and delivery-policy documents SNS answers with are serialized from typed
# structs, so their members keep SNS's own order rather than being sorted by key.
serde = { workspace = true }
tracing = { workspace = true }
# The content-based MessageDeduplicationId of a FIFO publish is a SHA-256 of the body,
# and the message/subscription ids are formatted from a SHA-256 digest.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
