[package]
name = "service-com-amazonaws-agentregistrycontrol-agentregistrycontrol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` ListRegistryRecords hands out.
hex = { workspace = true }
# The claim rule for a service under a signing name it shares with a peer; the ONE ARN
# parse; and the shared home for how a service states the framework's constraint refusal.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# `time` is for the integration tests' wait past a clock-owed transition; the workspace
# tokio feature set covers only `#[tokio::test]` itself.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
