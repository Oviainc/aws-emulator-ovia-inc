[package]
name = "service-com-amazonaws-odb-odb"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Unique opaque ids for the resources this service mints (odbNetworkId).
uuid = { version = "1", features = ["v4"] }
# Hex codec for the opaque `nextToken` the list operations issue and parse back.
hex = { workspace = true }
# IPv4 CIDR parsing and containment, for the client/backup subnet constraints the
# model documents (no overlap, no OCI-reserved range).
ipnet = "2"
# Regex with look-around, for the `@pattern` constraints this service's model writes
# with a negative lookahead (`ResourceDisplayName`): the vendored boundary validator
# compiles patterns with the `regex` crate, which has no look-around and therefore
# passes such a pattern unchecked.
fancy-regex = "0.16"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
