[package]
name = "service-com-amazonaws-transcribe-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Amazon S3 client the custom-vocabulary and vocabulary-filter creates and updates
# store the text file their reported `DownloadUri` serves through, over the in-process
# callback into this same emulator (no network client feature is enabled: the
# transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The download-content suite mounts the S3 service beside Transcribe on one engine,
# because a vocabulary's and a filter's content is stored in object storage by calling
# S3 in process, and the suite fetches the reported location back.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
