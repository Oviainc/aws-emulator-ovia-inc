[package]
name = "service-com-amazonaws-b2bi-b2bi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Hex codec for the opaque `nextToken` the @paginated List operations issue.
hex = { workspace = true }
# JSONata interpreter: `TestMapping` evaluates the caller's mapping template through it
# (an execution substrate — `src/ops/test_mapping.rs`'s module docs carry the bounds it
# runs under and the engine's whole builtin surface). `default-features = false`: the
# emulator needs nothing the crate turns on by default. Pinned EXACTLY, not by caret:
# that handler's step gate reads the engine's own parsed AST, so the version whose node
# shapes it was verified against is the version it gets. Declared here rather than in the
# root `[workspace.dependencies]`, which a service crate does not get to edit.
jsonata-rs = { version = "=0.3.4", default-features = false }
# The arena `jsonata-rs` allocates its parsed expressions and values into: one per
# evaluation, dropped with it. Pinned EXACTLY for the same reason as the interpreter:
# `src/ops/test_mapping.rs` enforces its memory ceiling through this crate's allocation
# limit and the panic it raises when it refuses. Declared here rather than in the root
# `[workspace.dependencies]`, which a service crate does not get to edit.
bumpalo = "=3.20.3"
# The CloudWatch Logs client CreateProfile provisions a logging-ENABLED profile's log
# group with, over the in-process callback into this same emulator (no network client
# feature is enabled: the transport is the emulator's own).
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `sync` and `time`: the evaluation permit and the evaluation deadline that bound the
# caller-supplied mapping template in `src/ops/test_mapping.rs`.
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# `serde::Serialize` for the starter mapping template's document tree, so a segment's
# elements keep their positional order (a `serde_json::Value` map would sort them).
serde = { workspace = true }
# XML writer for the XSLT starter mapping template (it escapes and indents the
# stylesheet this service generates) and XML reader for the test-harness operations
# (checking that a document handed to them really is the XML, or XSLT, it was declared
# to be). Same version the vendored framework uses.
quick-xml = "0.41"
tracing = { workspace = true }
# SHA-256 for the `@idempotencyToken` request digest CreateTransformer stores, so a
# replay can tell the same request from a different one under a used token.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The b2bi tests mount the CloudWatch Logs service beside b2bi on one engine, because
# CreateProfile provisions a logging-ENABLED profile's log group by calling it.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }

[lints]
workspace = true
