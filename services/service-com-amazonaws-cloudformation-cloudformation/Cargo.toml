[package]
name = "service-com-amazonaws-cloudformation-cloudformation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The clients the CloudFormation resource provisioner calls Amazon S3 and IAM through for
# a stack's declared buckets and roles, over the in-process callback into this same
# emulator (no network client feature: the transport is the emulator's own). See
# `state::provisioner`.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-iam = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `tokio::time` drives the tests' wait past a stack transition's due instant.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Signs the in-process call a stack's resource provisioning makes to the service that
# owns the resource: the emulator verifies every request signature, and the credential
# scope is what routes the call. The SDK's own signer, as the emulator's verifier uses;
# `http1` is the feature that carries `apply_to_request_http1x`, which puts the signature
# on the `http` 1.x request this crate builds.
aws-sigv4 = { version = "1", features = ["http1"] }
# The identity (access key pair) that signer signs with, and the provider the emulator's
# own callback hands out.
aws-credential-types = "1"
# Hex-encodes the opaque `NextToken` cursor a paginated read hands out, and the digest
# behind every minted stack id, event id and operation id.
hex = { workspace = true }
# Digests the counter + instant behind each minted identifier (see `state::new_identifier`).
sha2 = { workspace = true }
# Reads the XML document an awsQuery service answers a provisioning call with (the ARN
# its create minted, the error code of a refusal). The same maintained XML reader the
# emulator's own restXml services use.
quick-xml = "0.41"
# Percent-encodes the parameters of an awsQuery provisioning call, as its form body and
# the SigV4 canonical request over it need. The same encoder the emulator's own request
# verifier uses (`vendor/server/src/request_authentication.rs`).
percent-encoding = "2"
# Reads the `TemplateURL` of a template submitted by reference — its scheme, host, path and
# `versionId` query — rather than hand-rolling a URL parser over caller-supplied text
# (`state::template_url`).
url = "2"
# A CloudFormation template body is JSON *or* YAML ("You can write CloudFormation
# templates in JSON or YAML"), and the YAML spelling carries the short-form intrinsic
# tags (`!Ref`, `!GetAtt`) that give a template its meaning. yaml-rust2 is a pure-Rust
# YAML 1.2 implementation whose event stream reports those tags, which a loaded tree
# drops.
yaml-rust2 = { version = "0.10", default-features = false }
# `iam_trust_policy`: the one reading of an IAM trust policy, shared with every other
# service that resolves a caller-supplied service role before it writes.
service-common = { path = "../common" }
# The IAM store a stack operation resolves its `RoleARN` against, to check the role's
# trust policy lets cloudformation.amazonaws.com assume it before the stack is written.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Writes the .zip deployment package an `AWS::Lambda::Function` declaring INLINE code is
# created from: a template states that function's source TEXT, while Lambda's `ZipFile`
# member is the bytes of an archive, so the source is archived in memory rather than with a
# hand-rolled writer (`state::provisioning::lambda_function`). It also READS the ZIP archive
# an extension's schema handler package arrives as, so the schema `RegisterType` registers is
# the one the package carries (`ops::register_type`).
zip = { version = "9", default-features = false, features = ["deflate"] }
# The service principal an `AWS::Lambda::Function`'s execution role has to admit, and the
# sentence AWS Lambda refuses a create naming a role it cannot assume with: the stack
# resolves that role against this account's IAM before it hands it over, and the refusal is
# worded once, by the service that owns it.
service-com-amazonaws-lambda-awsgirapiservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# URL-form-encodes the request bodies this crate's integration tests send (the encoder
# behind the `url` crate), so no test suite hand-rolls a percent-encoder.
form_urlencoded = "1"
# The suites here deploy templates declaring resources of types `state::provisioning`
# creates in the service that OWNS them, so those services are mounted beside
# CloudFormation on the one engine the test router builds — the same shape
# `core/router/src/lib.rs` mounts them in.
service-com-amazonaws-s3-amazons3 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-codepipeline-codepipeline-20150709 = { workspace = true }
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
service-com-amazonaws-rds-amazonrdsv19 = { workspace = true }
# AWS Systems Manager, for the `AWS::SSM::Parameter` a stack really creates there
# (`state::provisioner`): a suite that deploys one must have its owning service mounted
# beside CloudFormation, or the create is refused and the stack fails.
service-com-amazonaws-ssm-amazonssm = { workspace = true }
# Amazon EC2, for the `AWS::EC2::VPC` and `AWS::EC2::Subnet` a stack really creates there:
# the suites that deploy a network read the VPC and its subnets back through EC2's own wire.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# Amazon DynamoDB, for the `AWS::DynamoDB::Table` a stack really creates there — including
# the one an `AWS::Serverless::SimpleTable` becomes — so a suite that deploys one reads the
# table, and the stream its specification enabled, back through DynamoDB's own wire.
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }
# Amazon Cognito Identity, for the `AWS::Cognito::IdentityPool` and its
# `AWS::Cognito::IdentityPoolRoleAttachment` a stack really creates there
# (`state::provisioning::cognito_identity_pool`): a suite that deploys one must have its
# owning service mounted beside CloudFormation, or the create is refused and the stack fails.
service-com-amazonaws-cognitoidentity-awscognitoidentityservice = { workspace = true }
# AWS Step Functions, for the `AWS::StepFunctions::StateMachine` a stack really creates
# there — including the one an `AWS::Serverless::StateMachine` becomes
# (`state::provisioning::step_functions_state_machine`): a suite that deploys one must have
# its owning service mounted beside CloudFormation, or the create is refused and the stack
# fails.
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }

[lints]
workspace = true
