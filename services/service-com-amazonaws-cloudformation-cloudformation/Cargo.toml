[package]
name = "service-com-amazonaws-cloudformation-cloudformation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `tokio::time` drives the tests' wait past a stack transition's due instant.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex-encodes the opaque `NextToken` cursor a paginated read hands out, and the digest
# behind every minted stack id, event id and operation id.
hex = { workspace = true }
# Digests the counter + instant behind each minted identifier (see `state::new_identifier`).
sha2 = { workspace = true }
# A CloudFormation template body is JSON *or* YAML ("You can write CloudFormation
# templates in JSON or YAML"), and the YAML spelling carries the short-form intrinsic
# tags (`!Ref`, `!GetAtt`) that give a template its meaning. yaml-rust2 is a pure-Rust
# YAML 1.2 implementation whose event stream reports those tags, which a loaded tree
# drops.
yaml-rust2 = { version = "0.10", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
