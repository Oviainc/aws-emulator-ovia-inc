[package]
name = "service-com-amazonaws-transfer-transferservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Codec for the opaque `NextToken` the List* operations hand out (see `src/state.rs`).
hex = { workspace = true }
# OpenSSH key formats: generates a server's host key and computes the Base64 SHA256
# fingerprint `DescribedServer.HostKeyFingerprint` reports (see `src/state.rs`).
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "getrandom"] }
# `arn::parse`: the ONE shared ARN parse, which the authorization gate reads a role
# ARN's account and resource fields through; `iam_authorization`: the ONE shared
# evaluation of IAM policy documents, which makes that gate's decision.
service-common = { path = "../common" }
# The account's IAM store: the authorization gate reads the calling principal's
# identity policies, and an API_GATEWAY invocation role's, out of it
# (see `src/state/authorization.rs`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Generates the OpenSSH host key the HostKey round-trip test supplies, and computes the
# fingerprint it expects back, independently of the handler under test.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "getrandom"] }
# `time` for the clock-due start-transition test's `tokio::time::sleep`.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
