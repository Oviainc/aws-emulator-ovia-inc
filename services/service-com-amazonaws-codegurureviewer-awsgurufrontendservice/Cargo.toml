[package]
name = "service-com-amazonaws-codegurureviewer-awsgurufrontendservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination tokens: hex codec for the list cursor.
hex = { workspace = true }
# Resource ids: SHA-256 over the store's unique sequence plus per-process entropy, laid out
# as the v4 UUID the model's AssociationArn pattern requires.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The integration suite waits out a clock-owed transition, which needs tokio's time driver
# (the workspace default enables only `macros` and the runtimes).
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
