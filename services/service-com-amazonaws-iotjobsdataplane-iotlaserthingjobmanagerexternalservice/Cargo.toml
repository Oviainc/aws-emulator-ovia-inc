[package]
name = "service-com-amazonaws-iotjobsdataplane-iotlaserthingjobmanagerexternalservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The IoT job-execution store, shared with the IoT control plane that creates an
# execution when a job targets a thing (`services/common`).
service-common = { path = "../common" }
# Digest behind the minted executionId and the clientToken idempotency fingerprint.
sha2 = { workspace = true }
# Renders those digests as the hex an executionId's pattern allows.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
