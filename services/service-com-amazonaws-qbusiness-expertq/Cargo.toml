[package]
name = "service-com-amazonaws-qbusiness-expertq"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination cursors: hex-encode the internal list cursor so `nextToken` is a
# single-token string a client only ever echoes back.
hex = { workspace = true }
# Server-generated resource ids: a hyphenated UUID is exactly the 36-char
# `^[a-zA-Z0-9][a-zA-Z0-9-]{35}$` shape this service's `ApplicationId`/`IndexId` model.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
