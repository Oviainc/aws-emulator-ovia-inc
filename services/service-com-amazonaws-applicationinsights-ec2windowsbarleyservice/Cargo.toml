[package]
name = "service-com-amazonaws-applicationinsights-ec2windowsbarleyservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
# AWS's own wording for a refusal the framework describes structurally, shared
# across services: a constraint broken by a collection's elements is reported at
# the collection member with the element shape's whole constraint set.
service-common = { path = "../common" }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `NextToken` the paginated List* operations emit.
hex = { workspace = true }
# Reads the base64 payload a pagination token carries, so a token this service
# did not issue is refused by the schema that payload declares.
base64 = "0.22"
# Resolves the resource group an application is created over against Resource
# Groups, driven over the in-process callback (`OperationContext::callback`):
# a resource group is Resource Groups' resource, so `CreateApplication` asks it
# rather than assuming the group exists. Only the generated client is needed —
# the emulator supplies the transport.
aws-sdk-resourcegroups = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
sha2 = { workspace = true }

[lints]
workspace = true
