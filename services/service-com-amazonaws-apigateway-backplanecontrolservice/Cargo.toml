[package]
name = "service-com-amazonaws-apigateway-backplanecontrolservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Parses the OpenAPI/Swagger definition `PutRestApi` imports. Read through its event
# stream (not `YamlLoader`) so an alias cannot expand the document, which is what lets the
# YAML spelling of a definition be read under a bound; the JSON spelling goes through
# `serde_json`. Its mappings keep the document's own key order, which is the order the
# paths are imported in. `default-features = false` as the crate's other two dependents
# declare it (cloudformation, greengrassv2): the default `encoding` feature pulls in
# hand-written unsafe SIMD decoders this import has no use for — a definition body is
# already required to be UTF-8 before the parser sees it — and dropping it keeps
# SR-MEM-001 true of the whole request path.
yaml-rust2 = { version = "0.10", default-features = false }
# Reads the comma-separated API key file `ImportApiKeys` imports — the maintained reader
# for the format, so a quoted cell carrying a comma, a line ending or a doubled quote is
# one value rather than whatever a hand-written splitter would make of it. The same
# version the sibling comprehend service declares for the same job.
csv = "1.3"
# `arn`: the ONE parse of a caller-supplied `resourceArn`, so this service agrees with
# every other on what an ARN's six fields are and which ARNs name its own resources —
# what `state::parse_tagged_resource` reads a tag operation's `resourceArn` with. Also the
# ONE bounded reader of a caller-supplied JSON path that names a single value
# (`json_reference_path`), which is what a mapping template's `$input.json`/`$input.path`
# expression is applied through (`service::mapping_template`).
service-common = { path = "../common" }
# Reads a caller-supplied media type — a `Model`'s `contentType` — as the maintained
# parser for the format, so a value that is not a media type is refused however it is
# malformed rather than by a hand-written split on `/`.
mime = "0.3"
# Validates a request payload at a deployed stage against the JSON Schema of the `Model`
# the method declares for its content type — the maintained validator for the format, with
# draft 4 among its dialects, which is the one `CreateModel$schema` documents a model is
# written in. It computes over data in process: it evaluates nothing, and the only schema
# resources it resolves a `$ref` against are the api's own models, because the data plane
# replaces its resource loader with one that resolves NOTHING
# (`service::invoke::NoSchemasBeyondTheApi`) — so a stored schema cannot name a file, a
# host or a URL for this emulator to read.
boon = "0.6"
# The WAFv2 web ACL in front of a deployed stage, and the evaluation of it: a web ACL is
# associated with a stage through `AssociateWebACL`, so the records and the semantics are
# that service's, and the data plane here asks it for the decision rather than keeping a
# second reading of a rule tree (`service::invoke::web_acl_decision`).
service-com-amazonaws-wafv2-awswaf-20190729 = { workspace = true }
# An `AWS` integration names another service's action, and where that action is one this
# emulator serves it is PERFORMED by making the call over the in-process transport
# (`service::invoke::aws_integration`). The SDK client is what signs and shapes that call,
# so this service builds no request for another service's API by hand. `rt-tokio` for the
# byte stream an object's bytes arrive as; the rest of the crate's defaults (its own
# transport, a credentials chain that reads the environment) are not used, because the
# transport and the credentials are the callback's.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "behavior-version-latest",
] }
# Matches an `IntegrationResponse$selectionPattern` — "the regular expression (regex)
# pattern used to choose an integration response based on the response from the back end" —
# against the status a backend answered with. The maintained engine, whose matching is
# linear in the subject, so a pattern a control-plane call stored cannot make a request to a
# deployed stage expensive. Also matches an `Authorizer$identityValidationExpression`
# against the audience of the token a `COGNITO_USER_POOLS` authorizer was presented.
regex = "1"
# A `COGNITO_USER_POOLS` authorizer's decision is a function of the token presented and of
# the user pools its `providerARNs` name, and every pool this emulator serves publishes its
# own key set in this same process: the data plane reads that PUBLIC key set from the pool
# that owns it rather than fetching `<issuer>/.well-known/jwks.json` over a network this
# emulator never leaves (`service::invoke::cognito_user_pools`).
service-com-amazonaws-cognitoidentityprovider-awscognitoidentityproviderservice = { workspace = true }
# An `AWS_IAM`-authorized method is authorized against the PRINCIPAL the request's credential
# speaks for: STS holds the sessions an access key id resolves to — which is where a
# credential an identity pool vended is recorded — and IAM holds the identity-based policies
# and the permissions boundary in force on that principal
# (`service::invoke::execute_api_authorization`). The decision itself is
# `service_common::iam_authorization`, the tree's one evaluation of policy documents.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Base64 for the `Blob` member a web ACL's `ByteMatchStatement$SearchString` is, which an
# awsJson body carries encoded: the maintained coder every other service in this tree
# uses, rather than a hand-written copy in a test helper.
base64 = "0.22"
# Percent-encoding for the `resourceArn` @httpLabel a tag call puts in its URI path: the
# encoding itself is the crate's, as the sibling medialive/codeartifact suites do it,
# rather than a tenth hand-written copy of RFC 3986.
percent-encoding = "2"

[lints]
workspace = true
