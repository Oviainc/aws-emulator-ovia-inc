[package]
name = "service-com-amazonaws-bedrockagentcorecontrol-amazonbedrockagentcorecontrol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# Generated crates use tokio only for `#[tokio::main]` / `#[tokio::test]`; the
# agent-runtime tests also wait out the clock-owed status transition.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the id-minting seed into an `agentRuntimeId` suffix (src/state.rs).
sha2 = { workspace = true }
# Resolves a gateway target's Lambda function against the emulator's own Lambda,
# through the in-process callback (src/state.rs).
aws-sdk-lambda = { version = "1", default-features = false }
# Resolves an agent runtime's code artifact against the emulator's own object
# storage, through the in-process callback (src/state.rs).
aws-sdk-s3 = { version = "1", default-features = false }
# Creates the log group this service vends for an agent runtime in the emulator's
# own CloudWatch Logs, through the in-process callback
# (src/state/runtime_logs.rs).
aws-sdk-cloudwatchlogs = { version = "1", default-features = false }
# Stores a managed API key credential provider's key in — and resolves an external
# one's, and a payment credential provider's, secret against — the emulator's own
# Secrets Manager, through the in-process callback
# (src/state/api_key_credential_providers.rs,
# src/state/payment_credential_providers.rs).
aws-sdk-secretsmanager = { version = "1", default-features = false }
# Encodes the opaque `nextToken` ListAgentRuntimes pages with.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Mounted beside this service in the code-artifact suite, so the object a create
# resolves is one the emulator's object storage really holds.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# Mounted beside this service in the vended-log-group suite, so the group a create
# provisions is one the emulator's CloudWatch Logs really holds.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# Mounted beside this service in the API-key-credential-provider suite, so the secret
# a create stores the key in is one the emulator's Secrets Manager really holds, and in
# the external-payment-secret suite, so the secret a payment credential provider
# references is one it really holds, sealed under a real KMS key.
service-com-amazonaws-secretsmanager-secretsmanager = { workspace = true }
service-com-amazonaws-kms-trentservice = { workspace = true }

[lints]
workspace = true
