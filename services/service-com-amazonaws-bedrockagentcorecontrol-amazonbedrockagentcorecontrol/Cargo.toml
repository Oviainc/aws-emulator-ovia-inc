[package]
name = "service-com-amazonaws-bedrockagentcorecontrol-amazonbedrockagentcorecontrol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# Generated crates use tokio only for `#[tokio::main]` / `#[tokio::test]`; the
# agent-runtime tests also wait out the clock-owed status transition.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the id-minting seed into an `agentRuntimeId` suffix (src/state.rs).
sha2 = { workspace = true }
# Encodes the opaque `nextToken` ListAgentRuntimes pages with.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
