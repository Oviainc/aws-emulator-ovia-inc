[package]
name = "service-com-amazonaws-cleanrooms-awsbastioncontrolplaneservicelambda"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the lowercase-hex v4 UUIDs the model's `UUID` shape requires for
# collaboration and membership ids.
uuid = { version = "1", features = ["v4"] }
# Encodes the opaque pagination tokens ListCollaborations/ListMemberships hand out.
hex = { workspace = true }
# Parses an analysis template's SQL so `AnalysisTemplate$schema.referencedTables` is
# the relations the analysis really reads, rather than a hand-rolled text scan.
sqlparser = { version = "0.59", features = ["visitor"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
