[package]
name = "service-com-amazonaws-oam-oamservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The sentences the AWS request front door states for a schema finding about the request
# body (`validation_message::missing_required_properties`), shared so the wording does
# not drift from the other services that answer that layer's refusal.
service-common = { path = "../common" }
# Encodes/decodes the opaque `NextToken` ListAttachedLinks hands out, and renders a
# minted resource id as hexadecimal.
hex = { workspace = true }
# Derives the opaque resource `Id` this service hands out (see `state::mint_id`).
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `hex` and `sha2` are regular dependencies above (the ListAttachedLinks page token
# and the resource-id mint), which the test targets can use too, so neither is
# repeated here.

[lints]
workspace = true
