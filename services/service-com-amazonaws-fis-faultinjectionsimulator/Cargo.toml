[package]
name = "service-com-amazonaws-fis-faultinjectionsimulator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `iam_trust_policy`: the one reading of an IAM trust policy, shared with every other
# service that resolves a caller-supplied execution role before it writes.
service-common = { path = "../common" }
# Parses the ISO 8601 duration an `aws:fis:wait` action's `duration` parameter carries.
iso8601-duration = "0.2"
# The IAM store StartExperiment resolves an experiment template's `roleArn` against, to
# check the role's trust policy grants fis.amazonaws.com before an experiment is created.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Amazon S3 client the experiment report of an ended experiment is written through, over
# the in-process callback into this same emulator (no network client feature is enabled:
# the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The experiment-report suite mounts the S3 service beside FIS on one engine, because the
# report of an ended experiment is written to object storage by calling S3 in process —
# what the assembled emulator does.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
