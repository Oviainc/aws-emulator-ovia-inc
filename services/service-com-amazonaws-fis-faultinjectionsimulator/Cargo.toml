[package]
name = "service-com-amazonaws-fis-faultinjectionsimulator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `iam_trust_policy`: the one reading of an IAM trust policy, shared with every other
# service that resolves a caller-supplied execution role before it writes.
# `iso8601_span`: the one reading of the ISO 8601 duration an `aws:fis:wait` action's
# `duration` parameter carries.
service-common = { path = "../common" }
# The IAM store StartExperiment resolves an experiment template's `roleArn` against, to
# check the role's trust policy grants fis.amazonaws.com before an experiment is created.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The CloudWatch store an experiment's `aws:cloudwatch:alarm` stop conditions are judged
# against while the experiment runs: the alarm states `PutMetricAlarm` / `SetAlarmState`
# wrote are what the service halts a run on (`state::stop_conditions`).
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The EC2 store an experiment's EC2 actions are CARRIED OUT on: the built-in action
# `aws:ec2:reboot-instances` reboots the instances its target resolved to, which is a write
# to the very store the EC2 handlers read (see `src/state/action_execution.rs`). Reached
# through EC2's own state accessor, the way the IAM store above is.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The CloudWatch Logs and Amazon S3 clients an experiment's log records are DELIVERED
# through, over the in-process callback into this same emulator (no network client
# feature is enabled: the transport is the emulator's own). A template's
# `logConfiguration` names one or both of those destinations, and FIS writes the run's
# records there while the experiment runs. The S3 client also writes the experiment
# report of an ended experiment.
aws-sdk-cloudwatchlogs = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# `GetConsoleOutputResult$Output` carries an instance's console as base64 text, which the
# action-execution suite decodes to read the boots a rebooted guest wrote.
base64 = "0.22"
# RFC 3986 percent-encoding, so the untag suite can put a tag key carrying a space, a
# `+` or a non-ASCII character in the `tagKeys` query string the way a client does.
percent-encoding = "2.3"
# The experiment-logging and experiment-report suites mount CloudWatch Logs and Amazon S3
# beside FIS on one engine, because a started experiment delivers its log records to them
# and an ended experiment's report is written to object storage — what the assembled
# emulator does.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
