[package]
name = "service-com-amazonaws-serverlessapplicationrepository-serverlessapplicationrepository"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes a list operation's `nextToken`, so the opaque token is URL-safe whatever
# the key it names contains, and renders the bytes of a minted `StatementId`.
hex = { workspace = true }
# Digests the entropy behind the uuid-shaped `StatementId` PutApplicationPolicy mints
# for a statement the request did not name one for (`state::new_statement_id`).
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
