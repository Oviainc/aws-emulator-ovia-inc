[package]
name = "service-com-amazonaws-serverlessapplicationrepository-serverlessapplicationrepository"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource), which this service's authorization gate runs; `iam_role`: the shared
# readings of a principal ARN that say which IAM identity a caller's policies are held
# under.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks for, and
# the STS store resolves WHICH principal a request is: the authorization gate reads both
# services' OWN state accessors rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes a list operation's `nextToken`, so the opaque token is URL-safe whatever
# the key it names contains, and renders the bytes of a minted `StatementId`.
hex = { workspace = true }
# The AWS SDK for CloudFormation, driven over the in-process callback
# (`OperationContext::callback`): CreateCloudFormationChangeSet creates the change set
# it answers with in CloudFormation, which is where AWS puts it too. Only the generated
# client is needed — the emulator supplies the transport — plus the two features the
# client itself uses, so this crate builds on its own.
aws-sdk-cloudformation = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Digests the entropy behind the uuid-shaped `StatementId` PutApplicationPolicy mints
# for a statement the request did not name one for, and the uuid `TemplateId`
# CreateCloudFormationTemplate mints (`state::new_uuid`).
sha2 = { workspace = true }
# Computes the query-string SigV4 signature a published artifact locator carries, and the
# one the document plane verifies before serving a byte (`state::presigned_artifact_url`).
aws-sigv4 = { version = "1", features = ["http1"] }
# The signing identity `aws-sigv4` takes: this service's own ephemeral document-plane key.
aws-credential-types = "1"
# AWS CloudFormation's own template reader, which is the emulator's ONE reading of a
# CloudFormation/SAM template body in either of the forms it is written in (JSON, or YAML
# with the short-form intrinsic tags): a packaged SAM template is a CloudFormation
# template, so `state::template_document` reads a published body through
# `state::template::document_within` rather than a second reader of the same format. This
# crate already drives the service itself through the in-process SDK client above.
service-com-amazonaws-cloudformation-cloudformation = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Executing a change set makes CloudFormation provision the template's
# `AWS::SQS::Queue` in the service that OWNS it, so Amazon SQS is mounted beside
# CloudFormation and this service as `core/router/src/lib.rs` mounts them.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# The authorization suite makes the principals it calls as through IAM's and STS's own
# operations, so the policies the gate reads are the ones those services wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }

[lints]
workspace = true
