[package]
name = "service-com-amazonaws-chimesdkmessaging-chimemessagingservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `chime_family`: the request-claim rule for the six services that share the `chime`
# SigV4 signing name, stated once rather than inlined in this service's `can_handle`.
# `chime_app_instance_admins`: the app-instance ADMIN directory this service READS, which
# Chime SDK Identity writes, for the two actions the model reserves for an administrator.
# `chime_identity_names`: the identity NAME directory this service READS, which Chime SDK
# Identity writes, for the `Name` every participant it reports carries beside its ARN.
# `uuid_from_random_bytes`: the family's one rendering of 16 opaque bytes as the
# hyphenated uuid a minted `MessageId` is.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Pagination cursors are hex-encoded, and so are the ids minted below.
hex = { workspace = true }
# SHA-256 is what mints a channel id / message id from a counter and the clock.
sha2 = { workspace = true }
# A channel flow's processors ARE Lambda functions: `CreateChannelFlow` resolves each
# `Processor.Configuration.Lambda.ResourceArn` against the emulator's own Lambda service
# through the in-process callback, which needs Lambda's own client.
aws-sdk-lambda = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` so a test can await `tokio::time::sleep` instead of blocking the runtime.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
