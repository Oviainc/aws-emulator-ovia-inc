[package]
name = "service-com-amazonaws-chimesdkmessaging-chimemessagingservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Pagination cursors are hex-encoded, and so are the ids minted below.
hex = { workspace = true }
# SHA-256 is what mints a channel id / message id from a counter and the clock.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` so a test can await `tokio::time::sleep` instead of blocking the runtime.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
