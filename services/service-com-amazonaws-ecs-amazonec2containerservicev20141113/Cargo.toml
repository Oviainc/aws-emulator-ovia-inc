# The Elastic Load Balancing v2 service, for ONE read: the `TargetType` of a target group
# a `loadBalancers` entry names, which decides whether that target group can carry the
# tasks of the service's task definition (`crate::state::target_group_target_types`). The
# target group lives in that service's own store in the shared engine, so this is a
# cross-service READ of it rather than a copy of a value the request carried. No cycle:
