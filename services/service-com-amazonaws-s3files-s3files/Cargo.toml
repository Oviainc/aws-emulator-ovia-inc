[package]
name = "service-com-amazonaws-s3files-s3files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashing for the unique ids this service mints (file-system ids, access-point ids and
# the client token a create records when the caller sent none).
sha2 = { workspace = true }
# Hex codec for those ids and for the opaque `nextToken` the listings issue.
hex = { workspace = true }
# The AWS SDK for S3, driven over the in-process callback
# (`OperationContext::callback`) the way `scheduler` drives the IAM SDK:
# `CreateFileSystem` resolves the bucket its `bucket` ARN names with `HeadBucket` before
# it persists a file system. Only the generated client is needed — the emulator supplies
# the transport and the credentials, so the SDK's own HTTPS stack and runtime are left
# out.
aws-sdk-s3 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
