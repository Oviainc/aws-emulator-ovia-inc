[package]
name = "service-com-amazonaws-account-account"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The tree's shared validation half: one reading of a request yields the framework's own
# violations with the value each clause quotes restored to the bytes the caller sent.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
# `ListRegions`: hex-encodes the Region code a pagination token resumes after, so
# the `NextToken` a caller hands back is opaque rather than a resource name.
hex = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `PutContactInformation`: the published ISO 3166-1 country-code table, which
# decides whether a submitted `CountryCode` is an assigned alpha-2 code.
rust_iso3166 = "0.2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
