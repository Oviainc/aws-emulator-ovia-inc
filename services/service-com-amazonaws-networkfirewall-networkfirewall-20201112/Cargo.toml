[package]
name = "service-com-amazonaws-networkfirewall-networkfirewall-20201112"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `validation_message`: the fleet's one rendering of a boundary refusal — the AWS envelope,
# the clause with its value half dropped, and a collection's element constraint set stated
# at the collection member — which `service::validation` delegates to rather than wording.
service-common = { path = "../common" }
# SHA-256, used to mint the server-generated `ResourceId` / `UpdateToken` and
# firewall-endpoint ids this service hands out (see `state::fresh_bytes`).
sha2 = { workspace = true }
# Hex codec for those ids' digits, so nothing here hand-writes one.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` beyond what `#[tokio::test]` needs: an integration test waits out the
# firewall provisioning span with `tokio::time::sleep`. Test-only, so it does not
# widen the shipped crate's feature set.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
