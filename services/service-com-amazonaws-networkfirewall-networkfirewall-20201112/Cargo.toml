[package]
name = "service-com-amazonaws-networkfirewall-networkfirewall-20201112"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries the workspace's ONE caller-supplied-ARN parse, which this service
# reads every name/ARN reference through, and `validation_message`: the fleet's one rendering
# of a boundary refusal — the AWS envelope, the clause with its value half dropped, and a
# collection's element constraint set stated at the collection member — which
# `service::validation` delegates to rather than wording.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256, used to mint the server-generated `ResourceId` / `UpdateToken` and
# firewall-endpoint ids this service hands out (see `state::fresh_bytes`).
sha2 = { workspace = true }
# Hex codec for those ids' digits, so nothing here hand-writes one.
hex = { workspace = true }
# The Amazon S3 client `UpdateLoggingConfiguration` resolves an S3 log destination
# through, over the emulator's in-process callback: attaching log delivery to a
# bucket is a change to THAT bucket's policy, so whether the caller may make it is
# a question only the service owning the bucket can answer
# (`state::log_destinations`).
aws-sdk-s3 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` beyond what `#[tokio::test]` needs: an integration test waits out the
# firewall provisioning span with `tokio::time::sleep`. Test-only, so it does not
# widen the shipped crate's feature set.
tokio = { workspace = true, features = ["time"] }
# The logging-configuration suite mounts Amazon S3 beside Network Firewall on one
# engine, because the bucket an S3 log destination names is ITS resource: the suite
# creates the bucket and puts the policy on it there, and configures logging here.
# A workspace member this repository already locks.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The AWS SDK for Amazon S3, which that suite drives the bucket and its policy
# through — the same client the handler resolves a destination with.
aws-sdk-s3 = { version = "1", default-features = false }

[lints]
workspace = true
