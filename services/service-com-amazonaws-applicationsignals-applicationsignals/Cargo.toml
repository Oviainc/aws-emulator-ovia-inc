[package]
name = "service-com-amazonaws-applicationsignals-applicationsignals"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries the ONE resource-ARN parse, which the tagging operations read a
# caller-supplied `ResourceArn` with.
service-common = { path = "../common" }
# Opaque pagination tokens: `ListServiceLevelObjectives`'s `NextToken` is the hex
# encoding of the cursor, so a caller cannot read or forge a store key out of it; the hex
# rendering of a `LocationHash` digest comes from here too.
hex = { workspace = true }
# The stable `LocationHash` of a dynamic instrumentation configuration: the maintained
# SHA-256 implementation, rather than a hand-written digest.
sha2 = { workspace = true }
# Calendar arithmetic: a calendar-month SLO evaluation interval is aligned with the
# calendar, so its tiles are stepped by whole months rather than by a fixed span. No clock
# is needed from it (`default-features = false` drops the time-zone lookup), only the
# month-length and leap-year rules — from the release that introduced the month stepping
# (`Months`/`checked_add_months`) and the epoch-seconds constructor this uses.
chrono = { version = "0.4.31", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
