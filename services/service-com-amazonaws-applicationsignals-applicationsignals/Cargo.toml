[package]
name = "service-com-amazonaws-applicationsignals-applicationsignals"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries the ONE resource-ARN parse, which the tagging operations read a
# caller-supplied `ResourceArn` with.
service-common = { path = "../common" }
# Opaque pagination tokens: `ListServiceLevelObjectives`'s `NextToken` is the hex
# encoding of the cursor, so a caller cannot read or forge a store key out of it.
hex = { workspace = true }
# The stable `LocationHash` of a dynamic instrumentation configuration: the maintained
# SHA-256 implementation, rather than a hand-written digest.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
