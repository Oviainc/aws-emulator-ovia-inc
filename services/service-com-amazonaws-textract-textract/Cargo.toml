[package]
name = "service-com-amazonaws-textract-textract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Document identity digests and deterministic block ids / pagination cursors.
sha2 = { workspace = true }
hex = { workspace = true }
# Decodes the raster document formats Textract accepts (PNG, JPEG, TIFF) into pixels.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "tiff",
] }
# Public-domain 8x8 ASCII glyph bitmaps, used as the recogniser's match templates.
font8x8 = "0.3"
# The Amazon S3 client this service reads a `Document.S3Object` / `DocumentLocation`
# through, over the in-process callback into this same emulator (no network client
# feature: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# `iam_authorization`: the shared evaluation of those documents against an action on a
# resource, so every service that enforces authorization decides alike.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The Amazon S3 service, mounted beside textract on one engine so a document staged with
# `PutObject` is the one the S3-sourced read paths resolve.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
