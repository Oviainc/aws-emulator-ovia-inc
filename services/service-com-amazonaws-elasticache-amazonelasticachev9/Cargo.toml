[package]
name = "service-com-amazonaws-elasticache-amazonelasticachev9"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex is the codec the opaque pagination `Marker` is built with, and the one the
# reserved-cache-node offering ids are rendered in (src/state.rs).
hex = { workspace = true }
# SHA-256 derives each reserved-cache-node offering's id from its attributes, so
# the published catalog needs no counter and reports the same id on every read
# (src/state.rs), and mints the per-response correlation id the awsQuery error
# envelope carries (src/service/query_error_envelope.rs).
sha2 = { workspace = true }
# The KMS client a `KmsKeyId` is resolved to its key's ARN through, over the
# in-process callback into this same emulator (src/state/kms_key.rs); no network
# client feature is enabled, because the transport is the emulator's own.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The encryption suite mounts KMS beside ElastiCache on one engine, because
# resolving the key a resource names is a call into it.
service-com-amazonaws-kms-trentservice = { workspace = true }

[lints]
workspace = true
