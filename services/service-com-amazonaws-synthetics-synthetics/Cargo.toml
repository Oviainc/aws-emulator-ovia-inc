[package]
name = "service-com-amazonaws-synthetics-synthetics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `validation::unanchored`: this tree's ONE rendering of a `@pattern` as the expression a
# service publishes (the whole-value `^`/`$` pair a model writes around it dropped), which
# `src/service.rs` states every constraint refusal's pattern clause through.
service-common = { path = "../common" }
# `Canary$Id` and `CanaryRun$Id` are modelled as UUIDs. The hash and the hex codec the
# id minting in `src/state.rs` needs, rather than hand-written ones; both are already
# locked for this package, so no entry is added to Cargo.lock.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `tokio::time::sleep` lets a test step past a transition the clock owes.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
