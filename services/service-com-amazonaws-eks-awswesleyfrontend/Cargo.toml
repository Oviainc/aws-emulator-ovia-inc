[package]
name = "service-com-amazonaws-eks-awswesleyfrontend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Derives each cluster's stable 32-hex resource id (endpoint host, OIDC issuer)
# from its ARN, in `src/state.rs`.
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# The clock-owed `CREATING` -> `ACTIVE` test waits with `tokio::time::sleep`, so
# this target declares tokio's `time` feature rather than inheriting it
# transitively from another crate's feature set. Nothing else is added here: a
# new dependency would mean a Cargo.lock entry, and this crate's fix must not
# touch the one file every concurrent fix also edits.
tokio = { workspace = true, features = ["time"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
