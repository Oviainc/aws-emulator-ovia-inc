[package]
name = "service-com-amazonaws-securityhub-securityhubapiservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256 for the 128-bit identifier in a created insight's ARN.
sha2 = { workspace = true }
# Hex codec for the opaque `NextToken` cursors of the paginated list operations
# (`GetFindings`, `GetEnabledStandards`).
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The standards tests wait past a PENDING -> READY transition's due instant, which
# needs tokio's timer on top of the features the workspace dependency enables.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
