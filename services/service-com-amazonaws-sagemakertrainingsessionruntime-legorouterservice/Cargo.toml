[package]
name = "service-com-amazonaws-sagemakertrainingsessionruntime-legorouterservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints operation ids from this service's own counter plus the submitting instant.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints.rust]
# As the workspace sets for every crate.
unsafe_code = "forbid"

# The session queue reads the two outcomes of a release as a `match`, which is how the
# store's own comments explain it; the shorter form clippy asks for changes nothing a
# caller sees, so this crate keeps the `match` and turns that lint off here.
[lints.clippy]
question_mark = "allow"
