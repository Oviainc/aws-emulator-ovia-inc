[package]
name = "service-com-amazonaws-servicecatalogappregistry-aws242appregistry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the opaque resource ids and the idempotency-token fingerprints in src/state.rs.
sha2 = { workspace = true }
# Encodes the opaque pagination cursor and decodes it back in src/state.rs.
hex = { workspace = true }
# The AWS SDK for CloudFormation, driven over the in-process callback
# (`OperationContext::callback`): `SyncResource` reads the stack it syncs — its stack id
# and its tags — from CloudFormation itself, which is what that operation's documented
# `cloudformation:DescribeStacks` permission is for. Only the generated client is needed;
# the emulator supplies the transport.
aws-sdk-cloudformation = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# CloudFormation is mounted beside AppRegistry on one engine in the SyncResource suite:
# without a stack there is nothing to sync.
service-com-amazonaws-cloudformation-cloudformation = { workspace = true }

[lints]
workspace = true
