[package]
name = "service-com-amazonaws-continuum-continuumcontrolplane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex, for rendering the authenticated pagination token a listing hands back.
hex = { workspace = true }
# `date_time_json`: the workspace's ONE rendering of a `restJson1` timestamp whose model
# declares the `date-time` form, which every timestamp member of this model does.
# `page_tokens`: the ONE authenticated continuation-token codec, so a token this store did
# not mint names no page. `stable_hex_id`: the ONE stable mixing function behind a minted id.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
