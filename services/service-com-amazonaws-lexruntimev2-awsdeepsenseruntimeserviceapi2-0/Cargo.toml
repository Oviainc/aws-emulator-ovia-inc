[package]
name = "service-com-amazonaws-lexruntimev2-awsdeepsenseruntimeserviceapi2-0"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
# The Lex Models V2 control plane, which holds the BOT this runtime serves: a turn
# is interpreted against the locale a client built there (`state::bot_model`), so
# the runtime reads that store rather than inventing a bot of its own.
service-com-amazonaws-lexmodelsv2-lexmodelbuildingservicev2 = { path = "../service-com-amazonaws-lexmodelsv2-lexmodelbuildingservicev2" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# gzip: this service's `x-amz-lex-*` header payloads are "compressed with gzip
# and then base64 encoded" (RecognizeUtterance's own documentation).
flate2 = "1"
# sha2: the `originatingRequestId` a session is stamped with is derived from a
# monotonic counter through a digest, so two sessions never share one (the
# hyphenated layout itself is `service_common::uuid_from_random_bytes`).
sha2 = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
