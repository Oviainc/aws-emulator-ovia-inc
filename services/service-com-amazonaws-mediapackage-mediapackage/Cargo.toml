[package]
name = "service-com-amazonaws-mediapackage-mediapackage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Stable, content-derived labels for ingest/playback hostnames and paths, and the
# seeds of the system-generated ingest endpoint ids and credentials.
sha2 = { workspace = true }
# Hex encoding for those labels and for the opaque List* paging tokens.
hex = { workspace = true }
# `ipnet`: the ONE reading of an IP address or range in CIDR notation, which the origin
# endpoint's playback plane matches a viewer's source address against its `Whitelist`.
ipnet = "2"
# `md-5`: the digest HTTP Digest authentication (RFC 2617) is computed with, which is how
# an encoder authenticates at a channel's HLS ingest endpoints.
md-5 = "0.10"
# `http-auth`: the maintained reader of RFC 7235's challenge/credentials grammar, which the
# ingest plane reads the parameters of a presented Digest response with (no feature is
# enabled: the parser is all this uses).
http-auth = { version = "0.1", default-features = false }
# `iam_trust_policy`: the one reading of an IAM trust policy, shared with every other
# service that resolves a caller-supplied role before it writes.
service-common = { path = "../common" }
# The IAM store CreateHarvestJob resolves an S3Destination's `roleArn` against, to check
# the role's trust policy grants mediapackage.amazonaws.com before a job is submitted.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# Amazon S3 client a harvest job writes its top-level manifest with: the destination is
# reached over the in-process callback into this same emulator (no network client feature
# is enabled: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The harvest-output suite mounts the S3 service beside MediaPackage on one engine,
# because a harvest writes its manifest into that service's buckets.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
