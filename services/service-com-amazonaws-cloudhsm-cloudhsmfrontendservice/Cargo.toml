[package]
name = "service-com-amazonaws-cloudhsm-cloudhsmfrontendservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Hex codec for the opaque pagination cursor `ListHsms`'s `NextToken` carries, and for
# rendering the derived `vpc-<8 hex>` identifier.
hex = { workspace = true }
# Stable digest a subnet's VPC id and zone are derived from, so the subnet -> placement
# mapping is a pure function and needs no stored table.
sha2 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }


[lints]
workspace = true
