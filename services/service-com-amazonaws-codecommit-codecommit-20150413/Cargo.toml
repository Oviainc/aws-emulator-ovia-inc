[package]
name = "service-com-amazonaws-codecommit-codecommit-20150413"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Content-addressed ids: the git object encoding of a blob/tree/commit, and the
# repositoryId, are hashed with this (both crates are already workspace deps, so
# this adds nothing to Cargo.lock).
sha2 = { workspace = true }
hex = { workspace = true }
# Git object names are SHA-1 digests: that is what the git wire format the
# smart-HTTP transport speaks defines an object name to be (see
# `src/state/git_object.rs`), so a client's ids and the emulator's agree.
sha1 = "0.10"
# zlib, which is how a packfile carries each object's bytes (and how a git
# client may gzip a request body).
flate2 = "1"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
