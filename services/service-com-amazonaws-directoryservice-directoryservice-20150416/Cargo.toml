[package]
name = "service-com-amazonaws-directoryservice-directoryservice-20150416"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque NextToken cursor the paginated operations issue.
hex = { workspace = true }
# Decodes the PEM/DER X.509 certificate RegisterCertificate is called with, so the
# CommonName and ExpiryDateTime reported back are the certificate's own values.
x509-cert = { version = "0.2", features = ["pem"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# Builds the self-signed certificates the certificate suite registers, so each row's
# common name and expiry come from a real certificate rather than a fixed blob.
rcgen = "0.13"

[lints]
workspace = true
