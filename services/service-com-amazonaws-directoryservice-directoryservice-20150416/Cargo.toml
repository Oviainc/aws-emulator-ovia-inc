[package]
name = "service-com-amazonaws-directoryservice-directoryservice-20150416"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque NextToken cursor the paginated operations issue.
hex = { workspace = true }
# Decodes the PEM/DER X.509 certificate RegisterCertificate is called with, so the
# CommonName and ExpiryDateTime reported back are the certificate's own values.
x509-cert = { version = "0.2", features = ["pem"] }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The CloudWatch Logs store a directory's log subscription forwards its domain controller
# security logs INTO (`state::security_log`): the records go into that service's own store
# in the shared engine, through its own record types, so what was forwarded is what
# `logs:FilterLogEvents` reports.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# `iam_authorization`: the shared evaluation of those documents against an action on a
# resource, `iam_role`: which IAM entity a principal ARN names, and `ad_directories`: the
# shared inventory of the account's directories, which this control plane creates and
# deletes and the Directory Service DATA plane reads.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The CloudWatch Logs service a directory's log subscription forwards into, so the
# forwarding suite mounts it beside this one on the same engine and reads the delivered
# records back through that service's own `FilterLogEvents` / `DescribeLogStreams`.
# Already a dependency of `src/`; an integration test reaches it through this list.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# Builds the self-signed certificates the certificate suite registers, so each row's
# common name and expiry come from a real certificate rather than a fixed blob.
rcgen = "0.13"

[lints]
workspace = true
