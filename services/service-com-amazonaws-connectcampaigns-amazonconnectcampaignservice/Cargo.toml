[package]
name = "service-com-amazonaws-connectcampaigns-amazonconnectcampaignservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The response media type this service announces, and the seam wrapper that reaches the
# framework's own refusals with it: the tree's one statement of that rule.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes this process's entropy into the campaign ids CreateCampaign mints.
sha2 = { workspace = true }
# Renders those id bytes as the lowercase hex the `CampaignId` pattern allows.
hex = { workspace = true }
# Codec for the opaque base64 `nextToken` ListCampaigns hands out and decodes.
base64 = "0.22"
# Amazon Connect's instance registry: an instance id is minted by Connect's
# `CreateInstance` and by nothing else, so the instance gate on a campaign create reads
# that store through the shared engine rather than keeping a second registry here.
service-com-amazonaws-connect-amazonconnectservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
