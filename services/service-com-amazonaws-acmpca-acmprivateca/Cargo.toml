[package]
name = "service-com-amazonaws-acmpca-acmprivateca"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digests the CA's minted ids/serials and the certification-request fingerprint a
# derived certificate body records.
sha2 = { workspace = true }
# Hex for those serials and digests.
hex = { workspace = true }
# Reads and writes the DER X.509 certificates and PKCS#10 certification requests this
# service accepts (ImportCertificateAuthorityCertificate, IssueCertificate) and hands
# out (GetCertificateAuthorityCsr, GetCertificate).
x509-cert = "0.2"

[dev-dependencies]
# Generates the real certificates and certification requests the tests feed the
# service, independently of the DER this crate writes itself.
rcgen = "0.13"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
