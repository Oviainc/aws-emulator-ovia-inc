[package]
name = "service-com-amazonaws-comprehend-comprehend-20171127"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Natural-language identification engine behind DetectDominantLanguage: reports a
# confidence for EVERY language it is built with, which is what the operation's
# ranked `Languages` list is. Only the languages Comprehend's `LanguageCode` enum
# names are compiled in.
lingua = { version = "1.8", default-features = false, features = [
    "arabic",
    "chinese",
    "english",
    "french",
    "german",
    "hindi",
    "italian",
    "japanese",
    "korean",
    "portuguese",
    "spanish",
] }
# VADER sentiment engine behind DetectSentiment: a rule-based English sentiment
# analyser returning positive/negative/neutral proportions and a compound score.
vader_sentiment = "0.1"
# Toxicity engine behind DetectToxicContent: an English profanity/abuse analyser
# that classifies a string into categories (profane, offensive, sexual, mean) each
# at a mild/moderate/severe level.
rustrict = "0.7"
# Regular-expression engine behind the PII recognizer in ops::contains_pii_entities,
# which ContainsPiiEntities and DetectPiiEntities both project: it matches each PII
# entity type's published form over the submitted document, in linear time, so no
# document can make one request backtrack.
regex = "1.12"
# Amazon S3 client the asynchronous dominant-language detection job reads its input
# documents with and writes its `output.tar.gz` back through, over the in-process
# callback into this same emulator (no network client feature is enabled: the
# transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# tar writer and gzip codec for the `output.tar.gz` archive an analysis job's
# `OutputDataConfig` documents ("a compressed archive that contains the output of
# the operation").
tar = "0.4"
flate2 = "1"
# CSV reader for the `COMPREHEND_CSV` training data CreateDocumentClassifier fits a
# custom model on: label(s) in the first column, the document in the second, with
# RFC 4180 quoting the format allows.
csv = "1.3"
# The stop-word lists the key-phrase extractor splits a document into candidate
# phrases at (Rose et al.'s candidate rule), one list per language Comprehend names.
stop-words = "0.8"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The dominant-language job suite mounts the S3 service beside Comprehend on one
# engine, because StartDominantLanguageDetectionJob reads its input documents from S3
# and writes its output archive back there by calling it in process.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# Reads the `output.tar.gz` the job wrote back out, to assert the archive really
# holds the analysed documents.
tar = "0.4"
flate2 = "1"

[lints]
workspace = true
