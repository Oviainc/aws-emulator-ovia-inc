[package]
name = "service-com-amazonaws-secretsmanager-secretsmanager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Secret version ids are UUIDs (SecretVersionIdType, len 32..64), and the six
# random characters that end a secret's ARN are drawn from a random UUID too.
uuid = { version = "1", features = ["v4"] }
# Hex-encodes a pagination cursor (ListSecrets, ListSecretVersionIds) into an
# opaque NextToken.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# SecretBinary is a blob, which awsJson1_1 carries base64-encoded on the wire.
base64 = "0.22"

[lints]
workspace = true
