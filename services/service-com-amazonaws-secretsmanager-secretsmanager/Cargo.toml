[package]
name = "service-com-amazonaws-secretsmanager-secretsmanager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# A secret value is stored enveloped under the secret's KMS key: this is the KMS
# client the seal and open calls go out over the in-process callback with.
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# AES-256-GCM (and the OS CSPRNG for its nonce) for the envelope a secret value is
# sealed in under the data key KMS wrapped, and the SHA-256 an idempotent replay
# compares a value by; already in this workspace's lock file.
ring = "0.17"
# Secret version ids are UUIDs (SecretVersionIdType, len 32..64), and the six
# random characters that end a secret's ARN are drawn from a random UUID too.
uuid = { version = "1", features = ["v4"] }
# Hex-encodes a pagination cursor (ListSecrets, ListSecretVersionIds) into an
# opaque NextToken.
hex = { workspace = true }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# `iam_authorization`: the shared evaluation of those documents against an action on a
# resource, so every service that enforces authorization decides alike. `iam_role` and
# `arn`: which IAM entity a principal ARN names, and whether a `SecretId` is an ARN.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# SecretBinary is a blob, which awsJson1_1 carries base64-encoded on the wire.
base64 = "0.22"
# The envelope suite mounts KMS beside this service on one engine, exactly as the
# assembled router mounts them, so the keys a secret is sealed under are real keys
# minted through KMS's own operations.
service-com-amazonaws-kms-trentservice = { workspace = true }

[lints]
workspace = true
