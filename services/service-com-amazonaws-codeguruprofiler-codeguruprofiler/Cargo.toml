[package]
name = "service-com-amazonaws-codeguruprofiler-codeguruprofiler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The ONE caller-supplied-ARN parse, which `state::is_sns_topic_arn` reads a
# notification channel's uri against, and the shared constraint-violation value
# recovery: the bytes a caller submitted, which the framework's validating walk stores
# elided on each violation.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256 and hex, which `state::revision_id` derives a policy `RevisionId` with from
# the store's own mint count and the write it identifies.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# RFC 3986 percent-encoding, so a test can put an ARN in a single-segment
# `@httpLabel` and tag keys in `@httpQuery` values the way an SDK does.
percent-encoding = "2.3"

[lints]
workspace = true
