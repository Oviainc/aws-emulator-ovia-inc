[package]
name = "service-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# `resolve_route_key` / `ROOT_PATH_SEGMENT`: the framework's own routing-key rule,
# which this crate narrows rather than replaces.
emulator-server = { workspace = true }
http = { workspace = true }
# `front_door`: the operation wrapper, the schema it reads a member's HTTP binding
# off, the constraint walk it runs and the request/response types it serves.
# `event_stream` is driven through the same traits.
# `validation`: the same `Schema` / `ShapeSerializer` seam, used to re-walk a built
# input, and the `Violation` / constraint-path vocabulary the framework's own
# constraint walk reports in. `shared_path`: `percent_decode`, which it reads a
# percent-encoded URI path label through. `claims_modeled_route`:
# `ErasedServiceDefinition`, which it asks whether a service's own generated route table
# binds a route for the request, and the empty `SdkBody` the request it hands that
# service's protocol carries.
smithy-server-runtime = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
# `validation`: the leaf types a `ShapeSerializer` is handed.
# `addresses_modeled_route`: the empty body the request it asks a service's own protocol
# to route is built with (that routing key reads the method, URI and headers only).
aws-smithy-types = { workspace = true }
# `stable_hex_id`'s mixing function: a maintained digest, so a derived id that travels on
# the wire is reproducible across builds rather than tied to the algorithm `std`'s default
# hasher happens to use.
sha2 = { workspace = true }
# `iam_trust_policy`: an IAM trust policy IS a JSON document, so it is read with a
# maintained JSON parser rather than by hand.
serde_json = { workspace = true }
# `query_error_envelope`: the v4 UUID an awsQuery error envelope reports as its
# `<RequestId>`, from the maintained crate the framework's own request-id minter and the
# service-local copies of that writer use, rather than derived here.
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
