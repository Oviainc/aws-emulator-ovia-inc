[package]
name = "service-common"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
# `resolve_route_key` / `ROOT_PATH_SEGMENT`: the framework's own routing-key rule,
# which this crate narrows rather than replaces.
emulator-server = { workspace = true }
http = { workspace = true }
# `stable_hex_id`'s mixing function: a maintained digest, so a derived id that
# travels on the wire is reproducible across builds rather than tied to the
# algorithm `std`'s default hasher happens to use.
sha2 = { workspace = true }

[lints]
workspace = true
