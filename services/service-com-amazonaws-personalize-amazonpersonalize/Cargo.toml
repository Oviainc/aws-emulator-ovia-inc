[package]
name = "service-com-amazonaws-personalize-amazonpersonalize"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Renders the opaque `nextToken` payload as the ASCII text the model's pattern allows.
hex = { workspace = true }
# The tracking id Amazon Personalize provides with an Action interactions dataset, in the
# UUID form its own ids take — minted by the maintained crate, not laid out by hand.
uuid = { version = "1", features = ["v4"] }
# The ingestion registry `CreateDataset` seeds and `DeleteDataset` clears, so a dataset
# created over the wire is a target Amazon Personalize Events can ingest into.
service-com-amazonaws-personalizeevents-amazonpersonalizeevents = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
