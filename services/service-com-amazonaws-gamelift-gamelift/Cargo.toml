[package]
name = "service-com-amazonaws-gamelift-gamelift"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The S3 object protocol in this emulator is served by the Amazon S3 service, so the
# Amazon GameLift Servers-owned location a build's files are uploaded to is a bucket
# provisioned in THAT store (`state::provision_build_upload_bucket`).
service-com-amazonaws-s3-amazons3 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the opaque UUID-shaped ids the GameLift resources carry (`fleet-<uuid>`,
# `psess-<uuid>`, a game session's id string), as `state::mint_uuid` does it.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
