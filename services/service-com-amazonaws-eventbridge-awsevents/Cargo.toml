[package]
name = "service-com-amazonaws-eventbridge-awsevents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque list page tokens are hex-encoded so they are URL- and header-safe.
hex = { workspace = true }
# `arn`: the ONE parse of a caller-supplied resource ARN, shared with every other
# service \u2014 a rule's target ARN is read through it rather than split here.
service-common = { path = "../common" }
# The AWS SDK for SQS, driven over the in-process callback
# (`OperationContext::callback`): a rule delivers a matched event to its SQS queue
# targets with `SendMessage` (`ops::put_events::deliver`). Only the generated
# client is needed — the emulator supplies the transport, so the SDK's own HTTPS
# stack and runtime are left out.
aws-sdk-sqs = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# SQS is mounted beside EventBridge on one engine in the delivery tests, because a
# rule's target is an SQS queue and a delivery is asserted where a client sees it:
# on the queue.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
