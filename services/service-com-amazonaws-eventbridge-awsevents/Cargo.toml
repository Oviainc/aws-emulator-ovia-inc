[package]
name = "service-com-amazonaws-eventbridge-awsevents"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time`: an api-destination delivery bounds each attempt at the endpoint by the
# client execution timeout AWS documents for one (`ops::put_events`).
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
# `unbounded_depth`: the parser's own depth default is replaced by this service's
# published `Detail` nesting bound (`state::MAX_DETAIL_DEPTH`), which the parse
# enforces up front instead.
# `raw_value`: reading a document as a raw value is how its well-formedness is
# checked without descending into it, so a document at the published nesting
# bound is read without the stack a recursive read of it would need.
serde_json = { workspace = true, features = ["unbounded_depth", "raw_value"] }
tracing = { workspace = true }
# Opaque list page tokens are hex-encoded so they are URL- and header-safe.
hex = { workspace = true }
# `arn`: the ONE parse of a caller-supplied resource ARN, shared with every other
# service \u2014 a rule's target ARN is read through it rather than split here.
# `json_reference_path`: the ONE bounded evaluation of a caller-supplied JSON path that
# names a single value, which a Kinesis target's `PartitionKeyPath` is read through.
service-common = { path = "../common" }
# The AWS SDK for SQS, driven over the in-process callback
# (`OperationContext::callback`): a rule delivers a matched event to its SQS queue
# targets with `SendMessage` (`ops::put_events::deliver`). Only the generated
# client is needed — the emulator supplies the transport, so the SDK's own HTTPS
# stack and runtime are left out.
aws-sdk-sqs = { version = "1", default-features = false }
# The clients for the other target kinds a rule's matched event is delivered to,
# over the same in-process callback: a Lambda function (`Invoke`), an SNS topic
# (`Publish`) and a Step Functions state machine (`StartExecution`).
aws-sdk-lambda = { version = "1", default-features = false }
aws-sdk-sns = { version = "1", default-features = false }
aws-sdk-sfn = { version = "1", default-features = false }
# A Kinesis data stream target is delivered to with `PutRecord`, over the same
# in-process callback.
aws-sdk-kinesis = { version = "1", default-features = false }
# `FailedInvocations`, the metric EventBridge counts an undeliverable event on,
# is appended to the CloudWatch store in the SAME shared engine (the `AWS/Events`
# namespace). CloudWatch refuses a `PutMetricData` into a reserved `AWS/`
# namespace, so a service's own metrics never travel over that API; this writes
# the very store `ListMetrics`/`GetMetricStatistics` read.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The IAM store a target's `RoleArn` is resolved against, to decide whether
# EventBridge may assume that role and make the target's API call under it — and
# the identity the access key id a client's `PutEvents` presents speaks for,
# together with that identity's own policies (`state::authorization`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# `tokio::time` drives the tests' wait past a connection transition's due instant.
tokio = { workspace = true, features = ["time"] }
# The services a rule's targets live in are mounted beside EventBridge on one
# engine in the delivery tests, because a delivery is asserted where a client sees
# it: on the queue, on the topic, on the state machine's executions — and the role
# a target names, plus the metric a failed delivery counts, live in IAM and
# CloudWatch.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
service-com-amazonaws-sfn-awsstepfunctions = { workspace = true }
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }

[lints]
workspace = true
