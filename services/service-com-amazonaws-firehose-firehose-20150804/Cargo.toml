[package]
name = "service-com-amazonaws-firehose-firehose-20150804"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` beyond the workspace default: the tests await the clock-owed
# CREATING -> ACTIVE / DELETING -> removed spans with `tokio::time::sleep`.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for IAM, driven over the in-process callback
# (`OperationContext::callback`): `CreateDeliveryStream`/`UpdateDestination` resolve every
# `RoleARN` a configuration names with `GetRole` before the stream is written. Only the
# generated client is needed — the emulator supplies the transport.
aws-sdk-iam = { version = "1", default-features = false }
# `iam_trust_policy`: the one reading of an IAM trust policy, shared with every other
# service that resolves a caller-supplied role.
service-common = { path = "../common" }
# The destination of a Firehose stream is an Amazon S3 location, and the one object store
# in this emulator is the Amazon S3 service's: a delivered object is written there.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The `GZIP` compression format a destination can ask for.
flate2 = "1"
# The `ZIP` compression format a destination can ask for.
zip = { version = "9", default-features = false, features = ["deflate"] }
# The `Snappy` / `HADOOP_SNAPPY` compression formats a destination can ask for.
snap = "1"
# The random component of a delivered object's name, which Firehose mints per object.
uuid = { version = "1", features = ["v4"] }
# The jq program a `MetadataExtraction` processor carries
# (`MetadataExtractionQuery`, with `JsonParsingEngine` `JQ-1.6`) is run by a maintained
# jq implementation rather than read by hand. It is an EXECUTION SUBSTRATE: it evaluates a
# program taken from a request, so `src/state/delivery.rs` builds it default-deny — jq's
# core constructs over the one record handed to it and NO library function at all, so the
# engine holds no environment, file, input, import or unbounded-generator native to call —
# and bounds every run's steps, memory, depth and output there.
jaq-core = "2"
# `serde_json`: the record a `MetadataExtraction` query reads is JSON, so the jq value is
# converted to and from the JSON value the rest of this crate parses it as.
jaq-json = { version = "1", features = ["serde_json"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The destination reads of the delivery suite go through Amazon S3's own restXml wire, so
# its listings are read with the same XML reader that service's tests use.
quick-xml = "0.41"

[lints]
workspace = true
