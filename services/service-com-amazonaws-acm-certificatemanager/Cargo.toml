[package]
name = "service-com-amazonaws-acm-certificatemanager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256, for the stable domain-validation labels and request fingerprints this
# service derives from a certificate's own id.
sha2 = { workspace = true }
# Hex encoding for those labels and for the opaque `NextToken`s this service's list
# operations issue.
hex = { workspace = true }
# Certificate ids: ACM certificate ARNs end in a v4 UUID.
uuid = { version = "1", features = ["v4"] }
# Reads the X.509 certificates `ImportCertificate` accepts: their names, validity,
# serial, algorithms and key-usage extensions.
x509-cert = "0.2"
# Reads the PEM framing and the PKCS#8 structure of the private key an import carries,
# so an encrypted or mismatched key is refused.
pkcs8 = { version = "0.10", features = ["pem", "std"] }
# The PKCS#1 RSA key structures, for the RSA key size an imported certificate's
# `KeyAlgorithm` is read from and for matching its private key.
pkcs1 = "0.7"
# The SEC1 elliptic-curve private key structure, for matching an EC private key with
# the certificate it was imported with.
sec1 = "0.7"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Generates the real certificates and key pairs the import tests feed the service,
# independently of the DER this crate reads.
rcgen = "0.13"
# The API Gateway V2 service, so one test can drive the cross-service flow a client
# performs with an imported certificate: import it here, then build a regional custom
# domain on the ARN this service answered. TEST-ONLY — nothing in `src/` reaches it.
service-com-amazonaws-apigatewayv2-apigatewayv2 = { workspace = true }

[lints]
workspace = true
