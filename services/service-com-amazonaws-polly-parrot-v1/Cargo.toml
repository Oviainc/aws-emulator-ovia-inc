[package]
name = "service-com-amazonaws-polly-parrot-v1"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination tokens are hex-encoded, so a garbage token is detectable.
hex = { workspace = true }
# PLS lexicon documents (PutLexicon `Content`) are XML: parse them with a real
# XML reader rather than scanning the text by hand.
# >= 0.41 is required: RUSTSEC-2026-0195 affects 0.37.
quick-xml = "0.41"
# Ogg bitstream framing (pages, lacing, CRC) for the ogg_opus output format.
ogg = "0.9"
# `TaskId`s are UUIDs: mint and recognise them with a real UUID implementation
# rather than scanning the text by hand. `v5` is for the deterministic task ids
# the test fixtures derive from a label.
uuid = { version = "1", features = ["v4", "v5"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
