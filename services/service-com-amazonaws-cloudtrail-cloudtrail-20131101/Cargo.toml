[package]
name = "service-com-amazonaws-cloudtrail-cloudtrail-20131101"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries two readers this crate needs.
# `rpc_target`: the one reading of an `awsJson` `X-Amz-Target` — which service and which
# operation it names — which this service's routing seams read because its published
# target prefix is the fully qualified Coral name and so carries dots of its own.
# `arn`: the ONE parse of a caller-supplied resource ARN (the six fields, the vendor,
# the resource type and the id of a resource of that type), which every tagging call
# reads its `ResourceId` through and which the resource-policy operations read their
# `ResourceArn` through.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# `sqlparser`: the SQL parse a dashboard widget's `QueryStatement` is READ with, so a
# query CloudTrail Lake cannot run is refused by its syntax rather than by matching text.
sqlparser = "0.59"
tracing = { workspace = true }
# Mints the event data store id that is the suffix of its ARN, and the modelled `UUID`
# import id `StartImport` hands back (36 characters of `^[a-f0-9\-]+$`): a v4 UUID, the
# form CloudTrail Lake uses.
uuid = { version = "1", features = ["v4"] }
# Hex-codes the opaque `ListChannels` pagination token (`src/ops/list_channels.rs`).
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
