[package]
name = "service-com-amazonaws-schemas-schemas"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# `Serialize` for the ordered JSON document `GetDiscoveredSchema` writes, whose member
# order is part of the document.
serde = { workspace = true }
# Re-encodes a JSON document straight from a `serde_json` reader into a `serde_json`
# writer, which is how a stored resource policy is normalised without its member order
# being sorted away by an intermediate `serde_json::Value`.
serde-transcode = "1.1"
tracing = { workspace = true }
# Opaque, query-string-safe encoding for the `NextToken` the listing operations mint.
hex = { workspace = true }
# The ZIP archive `GetCodeBindingSource` answers with: a code binding's source is a
# package of files, which is one archive.
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
