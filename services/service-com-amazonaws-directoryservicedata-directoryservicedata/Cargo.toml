[package]
name = "service-com-amazonaws-directoryservicedata-directoryservicedata"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The tree's shared validation half: one reading of a request yields the framework's own
# violations with the value each clause quotes restored to the bytes the caller sent.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The Directory Service CONTROL plane's store, for the log subscription that forwards a
# directory's domain controller security logs (`state::security_log`): a write to a
# directory's objects is an act those controllers audit, so it is forwarded to the
# subscribed CloudWatch Logs group through that plane's own emitter.
service-com-amazonaws-directoryservice-directoryservice-20150416 = { workspace = true }
# Digests a `ClientToken`'s request so an idempotency replay is compared without the
# ledger holding a copy of the (sensitive) values themselves.
sha2 = { workspace = true }
# Renders an opaque `NextToken` cursor, and the SHA-256 fingerprint above, as text.
hex = { workspace = true }
# Runs the `@pattern` the model declares for an attribute NAME — the key of the attribute
# map, whose constraints the framework's validating walk does not capture.
regex = "1.13"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
