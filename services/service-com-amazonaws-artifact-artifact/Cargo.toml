[package]
name = "service-com-amazonaws-artifact-artifact"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digests the `clientToken` idempotency record fingerprints a create request with, and
# seals the opaque `nextToken` pagination cursors in `src/state.rs`.
sha2 = { workspace = true }
# Renders those digests as the hex strings the idempotency record and the pagination
# cursors are encoded as.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
