[package]
name = "service-com-amazonaws-licensemanagerusersubscriptions-licensemanagerusersubscriptions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes this service's opaque pagination cursors.
hex = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): the `InstanceId` a user association names is an EC2
# instance, and so are the subnets and the security group a registration's `Settings`
# name, which are EC2's resources, so `src/state/ec2_fleet.rs` asks EC2 what the account
# has rather than keeping a list of ids here. Only the generated client is needed — the
# emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The shared refusal-wording helpers every service in this tree reads the same rules
# from: `validation::unanchored` is the one implementation of quoting a `@pattern`
# requirement without the whole-value anchors a model writes around it, and
# `iam_authorization` is the one evaluation of identity-based policies and the one spelling
# of IAM's refusal sentence.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The EC2 service, mounted beside this one in the test harness: that an instance a client
# launched can have a user associated with it, and that a registration resolves the
# subnets and security group it names, can only be driven end to end with the owner of
# those resources on the same engine. DEV-ONLY: this crate depends on no other service's
# crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
