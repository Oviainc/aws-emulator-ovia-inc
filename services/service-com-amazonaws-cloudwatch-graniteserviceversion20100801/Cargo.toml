[package]
name = "service-com-amazonaws-cloudwatch-graniteserviceversion20100801"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination cursors: hex makes a token this service did not mint detectable,
# which is what lets DescribeAlarms refuse a malformed NextToken.
hex = { workspace = true }
# GetMetricData's cursor carries a fixed-size digest of the request it was minted for, so a
# token replayed against a different request is refused at constant token size.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

