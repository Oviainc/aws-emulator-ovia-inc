[package]
name = "service-com-amazonaws-cloudwatch-graniteserviceversion20100801"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# The alarm clock (`state::alarm_actions::drive_alarm_clock`) waits for the instant an
# evaluation becomes due, so this crate needs tokio's timer as well as its runtime and
# macros: the feature is declared here rather than relied on from another crate's resolution.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination cursors: hex makes a token this service did not mint detectable,
# which is what lets DescribeAlarms refuse a malformed NextToken.
hex = { workspace = true }
# `arn`: the ONE parse of a caller-supplied resource ARN, shared with every other service —
# an alarm action's ARN (and the Region and account of the alarm's own ARN) is read through
# it rather than split here.
service-common = { path = "../common" }
# The AWS SDK for SNS, driven over the in-process callback
# (`OperationContext::callback`): an alarm state transition executes its SNS topic actions
# with `Publish` (`state::alarm_actions::settle_alarms`). Only the generated client is
# needed — the emulator supplies the transport, so the SDK's own HTTPS stack and runtime are
# left out.
aws-sdk-sns = { version = "1", default-features = false }
# GetMetricData's cursor carries a fixed-size digest of the request it was minted for, so a
# token replayed against a different request is refused at constant token size.
sha2 = { workspace = true }
# `state::metric_widget::render`: the graph `GetMetricWidgetImage` answers with IS a data plot,
# so the maintained plotting library rasterises it (its lines, columns and markers) instead of
# a second rasteriser being written here. Only the in-memory bitmap backend is taken: no file
# or SVG output, and no system font lookup.
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend"] }
# The bitmap that backend draws into is encoded as the PNG the `MetricWidgetImage` blob
# carries by the maintained encoder.
png = "0.17"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The `MetricWidgetImage` blob arrives base64-encoded on this service's JSON wire, so the
# widget-image suite decodes it with the maintained codec before it decodes the PNG.
base64 = "0.22"
# SNS is mounted beside CloudWatch on one engine in the alarm-action tests, because an
# alarm's action is an SNS topic and a notification is asserted where a client sees it: on
# the topic's subscription.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# SQS is mounted with them, because the subscriber of the alarm's topic is a queue and that
# is where the delivered notification is read.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
