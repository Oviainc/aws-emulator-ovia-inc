hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# `time` for the tests that wait on a clock-owed instance transition.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
