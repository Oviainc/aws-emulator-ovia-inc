[package]
name = "service-com-amazonaws-lightsail-lightsail-20161128"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Identifier minting: an instance's and an operation's ids are cut from a
# SHA-256 of this store's counter plus a per-process seed, rendered as hex.
sha2 = { workspace = true }
hex = { workspace = true }
# A Lightsail bucket IS an S3-compatible object store, so the bucket it is served
# from lives in the ONE object store this emulator holds — Amazon S3's own — which
# this service provisions a bucket in and reads the object presence of.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# `time` for the tests that wait on a clock-owed instance transition.
tokio = { workspace = true, features = ["time"] }
# An XML reader for the `ListObjectsV2` body the bucket object data plane answers
# with, so a listing is read as a client reads it rather than by slicing the body.
quick-xml = "0.41"

[lints]
workspace = true
