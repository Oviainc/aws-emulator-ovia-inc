[package]
name = "service-com-amazonaws-lightsail-lightsail-20161128"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Identifier minting: an instance's and an operation's ids are cut from a
# SHA-256 of this store's counter plus a per-process seed, rendered as hex.
sha2 = { workspace = true }
hex = { workspace = true }
# A Lightsail bucket IS an S3-compatible object store, so the bucket it is served
# from lives in the ONE object store this emulator holds — Amazon S3's own — which
# this service provisions a bucket in and reads the object presence of.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The OpenSSH key, certificate and fingerprint formats: the temporary key pair
# `GetInstanceAccessDetails` grants, and the SSH host key it records for an
# instance, are real Ed25519 key material described by this crate.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "getrandom"] }
# The X.509 RDP certificate an RDP access to a Windows instance witnesses.
rcgen = "0.13"
# The SHA-1 half of a host key's two published fingerprints.
sha1 = "0.10"
# The base64 body of an OpenSSH public key line, and the encoding OpenSSH
# publishes a key fingerprint in.
base64 = "0.22"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The granted temporary key material is read back with the SAME OpenSSH key crate
# the service writes it with, so a test asserts a real key rather than a shape.
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "getrandom"] }
# The DER behind a reported RDP certificate's PEM, which its published
# fingerprints are checked against.
base64 = "0.22"
sha1 = "0.10"
# `time` for the tests that wait on a clock-owed instance transition.
tokio = { workspace = true, features = ["time"] }
# An XML reader for the `ListObjectsV2` body the bucket object data plane answers
# with, so a listing is read as a client reads it rather than by slicing the body.
quick-xml = "0.41"

[lints]
workspace = true
