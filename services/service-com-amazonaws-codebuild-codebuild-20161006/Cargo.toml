[package]
name = "service-com-amazonaws-codebuild-codebuild-20161006"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# A StartBuild idempotency entry keeps a fixed-size SHA-256 of the request it was
# issued for, rather than the request itself; the same digest derives a build's
# RFC 9562 version-8 id.
sha2 = { workspace = true }
hex = { workspace = true }
# `iam_role`: the workspace's ONE reading of a caller-supplied IAM role ARN — which role
# of this account it names, and whether that role's trust policy admits a service
# principal — which `CreateProject` and `StartBuild` ask before storing a project or
# starting a build that would RUN AS the role the request hands over.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The settle test has to let real time pass; the timer is enabled for the test
# targets only, so the production dependency does not carry it.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
