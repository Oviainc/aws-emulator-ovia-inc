[package]
name = "service-com-amazonaws-codebuild-codebuild-20161006"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# A StartBuild idempotency entry keeps a fixed-size SHA-256 of the request it was
# issued for, rather than the request itself; the same digest derives a build's
# RFC 9562 version-8 id.
sha2 = { workspace = true }
hex = { workspace = true }
# `iam_role`: the workspace's ONE reading of a caller-supplied IAM role ARN — which role
# of this account it names, and whether that role's trust policy admits a service
# principal — which `CreateProject` and `StartBuild` ask before storing a project or
# starting a build that would RUN AS the role the request hands over.
service-common = { path = "../common" }
# `aws-sdk-s3`: a build uploads its output artifacts to the bucket those artifacts name,
# so `StartBuild` and `StartBuildBatch` resolve that bucket against the service that owns
# buckets (S3's `HeadBucket`). A LIBRARY: it opens no connection of its own here — the
# client is built over the framework's in-process callback (its HTTP client and
# credentials provider), so the call is dispatched inside this emulator and reaches no
# host off it. `default-features = false` keeps the default TLS and connector stacks out.
aws-sdk-s3 = { version = "1", default-features = false }
# `yaml-rust2`: a project's buildspec is YAML, and the `batch` section of it is what
# declares the builds a batch build fans out into; yaml-rust2 is the pure-Rust YAML 1.2
# implementation the other services in this workspace read caller-supplied YAML with (a
# DATA-FORMAT PARSER, not an execution substrate: no `unsafe`, no C, no build script).
# The text it is handed is bounded first — see `crate::state`'s batchspec reading.
yaml-rust2 = { version = "0.10", default-features = false }
# `brush-parser`: the POSIX/bash TOKENIZER AND GRAMMAR a buildspec's command lines are
# read with, so the and-or lists, pipelines, assignments and quoting of a command line
# come from the shell's own grammar rather than from scanning the text. A DATA/LANGUAGE
# PARSER, the same position `sqlparser` and `yaml-rust2` hold in this workspace, and NOT
# an execution substrate: it builds a syntax tree and runs nothing. The project's
# EXECUTING half, `brush-core`, is deliberately NOT taken: an engine resolves a command
# against the host's PATH and starts a host process for it, opens the host files a
# redirection names and expands a command substitution by running it, and the crate
# exposes no seam to replace any of those with an in-memory one — so it cannot be
# confined here. What a command DOES is this crate's own `state::build_shell`, which
# performs a fixed catalog of session-local utilities and starts no process, opens no
# socket and touches no file; every other command, command form and expansion answers as
# a shell answers one it cannot run. The default feature set (empty) keeps the parser's
# optional diagnostics, serde and alternate-parser code out. Its grammar is generated at
# BUILD TIME by the `peg` proc macro, which runs on the builder's machine like every
# other proc macro in this workspace; it compiles no C and the tree carries no FFI. The
# text it is handed is bounded first — see `crate::state::build_shell`'s own size,
# nesting, expansion and command-count bounds.
brush-parser = { version = "0.4", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The settle test has to let real time pass; the timer is enabled for the test
# targets only, so the production dependency does not carry it.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
