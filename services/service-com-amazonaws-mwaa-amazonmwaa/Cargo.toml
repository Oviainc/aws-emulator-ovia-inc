[package]
name = "service-com-amazonaws-mwaa-amazonmwaa"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Content-derived identifiers: the environment-id segment of the Apache Airflow web
# server host and the vpce-svc id of each VPC endpoint service name are digests of the
# environment's own ARN, so they are stable across reads and unique per environment.
sha2 = { workspace = true }
# Opaque pagination cursors: hex-encode the internal list cursor so `NextToken` is a
# single-token string a client only ever echoes back.
hex = { workspace = true }
# `arn` (the tree's one ARN parse, which reads the NAME out of the calling identity's ARN)
# and `request_access_key_id` (the key id a request presents, wherever SigV4 put it).
service-common = { path = "../common" }
# The STS store resolves which IAM identity a request's credential speaks for — the
# identity `CreateWebLoginToken` reports — so this service reads the state of the service
# that minted that credential rather than keeping a second copy of the fact.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The CloudWatch store `PublishMetrics` publishes the environment health metrics it accepts
# to (the `AWS/MWAA` namespace, `state::metrics`): the operation documents Amazon CloudWatch
# as their destination, and CloudWatch refuses a `PutMetricData` into a reserved `AWS/`
# namespace, so this writes the very store `ListMetrics`/`GetMetricStatistics` read.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The CloudWatch Logs store the log group of each ENABLED Apache Airflow log type is created
# in (`state::log_groups`): MWAA publishes a log type's logs to the group it creates for that
# type and reports that group's ARN, so the group has to exist in the very store CloudWatch
# Logs' own `DescribeLogGroups` / `GetLogEvents` read.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The identity suite makes the callers it signs as through IAM's and STS's OWN operations
# (a user and its access key, a role and a session of it), so the identities asserted on
# are the ones those services minted.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The published metrics are asserted where a client reads them, so CloudWatch is mounted
# beside this service on one engine and asked through its own `ListMetrics` and
# `GetMetricStatistics`.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }

[lints]
workspace = true
