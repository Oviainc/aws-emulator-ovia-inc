[package]
name = "service-com-amazonaws-scheduler-awschronosservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `tokio::time` drives the tests' wait past a group deletion's due instant.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# URL-safe opaque encoding for the `ListSchedules` page token.
hex = { workspace = true }
# The AWS SDK for IAM, driven over the in-process callback
# (`OperationContext::callback`): `CreateSchedule`/`UpdateSchedule` verify a
# target's execution role with `GetRole` before persisting a schedule. Only the
# generated client is needed — the emulator supplies the transport, so the SDK's
# own HTTPS stack and runtime are left out.
aws-sdk-iam = { version = "1", default-features = false }
# `iam_trust_policy`: the one reading of an IAM trust policy — including the decode of
# the URL-encoded form IAM reports a document in — shared with every other service that
# resolves a caller-supplied execution role.
service-common = { path = "../common" }
# The `cron(...)` and `at(...)` halves of a `ScheduleExpression` are read by
# maintained parsers rather than by a hand-written grammar; `chrono` is what the
# cron parser is written in, and `chrono-tz` carries the IANA database a
# `ScheduleExpressionTimezone` has to name a zone of.
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
