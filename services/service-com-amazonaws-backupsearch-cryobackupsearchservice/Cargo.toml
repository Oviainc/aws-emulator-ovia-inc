[package]
name = "service-com-amazonaws-backupsearch-cryobackupsearchservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mint the UUID `SearchJobIdentifier`/`ExportJobIdentifier` this service hands out
# (`state::new_uuid`), which is the identifier shape its recordings show: `sha2` digests
# the entropy behind the 128 bits and `hex` renders them. Both were already declared for
# this crate, and this is how the services beside it mint a UUID-shaped id (see
# `service-com-amazonaws-batch-awsbatchv20160810`'s `state::new_uuid`), so the fix needs
# no new crate and leaves the workspace lockfile alone.
sha2 = { workspace = true }
hex = { workspace = true }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# The KMS store, where an `EncryptionKeyArn` is resolved to the key it names
# (`EncryptionKeyArn` is an `@arnReference` to `AWS::KMS::Key`).
service-com-amazonaws-kms-trentservice = { workspace = true }
# The AWS Backup store, which is where this account's recovery points live: a search job
# searches the backups AWS Backup took, so `state::backup_plane` resolves a `SearchScope`
# against that component's own records rather than against a second list of its own.
service-com-amazonaws-backup-cryocontrollerusermanager = { workspace = true }
# `iam_authorization`: the shared evaluation of those documents against an action on a
# resource, so every service that enforces authorization decides alike. `iam_role` reads
# which IAM entity a principal ARN names. `s3_client` is this tree's one construction of
# the in-process Amazon S3 client an export's results object is written through.
service-common = { path = "../common" }
# The destination of an export: `StartSearchResultExportJob` writes the exported results
# into the Amazon S3 bucket the request names, over the emulator's own in-process
# transport, so the SDK's object-store client and its `ByteStream` are needed here. Already
# in the workspace lockfile (every service that writes an object declares the same line).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The framing of the exported results object: a results CSV is RFC 4180, so the maintained
# writer frames it rather than a hand-rolled one that would mis-quote a separator, a quote
# or a newline inside an object key. Already in the workspace lockfile.
csv = "1.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The destination of an export, mounted BESIDE this service in the suites that assert what
# an export writes: the results object is written into the emulator's own Amazon S3 over
# the in-process callback, so the bucket a test creates is the bucket the export writes to.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
