[package]
name = "service-com-amazonaws-costexplorer-awsinsightsindexservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# The `time` feature is on so the processing-status test can wait with
# `tokio::time::sleep` instead of blocking the runtime worker.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Derives the UUID-shaped id in a generated cost category ARN (RFC 9562 version 8) from
# the registry's own sequence number and the creation instant.
sha2 = { workspace = true }
# Renders that id, and encodes the opaque ListCostCategoryDefinitions pagination cursor.
hex = { workspace = true }
# `rfc3339`: the one reading of the UTC offset a string-typed timestamp declares, shared
# with every other service that has to compare two of them.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
