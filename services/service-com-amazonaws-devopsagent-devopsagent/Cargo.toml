[package]
name = "service-com-amazonaws-devopsagent-devopsagent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries this tree's ONE rendering of a minted 16-byte identifier
# as the text of a UUID, which a Trigger's goal identifier is built from.
service-common = { path = "../common" }
# Opaque pagination tokens: hex-encodes the list cursor a `nextToken` carries.
hex = { workspace = true }
# Reads the zip bundle an asset's content can arrive as, so its entries become the
# asset's files, and writes the bundle an asset's content is exported as.
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
