[package]
name = "service-com-amazonaws-docdb-amazonrdsv19"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `state::new_request_id`'s digest: a maintained hash, so the per-response request id in an
# awsQuery `<ErrorResponse>` envelope is shaped by library code rather than by hand.
sha2 = { workspace = true }
hex = { workspace = true }
# `rds_cluster_parameters`: the cluster parameter catalog and the parameter rules the
# Amazon RDS, DocumentDB and Neptune models of the one `rds` front door share
# (`src/state.rs`).
# `db_data_sources`: the shared directory a minted `DbClusterResourceId` /
# `DbiResourceId` is recorded in, so a monitoring service (Performance Insights) can
# tell which service owns that id.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The percent-encoder the test harness builds its awsQuery form bodies with
# (`tests/all/cluster_lifecycle.rs`), rather than hand-writing one.
percent-encoding = "2"

[lints]
workspace = true

