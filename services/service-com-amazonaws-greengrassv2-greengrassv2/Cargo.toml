[package]
name = "service-com-amazonaws-greengrassv2-greengrassv2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The request-claim rule for the two services that share the `greengrass` signing name.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# `serde::de::IgnoredAny` validates a JSON document without building a tree.
serde = { workspace = true }
tracing = { workspace = true }
# Greengrass component recipes are YAML *or* JSON documents; YAML 1.2 is a
# superset of JSON, so one YAML parser reads both and re-renders either.
# yaml-rust2 is a pure-Rust YAML 1.2 implementation (no `unsafe`, no C
# transpile), which keeps SR-MEM-001 true of the whole request path.
yaml-rust2 = { version = "0.10", default-features = false }
# Component versions are semantic versions, so `latestVersion` is the greatest
# one by semver precedence rather than by byte order.
semver = "1"
# Deployment and IoT job identifiers are UUIDs.
uuid = { version = "1", features = ["v4"] }
# Opaque pagination cursors are hex-encoded resume keys.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
