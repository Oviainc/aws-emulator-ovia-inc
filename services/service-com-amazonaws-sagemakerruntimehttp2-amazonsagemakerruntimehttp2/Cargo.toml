[package]
name = "service-com-amazonaws-sagemakerruntimehttp2-amazonsagemakerruntimehttp2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `vnd.amazon.event-stream` message framing (prelude, headers, CRC32s) for the
# bidirectional stream this service's one operation reads and writes. Pinned to
# the same major as the vendored protocol crate, which frames with it too.
aws-smithy-eventstream = "0.60"
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# A capturing subscriber, so a test can assert that the operation's structured
# audit record is actually emitted and carries its fields.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
