[package]
name = "service-com-amazonaws-snowball-awsiesnowballjobmanagementservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque `ListJobs` pagination cursors, and the hex digits of a minted id.
hex = { workspace = true }
# The 32 hex digits of a minted `AddressId` / `JobId`, which the modelled patterns spell
# `[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}`.
sha2 = { workspace = true }
# Calendar arithmetic for a long-term pricing contract's end date: the start plus the
# whole months its `LongTermPricingType` names, with month lengths and leap days handled
# by the crate rather than by a calendar of this service's own. 0.4.31 is where
# `DateTime::from_timestamp` landed, which is the entry point used here.
chrono = { version = "0.4.31", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
