[package]
name = "service-com-amazonaws-lambda-awsgirapiservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` on top of the workspace features: the event source mapping poller
# (`state::event_source_poller`) waits between passes with `tokio::time::sleep` rather
# than parking a worker thread, and `sync` for the run slots an invocation takes one of
# (`state::execution`).
tokio = { workspace = true, features = ["sync", "time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# An event source mapping on a queue is accepted against the QUEUE's own configuration,
# which lives in the Amazon SQS emulator's queue store: it is reached through the shared
# engine, which needs the owning service's state TYPE.
service-com-amazonaws-sqs-amazonsqs = { workspace = true }
# A mapping is also accepted against what the invoked function's EXECUTION ROLE may read on
# the event source (`state::event_source_authorization`): the role's policies live in the
# IAM emulator's store, reached through that same shared engine. The same store holds the
# identity-based policies an INVOCATION is authorized against
# (`state::invoke_authorization`).
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
# A container-image package names an image in the Amazon ECR registry, and Lambda follows
# that reference when the package is stored (`state::image_source`): the registry's own
# image and tag records are reached through the shared engine, which needs the owning
# service's state TYPE.
service-com-amazonaws-ecr-amazonec2containerregistry-v20150921 = { workspace = true }
# A function's own invocation logs go to the CloudWatch Logs store of the same engine
# (`state::log_delivery`), which is where `FilterLogEvents` and `GetLogEvents` read them
# from: the delivery writes that service's own records rather than a second copy.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# An invocation is authorized against the principal its access key id speaks for, which is
# the session the token service minted that key for — the same record `GetCallerIdentity`
# answers from (`state::invoke_authorization`), reached through the shared engine.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# CodeSha256 is the SHA-256 of the stored deployment package...
sha2 = { workspace = true }
# ...reported base64-encoded, as the model's CodeSha256 member describes it.
base64 = "0.22"
# The other two digest families the `crypto` core module a Node handler imports computes
# (`state::execution::node::digest`), beside the SHA-2 one above, and the keyed form of all
# of them. Taken from crates rather than written here: a digest is arithmetic a maintained
# implementation already states.
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
# The hexadecimal the guest hands bytes over and reads digests back as.
hex = { workspace = true }
# The cryptographic random bytes `crypto.randomBytes`/`randomUUID` draw from: the one
# source of randomness a run has, read from the platform rather than from a seed.
getrandom = "0.3"
# The IANA time-zone database a run's `Intl` and local `Date` readings stand on
# (`state::execution::node::intl`): a zone's offset at an instant, with its daylight-saving
# transitions, is this database's answer, compiled into the binary rather than read from a
# host path. `chrono` is taken for the calendar arithmetic `chrono-tz` states its offsets in
# terms of, with no clock feature, so no reading of the HOST's own zone is compiled in: the
# only zone a run reads is the one its own `TZ` names.
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false }
# RevisionId is a UUID, minted fresh on every change to a function.
uuid = { version = "1", features = ["v4"] }
# The AWS SDK clients the event source mapping poller (`state::event_source_poller`)
# reaches the other services of THIS emulator through, over the in-process callback
# (`OperationContext::callback`): the mapped Kinesis data stream or DynamoDB table stream
# it reads (`ListShards`/`DescribeStream`, `GetShardIterator`, `GetRecords`) and the
# function it hands each batch to (`Invoke`). Only the generated clients are needed: the
# emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-kinesis = { version = "1", default-features = false }
aws-sdk-dynamodbstreams = { version = "1", default-features = false }
aws-sdk-lambda = { version = "1", default-features = false }
# A function whose environment variables are encrypted with a customer managed key can
# only be invoked while that key can decrypt them, and the key's state belongs to the key
# service: it is asked over the same in-process callback
# (`state::execution::environment_key`).
aws-sdk-kms = { version = "1", default-features = false }
# The CloudWatch store Lambda publishes its own metrics to (the `AWS/Lambda` namespace,# `state::metrics`). CloudWatch refuses a `PutMetricData` into a reserved `AWS/`
# namespace, so a service's own metrics never travel over that API; this writes the very
# store `ListMetrics`/`GetMetricStatistics` read.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }

# ---------------------------------------------------------------------------
# The EXECUTION substrate: what runs a function's own deployment package.
#
# `Invoke` answers with whatever the caller's handler returned, so the handler has to
# run. These crates are an in-process execution substrate — they interpret
# caller-supplied code — and every one of them is taken with the host-reaching surface
# switched OFF at compile time, so the capability class is "run the caller's Python or
# JavaScript in this process, with no host access at all":
#
# * `rustpython-vm` with `default-features = false` leaves `host_env`, `stdio` and
#   `threading` out of the build, so the VM registers no `ctypes` host loader, writes
#   nothing to this process's stdio and starts no interpreter thread; `compiler` is the
#   bytecode compiler for the package's own sources and `freeze-stdlib` takes the Python
#   standard library from `rustpython-pylib`'s frozen copy rather than from any host
#   path.
# * `rustpython-stdlib` with `default-features = false` is the native-module pool. The
#   crate is NOT registered wholesale: `crate::execution::python` filters
#   `stdlib_module_defs` through its own allow-list, so `_socket`, `_ssl`, `select`,
#   `_posixsubprocess`, `mmap`, `_ctypes`, `_thread` and `posix` are never reachable from
#   guest code, and the modules the guest does expect (`os`, `_thread`) are this crate's
#   own replacements.
# * `rustpython-ruff_*` are RustPython's own forks of the Python parser's AST crates.
#   They are PINNED exactly: `rustpython-codegen` 0.6 is built against the 0.16.5 AST,
#   and 0.16.10 renamed fields it uses, so an unpinned resolution picks a newer 0.16.x
#   and fails to compile.
# * `nix` (`resource` only) and `memory-stats` read this process's own resource usage —
#   the run thread's faulted pages and the process resident size — which is how a run is
#   bounded in memory: RustPython exposes no allocator seam, so the bound is sampled from
#   outside the guest. `nix` is the only one of these that compiles no C; `memory-stats`
#   reads `/proc/self/statm` on Linux.
#
# Native and unsafe surface accepted here: the RustPython tree uses `unsafe` for its
# object model and its frozen-module tables, and its `malachite`/`num` arithmetic
# dependencies compile Rust only. No crate in this set compiles a C toolchain
# dependency, loads a shared library, or opens a socket, a process or a host file.
# Advisories considered: RUSTSEC-2026-0394 (RustPython up to 0.5, fixed in 0.6 — the line
# taken here) and the `atty` advisory that the 0.3/0.4 lines pull in (not reachable from
# 0.6).
# * `rquickjs` is the QuickJS JavaScript engine, which is what RUNS a `nodejs*`
#   function's own handler (`crate::state::execution::node`). The `loader` feature is
#   taken because module resolution has to be THIS emulator's: an `import` is answered
#   from the deployment package's own entries and the core modules the crate supplies,
#   and from nothing else. The `dyn-load` feature is deliberately NOT taken, so no
#   native-library loader is compiled in, and plain QuickJS exposes no filesystem,
#   process, socket or environment API of its own: the whole host surface of a run is
#   the three functions that module installs. Each run is bounded by the engine's own
#   memory limit (set from the function's `MemorySize`), a stack limit, an interrupt
#   handler holding the deadline and the step ceiling, and the host-driven timer queue.
#   It is also a NATIVE component: `rquickjs-sys` compiles the QuickJS C sources with
#   `cc` at build time, which is outside this crate's forbidden `unsafe_code`; the
#   version is pinned and resolves with a checksum in Cargo.lock. No advisory stands
#   against this line.
rquickjs = { version = "0.14", features = ["loader"] }
rustpython-vm = { version = "0.6", default-features = false, features = [
    "compiler",
] }
rustpython-stdlib = { version = "0.6", default-features = false }
rustpython-pylib = { version = "0.6", features = ["freeze-stdlib"] }
rustpython-ruff_python_ast = "=0.16.5"
rustpython-ruff_python_parser = "=0.16.5"
rustpython-ruff_python_trivia = "=0.16.5"
rustpython-ruff_source_file = "=0.16.5"
rustpython-ruff_text_size = "=0.16.5"
nix = { version = "0.31", default-features = false, features = ["resource"] }
memory-stats = "1"
# The TRAFFIC SPLIT an alias with a `RoutingConfig` performs: one uniform draw per
# invocation decides which of the two versions that invocation runs on
# (`state::alias_routing`).
rand = "0.9"
# A deployment package is a .zip archive, and the handler's module is one entry in it.
# Read with `deflate` alone — no other compression method is linked in — and never
# extracted to a host path.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `InvokeWithResponseStream`'s `PayloadChunk` carries its blob as the FRAME's own payload
# (`@eventPayload`), which the framework's event serializer does not express: that one
# frame is written with the event-stream encoder itself.
aws-smithy-eventstream = "0.60"
# A running handler's SDK call to a `restJson1` service binds its input to a URI, so a label
# or a query parameter's value is percent-encoded on the way into one
# (`state::execution::rest_json`).
percent-encoding = "2.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The key service a durable function's `DurableConfig` names a key in, mounted beside
# lambda so a key really is disabled when the test says it is.
service-com-amazonaws-kms-trentservice = { workspace = true }
# A deployment package the invoke tests upload is a .zip archive they write in memory.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `time` on top of the workspace features: the data-plane tests wait out the state-settle
# span and the poller's passes with `tokio::time::sleep`.
tokio = { workspace = true, features = ["time"] }
# The services a mapping's event source and its own metrics live in are mounted beside
# lambda on ONE engine in the data-plane tests, because a delivery is asserted where a
# client sees it: on the stream the records were put to, and in the series CloudWatch
# reports for the function. A DynamoDB table's stream is two of them: the table the item
# is written to, and the stream surface its records are read through.
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }
# An invocation's own log is delivered to CloudWatch Logs, so the tests that assert a run's
# lines read them where a client reads them: through that service's own API, mounted beside
# lambda on ONE engine.
service-com-amazonaws-cloudwatchlogs-logs-20140328 = { workspace = true }
# A handler's SDK call to a REST-bound service is asserted against the service that answers
# it, so Amazon API Gateway is mounted beside lambda on ONE engine for those tests.
service-com-amazonaws-apigateway-backplanecontrolservice = { workspace = true }
# The same table is the sink a handler's OWN outbound call writes to in the stream-driven
# pipeline test, mounted on that same engine so the item is read back where a client reads
# it.
service-com-amazonaws-dynamodb-dynamodb-20120810 = { workspace = true }
service-com-amazonaws-dynamodbstreams-dynamodbstreams-20120810 = { workspace = true }
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }

[lints]
workspace = true
