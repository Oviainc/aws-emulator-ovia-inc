[package]
name = "service-com-amazonaws-ivs-amazoninteractivevideoservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashing for the unique resource ids this service mints (channel ids, stream-key
# ids and stream-key values).
sha2 = { workspace = true }
# Hex codec for those ids and for the opaque `PaginationToken` this service issues.
hex = { workspace = true }
# The modelled `@pattern` this service enforces itself (the tagging `ResourceArn`, whose
# modelled pattern no IVS ARN can satisfy) is run through the same regex engine the
# framework's own constraint walk uses, at the minor version that walk pins.
regex = "1.12"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
