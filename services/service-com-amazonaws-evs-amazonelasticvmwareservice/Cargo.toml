[package]
name = "service-com-amazonaws-evs-amazonelasticvmwareservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource), which this service's authorization gate runs on every request.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks
# for, and the STS store resolves which principal that is: this service reads both
# services' OWN state accessors rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The EC2 store holds the account's VPCs, subnets and Elastic IP allocations, which an
# Amazon EVS environment is deployed into: `CreateEnvironment` verifies the network it
# names exists by asking EC2's own store rather than guessing.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
