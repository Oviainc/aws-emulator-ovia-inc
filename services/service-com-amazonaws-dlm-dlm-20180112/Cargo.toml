[package]
name = "service-com-amazonaws-dlm-dlm-20180112"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The `cron(...)` form of a schedule's creation rule is read by this maintained
# parser rather than a hand-written grammar, so the creation frequency the
# expression states can be judged against the floor a schedule that archives its
# snapshots runs at, and `chrono` (which the parser is written in) is what the
# instants it yields are computed in
# (`state::archive_creation_frequency`).
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
