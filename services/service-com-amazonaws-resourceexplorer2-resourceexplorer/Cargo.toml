[package]
name = "service-com-amazonaws-resourceexplorer2-resourceexplorer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination cursors are hex-encoded, so a NextToken carries no readable offset.
hex = { workspace = true }
# SHA-256 for the derived UUID-shaped segment of index and view ARNs.
sha2 = { workspace = true }
# The modelled `ViewName` @pattern is enforced in `CreateView`'s handler rather than at
# the request boundary, and a Smithy @pattern is a regular expression, so it is matched
# with a maintained regex engine instead of a hand-rolled restatement of the class.
regex = "1.12"
# `service-common` carries the ONE resource-ARN parse, which the tagging operations read a
# caller-supplied `resourceArn`'s vendor and resource type through.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` for the test-side wait past the index settle span (tokio::time::sleep).
tokio = { workspace = true, features = ["time"] }
# Percent-encoding for the `{resourceArn}` path label and the `tagKeys` query entries
# the tagging suites send, so a test encodes a URI the way an SDK does.
percent-encoding = "2.3"

[lints]
workspace = true
