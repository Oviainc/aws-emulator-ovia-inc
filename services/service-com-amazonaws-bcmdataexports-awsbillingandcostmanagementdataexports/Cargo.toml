[package]
name = "service-com-amazonaws-bcmdataexports-awsbillingandcostmanagementdataexports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# The delivery an export is owed is applied when the clock makes it due, by one short task
# on the ambient runtime as well as by the next request: `tokio`'s timer is what that task
# waits on, so this crate names the `time` feature it needs rather than relying on another
# crate of the workspace enabling it.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque, self-verifying pagination tokens: hex codec for the token body and SHA-256
# for its integrity tag, rather than hand-rolled encoders or digests. The same two
# crates lay out the other opaque ids this service mints: an `ExecutionId`, and the
# generated id segment of an `ExportArn` (`state::new_export_id`).
hex = { workspace = true }
sha2 = { workspace = true }
# A real SQL parser for `DataQuery.QueryStatement`, so the tables a submitted query
# names are read off the parsed statement rather than matched out of its text. The
# `visitor` feature is what provides `ast::visit_relations`, the walk that reports every
# relation a statement names (including the ones inside joins and sub-queries).
sqlparser = { version = "0.59", features = ["visitor"] }
# `iam_authorization`: the shared evaluation of IAM policy documents against
# (action, resource, principal), which this service's authorization check runs; `arn`:
# the one parse of an ARN's six fields, which both the tagging account check and the
# principal resolution read an ARN through; `validation`: the refusal renderer.
service-common = { path = "../common" }
# The IAM store holds the identity-based policies of the principal a request speaks
# for, and the STS store resolves which principal that is: this service reads both
# services' OWN state accessors rather than keeping a second copy of either fact.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The destination of an export is an S3 bucket, and the delivery grant a create checks is
# the POLICY that bucket carries: read through Amazon S3's own state accessor, so this
# service judges the document that service's `PutBucketPolicy` wrote. A delivery also
# WRITES the export's file through that same store.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The destination BUCKET and the billing view a `BILLING_VIEW_ARN` table property scopes a
# table to are resources of other services, which a submitted definition is resolved against
# over the in-process callback (`OperationContext::callback`): Amazon S3's `HeadBucket`
# answers whether it holds the bucket for the owner the request states, and AWS Billing's
# `GetBillingView` whether the account holds the view. Only the generated clients are needed
# — the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-billing = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The export file a delivery writes, in the encodings `S3OutputConfigurations` publishes:
# `csv` lays out the delimited text (so quoting is the maintained implementation's),
# `flate2` is the GZIP stream, `zip` the ZIP archive, and `parquet` the Apache
# implementation of the Parquet format, used through its row-group writer with the Snappy
# codec those objects carry.
csv = "1.3"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
parquet = { version = "60", default-features = false, features = ["snap"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The authorization suite makes the principals it calls as through IAM's and STS's own
# operations, so the policies it asserts on are the ones those services wrote.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The delivery-grant suite creates its destination buckets and puts their policies through
# Amazon S3's own operations.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The BILLING VIEW a table property scopes a table to is one AWS Billing holds, so the suite
# about resolving it mounts that service beside this one on the same engine and reads the
# account's views back through its own operations.
service-com-amazonaws-billing-awsbilling = { workspace = true }
# The delivery suite READS BACK the export file a delivery wrote, so it decodes the object
# with the same maintained implementations the delivery encoded it with.
csv = "1.3"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
parquet = { version = "60", default-features = false, features = ["snap"] }

[lints]
workspace = true
