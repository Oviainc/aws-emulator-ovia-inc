[package]
name = "service-com-amazonaws-invoicing-invoicing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `NextToken` this service's paginated operations hand out,
# and renders the `@idempotent` request digest in `crate::state`.
hex = { workspace = true }
# `crate::state::idempotent_request_digest`: the maintained digest an `@idempotent`
# replay key mixes the request it is a record OF through, rather than one written here.
sha2 = { workspace = true }
# The calendar `ListInvoiceSummaries`' documented temporal rules are stated in: a
# maintained proleptic Gregorian calendar, rather than month arithmetic written here.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
