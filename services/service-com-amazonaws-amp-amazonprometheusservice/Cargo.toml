[package]
name = "service-com-amazonaws-amp-amazonprometheusservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints a workspace id (`ws-<uuid>`) by hashing this store's id counter with a
# per-process seed, rendered as hex.
sha2 = { workspace = true }
hex = { workspace = true }
# Reads the rule group names out of a caller-supplied rules file (a YAML document), so
# the documented bound on the combined length of a namespace name and a rule group name
# is measured against the file's real contents, and reads the alert manager definition
# (`AlertManagerDefinitionData`) the same way. Same pinned version the apigateway,
# cloudformation and greengrassv2 crates read caller-supplied YAML with; yaml-rust2 is a
# pure-Rust YAML 1.2 implementation. The tests parse the default scraper configuration
# this service serves with it too, so the blob is asserted to be a YAML document with the
# structure a Prometheus scraper reads rather than compared byte for byte.
yaml-rust2 = { version = "0.10", default-features = false }
# Decodes a Prometheus remote-write request the workspace's data plane receives: the
# body is a snappy-compressed protobuf `WriteRequest`, so `snap` is the snappy block
# codec that frames it and `prost` decodes the protobuf messages. Both are pure-Rust
# libraries that compute over data in this process: neither opens a socket, reads a file
# nor evaluates anything. `prost`'s derive is a proc macro, so it generates the message
# code at build time; `snap` has no build step.
snap = "1"
prost = "0.13"
# Parses the PromQL expression an instant query carries, so the data plane evaluates
# the caller's own query from its syntax tree instead of reading its text. A PARSER, not
# an engine: it answers a syntax tree and evaluates nothing, so no caller-supplied text
# becomes instructions. It generates its grammar's parser at build time (its build script
# runs `lrlex`/`lrpar` on the PromQL grammar on the builder's machine), and at run time it
# compiles the regular expression of a label matcher through the `regex` crate, whose
# matching is linear in the input; the expression it is given is bounded before parsing
# (see `MAX_QUERY_BYTES` in `src/service/prometheus_plane.rs`).
promql-parser = "0.11"
# Reads the RFC 3339 form of an instant query's `time` parameter, which the Prometheus
# HTTP API accepts beside a Unix timestamp. Calendar arithmetic is what this crate is
# for, so neither form is parsed by hand.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Builds a remote-write body the way a sender does — the protobuf `WriteRequest` of the
# tests' own series, compressed with snappy's block format — so the data-plane suite
# exercises the wire format rather than an internal shortcut.
prost = "0.13"
snap = "1"

[lints]
workspace = true
