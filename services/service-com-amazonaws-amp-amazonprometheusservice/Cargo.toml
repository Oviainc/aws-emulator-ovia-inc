[package]
name = "service-com-amazonaws-amp-amazonprometheusservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints a workspace id (`ws-<uuid>`) by hashing this store's id counter with a
# per-process seed, rendered as hex.
sha2 = { workspace = true }
hex = { workspace = true }
# Reads the rule group names out of a caller-supplied rules file (a YAML document), so
# the documented bound on the combined length of a namespace name and a rule group name
# is measured against the file's real contents. Same pinned version the apigateway,
# cloudformation and greengrassv2 crates read caller-supplied YAML with; yaml-rust2 is a
# pure-Rust YAML 1.2 implementation. The tests parse the default scraper configuration
# this service serves with it too, so the blob is asserted to be a YAML document with the
# structure a Prometheus scraper reads rather than compared byte for byte.
yaml-rust2 = { version = "0.10", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
