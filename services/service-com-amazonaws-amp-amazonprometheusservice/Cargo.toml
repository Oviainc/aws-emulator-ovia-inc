[package]
name = "service-com-amazonaws-amp-amazonprometheusservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints a workspace id (`ws-<uuid>`) by hashing this store's id counter with a
# per-process seed, rendered as hex.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Parses the default scraper configuration this service serves, so the test asserts the
# blob really is a YAML document with the structure a Prometheus scraper reads, rather
# than comparing bytes or re-deriving a reader. Same pinned version the cloudformation
# and greengrassv2 crates use; yaml-rust2 is a pure-Rust YAML 1.2 implementation.
yaml-rust2 = { version = "0.10", default-features = false }

[lints]
workspace = true
