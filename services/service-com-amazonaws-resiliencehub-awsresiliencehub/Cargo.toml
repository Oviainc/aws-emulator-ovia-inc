[package]
name = "service-com-amazonaws-resiliencehub-awsresiliencehub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` ListApps hands out. Already recorded as an
# edge of this package in Cargo.lock (which does not distinguish a dev dependency),
# so declaring it here leaves the lock file untouched.
hex = { workspace = true }
# Mints the version-4 UUIDs this service's server-generated identifiers (appArn and
# policyArn ids, resolutionId) are, rather than hand-rolling the version/variant bits.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
