[package]
name = "service-com-amazonaws-migrationhubrefactorspaces-refactorspaces"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Derives the opaque body of a minted environment/application identifier.
sha2 = { workspace = true }
# Codec for the opaque `NextToken` a paginated list emits and accepts.
hex = { workspace = true }

[dev-dependencies]
# `time` is needed only by the test that waits past the provisioning span, so the feature
# is enabled here rather than widening the runtime surface the service itself links.
tokio = { workspace = true, features = ["time"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
