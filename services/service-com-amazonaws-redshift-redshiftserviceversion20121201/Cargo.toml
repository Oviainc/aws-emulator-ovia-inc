[package]
name = "service-com-amazonaws-redshift-redshiftserviceversion20121201"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Stable, content-addressed derivation of a cluster's endpoint host token and
# namespace id (never a per-run value), and of the per-response correlation id the
# awsQuery `<ErrorResponse>` envelope carries
# (`service::query_error_envelope::new_request_id`).
sha2 = { workspace = true }
hex = { workspace = true }
# The KMS client `CreateSnapshotCopyGrant` resolves the `KmsKeyId` it is given
# through, over the in-process callback into this same emulator (no network client
# feature is enabled: the transport is the emulator's own inbound listener).
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# The SNS client an event notification is published through, over the same
# in-process callback: a control-plane write raises the Redshift event its
# published catalog lists for it, and every subscription scoped to that event is
# published to on its topic.
aws-sdk-sns = { version = "1", default-features = false }
# The EC2 client a cluster subnet group's subnets are resolved through, over the
# same in-process callback: a subnet, the VPC that contains it and the
# Availability Zone it lies in are EC2's facts, so `state::ec2_subnets` asks EC2
# what the account has rather than deriving a network of its own.
aws-sdk-ec2 = { version = "1", default-features = false }
# The Region-label grammar the EC2 endpoint a hop addresses is read under, shared
# by every service that resolves a caller-supplied Region into an endpoint URL.
service-common = { path = "../common" }
# The `cron(...)` half of a snapshot schedule's definitions is read by this
# maintained parser rather than by a hand-written grammar, and `chrono` (which it
# is written in) is what the invocation times it yields are computed in
# (`state::snapshot_schedules`).
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The Redshift Serverless client the SERVERLESS arm of a namespace registration
# change is resolved through, over the same in-process callback: a serverless
# namespace and its workgroup are resources of that control plane, so whether
# the pair a `RegisterNamespace` / `DeregisterNamespace` names exists is a
# question only it can answer (`state::serverless`).
aws-sdk-redshiftserverless = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `tokio`'s timer, for the one test that waits out a clock-owed transition. The
# crate's regular dependency on tokio keeps the workspace feature set; features
# are additive and are not recorded in Cargo.lock, so this adds no locked
# package. The suite adds no dev-dependency from crates.io: a new locked package
# cannot be squash-merged against a mainline that rewrites Cargo.lock
# continuously, so the XML reader and the form encoder it needs are local to
# `tests/all/cluster_lifecycle.rs` and documented there. The one entry below is a
# workspace member this repository already locks.
tokio = { workspace = true, features = ["time"] }
# The snapshot-copy-grant KMS suite mounts the KMS service beside Redshift on one
# engine, because `CreateSnapshotCopyGrant` resolves the `KmsKeyId` it is given by
# calling it.
service-com-amazonaws-kms-trentservice = { workspace = true }
# The event-notification suite mounts the SNS service beside Redshift on one
# engine, because a raised Redshift event is published onto the subscription's
# Amazon SNS topic. Another workspace member this repository already locks.
service-com-amazonaws-sns-amazonsimplenotificationservice = { workspace = true }
# The subnet-group suites mount Amazon EC2 beside Redshift on one engine, because
# the subnets a cluster subnet group is made of are ITS resources: a suite mints
# them there and names them here. Another workspace member this repository
# already locks.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# The namespace-registration suite mounts the Redshift Serverless control plane
# beside Redshift on one engine, because the serverless namespace and workgroup a
# registration change names are ITS resources: the suite creates them there and
# registers them here. Another workspace member this repository already locks.
service-com-amazonaws-redshiftserverless-redshiftserverless = { workspace = true }

[lints]
workspace = true
