[package]
name = "service-com-amazonaws-emr-elasticmapreduce"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The AWS SDK for IAM, driven over the in-process callback
# (`OperationContext::callback`): `RunJobFlow` resolves `JobFlowRole` to an EC2
# instance profile with `GetInstanceProfile` before launching a cluster. Only the
# generated client is needed — the emulator supplies the transport, so the SDK's
# own HTTPS stack and runtime are left out.
aws-sdk-iam = { version = "1", default-features = false }
# The AWS SDK for EC2, driven over the same in-process callback: `CreateStudio` resolves
# the VpcId, SubnetIds and security groups a Studio is wired to against the service that
# owns them before allocating one. Only the generated client is needed.
aws-sdk-ec2 = { version = "1", default-features = false }
# The tree's one ARN parse, for reading a `JobFlowRole` given as an ARN.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
