[package]
name = "service-com-amazonaws-connect-amazonconnectservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination cursors: the last-returned key, hex-encoded.
hex = { workspace = true }
# SHA-256: the minted instance and queue identifiers are a digest of the store's
# mint counter, laid out in the v4-UUID form the model's id members carry.
sha2 = { workspace = true }
# The endpoint host a request reached this emulator on, for the websocket URL
# `StartChatContact` reports.
service-common = { path = "../common" }
# The chat session a started chat hands the Connect Participant Service: that service
# owns the transcript and the connection tokens a chat participant calls with, and its
# own API has no call that creates a chat.
service-com-amazonaws-connectparticipant-amazonconnectparticipantservicelambda = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` for `tokio::time::sleep`: the lifecycle test waits past the clock-owed
# CREATION_IN_PROGRESS -> ACTIVE instant without blocking the test's worker.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
