[package]
name = "service-com-amazonaws-ec2-amazonec2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination cursors: hex makes a `NextToken` this service did not mint
# detectable, which is what lets a paginating describe refuse a malformed one.
hex = { workspace = true }
# JPEG codec for the instance console screen `GetConsoleScreenshot` reports: the
# operation documents its image as a JPG, so the bytes have to be one.
jpeg-encoder = "0.6"
# The 8x8 monochrome console font that screen's text is drawn with.
font8x8 = "0.3"
# `GetConsoleScreenshotResult$ImageData` carries the image as base64 text.
base64 = "0.22"
# The shared XML rendering of a floating-point member, which AWS writes as a decimal
# carrying a fractional part where Rust's own rendering drops it.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The integration tests wait out a clock-owed transition with `tokio::time::sleep`,
# which needs the timer driver on top of the workspace's tokio features.
tokio = { workspace = true, features = ["time"] }
# Reads the ec2Query XML responses the integration tests assert on.
roxmltree = "0.20"
# Decoder used only by the tests, to prove the console screenshot really decodes
# as a JPEG of the screen geometry the handler reports.
zune-jpeg = "0.4"

[lints]
workspace = true
