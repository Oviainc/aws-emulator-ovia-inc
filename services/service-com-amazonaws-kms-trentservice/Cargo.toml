[package]
name = "service-com-amazonaws-kms-trentservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# AES-256-GCM (and the OS CSPRNG) for the ciphertext envelope a SYMMETRIC_DEFAULT
# KMS key seals and opens; `ring` is already in this workspace's lock file.
ring = "0.17"
# RSA, NIST ECDSA, secp256k1 and Ed25519 key pair generation, the RSA-OAEP
# unwrapping of imported key material, and the DER encodings (PKCS#8, X.509
# SubjectPublicKeyInfo) a data key pair and a wrapping key are reported in;
# already in this workspace's lock file.
aws-lc-rs = "1"
# The SM2 curve of an SM2 data key pair, which aws-lc-rs does not expose.
sm2 = { version = "0.14", default-features = false, features = [
    "arithmetic",
    "pkcs8",
    "std",
] }
# KeyMaterialId (64 lowercase hex characters) and the opaque ListKeys marker.
sha2 = { workspace = true }
hex = { workspace = true }
# Version-4 UUIDs: the form a KMS key id takes.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
