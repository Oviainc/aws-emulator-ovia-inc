[package]
name = "service-com-amazonaws-ivsrealtime-amazoninteractivevideoservicerealtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `state`: the tree's one base64url coder and JOSE reading, which the compact form of an
# issued participant token is encoded with — a path dependency on this repository's own
# shared service crate, not a third-party component.
service-common = { path = "../common" }
# `state`: the HMAC of RFC 7518 section 3.2, which authenticates an issued participant
# token. An in-process COMPUTATION over data: it opens no listener, spawns nothing and
# reads nothing off the host. It is the cryptography library this workspace already signs
# and checks its tokens with (`service-common`'s JOSE reading and the user-pool service),
# so it is already in this workspace's build and lockfile and no capability class arrives
# with this declaration — and no second implementation of the primitive is written.
ring = "0.17"
# PEM decoding of the `publicKeyMaterial` an `ImportPublicKey` call carries.
pem = "3"
# SubjectPublicKeyInfo parsing, so an import is refused unless the material really is a
# DER-encoded public key.
spki = "0.7"
# MD5 digest: a public key's fingerprint is the MD5 of its public key's DER.
md-5 = "0.10"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Real key pairs for the public-key tests, so what they import is a genuine public key
# rather than a hand-built byte string.
rcgen = "0.13"

[lints]
workspace = true
