[package]
name = "service-com-amazonaws-cloudwatchlogs-logs-20140328"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` beyond the workspace default: the subscription fan-out suite awaits the
# clock-owed CREATING -> ACTIVE span of the Kinesis stream it delivers to with
# `tokio::time::sleep`.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination tokens: the cursor payload is hex-encoded so a client only
# round-trips it.
hex = { workspace = true }
# Reads a lookup table's CSV body (`CreateLookupTable$tableBody`) to its header row and
# data rows, as CSV defines quoting and embedded separators.
csv = "1.3"
# Compiles the regular expression a Logs Insights `parse` command carries, so a query
# string that does not compile is refused rather than accepted.
regex = "1.12"
# An ingested Embedded Metric Format log event publishes its metrics into the CloudWatch
# emulator's own metric store, which is reached through the shared engine and needs the
# owning service's state TYPE.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The GZIP framing a subscription filter's destination is handed the delivered log events
# in ("they are Base64 encoded and compressed with the GZIP format").
flate2 = "1"
# `arn`: the one reading of a caller-supplied resource ARN, used to resolve which service
# and Region a subscription filter's `destinationArn` names.
service-common = { path = "../common" }
# The AWS SDKs for the services `PutSubscriptionFilter` documents as subscription
# destinations, each driven over the in-process callback
# (`OperationContext::callback`): an ingested log event a filter matches is delivered to
# the Kinesis data stream, Firehose delivery stream or Lambda function its
# `destinationArn` names. Only the generated clients are needed — the emulator supplies
# the transport.
aws-sdk-kinesis = { version = "1", default-features = false }
# Pinned: from 1.127.0 this client requires `aws-smithy-http` 0.64.3, which the
# workspace's signing stack does not resolve to; 1.126.0 is the newest release that builds
# against the `aws-smithy-http` this lock already holds.
aws-sdk-firehose = { version = "=1.126.0", default-features = false }
aws-sdk-lambda = { version = "1", default-features = false }
# `CreateExportTask` resolves the S3 bucket its `destination` names against the object
# store, over the same in-process callback, with the `HeadBucket` this client generates.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# Decodes one `application/vnd.amazon.eventstream` frame, so the live-tail suite reads
# `StartLiveTail`'s response the way an SDK's event-stream decoder does.
aws-smithy-eventstream = "0.60"
# The CloudWatch metric store an ingested log event publishes into, so a test can read
# back the datapoints this service's metric filters extracted. Already a dependency of
# `src/`; an integration test reaches it only through this list.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# A subscription filter's Kinesis destination is a REAL stream of the Kinesis emulator, so
# the fan-out suite mounts that service beside this one on the same engine and reads the
# delivered records back off the stream.
service-com-amazonaws-kinesis-kinesis-20131202 = { workspace = true }

[lints]
workspace = true
