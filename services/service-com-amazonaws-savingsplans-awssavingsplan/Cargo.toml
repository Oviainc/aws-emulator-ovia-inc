[package]
name = "service-com-amazonaws-savingsplans-awssavingsplan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The value a constraint-violation message echoes is the one the caller submitted,
# including a list-valued member the framework's walk can only summarise as a count.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque pagination tokens the describe paginators mint, and
# SHA-256 to mint this service's ids from a per-store seed. Both are already
# workspace-pinned, so this service adds no entry to Cargo.lock — which is what
# lets the fix land in a tree where every other branch is editing that file.
hex = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
