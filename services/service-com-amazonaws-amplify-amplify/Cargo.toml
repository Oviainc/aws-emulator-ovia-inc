[package]
name = "service-com-amazonaws-amplify-amplify"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries the ONE evaluation of IAM policy documents (`iam_authorization`),
# which `StartDeployment` decides a deployment source bucket's grant to Amplify with.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true, features = ["byte-stream-poll-next"] }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
# Serializes the custom-header rules this service parsed out of an app's `customHeaders`
# document into the JSON a reader is answered with, in the order each rule states its
# members (`src/state/custom_headers.rs`).
serde = { workspace = true }
# `sha2` digests a configured basic-authorization credential: the digest is the only thing
# this service keeps of one, and what it reports for the `@sensitive` member is derived
# from it (`src/state/basic_auth.rs`).
sha2 = { workspace = true }
# Reads an app's `customHeaders` document, which callers write in YAML (of which JSON is a
# subset); `yaml-rust2` is the pure-Rust YAML reader the cloudformation, configservice and
# greengrassv2 crates already read caller-supplied YAML with.
yaml-rust2 = { version = "0.10", default-features = false }
tracing = { workspace = true }
# Amazon S3 client a manual deployment's source is read through: `StartDeployment` reads
# the source bucket's policy and its objects over the in-process callback into this same
# emulator (no network client feature is enabled: the transport is the emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Reads the entry list of a `.zip` deployment source, so the files a ZIP deployment
# publishes come from the archive itself rather than from a guess.
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# Percent-encodes an ARN into the single `@httpLabel` path segment the tagging
# operations bind it to, the way an AWS SDK client does (tests/all/resource_tags.rs).
percent-encoding = "2"
# The S3-sourced deployment suite mounts the S3 service beside Amplify on one engine,
# because StartDeployment reads its source by calling S3 in process.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
