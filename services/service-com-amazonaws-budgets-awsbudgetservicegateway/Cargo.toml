[package]
name = "service-com-amazonaws-budgets-awsbudgetservicegateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `NextToken` the paginated Describe* operations mint.
hex = { workspace = true }
# Mints the UUID `ActionId` CreateBudgetAction gives a new budget action — "a
# system-generated universally unique identifier (UUID) for the action" (`Action$ActionId`).
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
