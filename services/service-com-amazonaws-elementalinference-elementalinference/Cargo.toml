[package]
name = "service-com-amazonaws-elementalinference-elementalinference"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries this tree's ONE statement of the AWS Region grammar
# (`arn::region_label`), which `state::request_region` reads the caller's credential
# scope through before that value names a Region of the store or is spliced into an ARN.
service-common = { path = "../common" }
# Opaque `nextToken` codec for the paginated operations (ListFeeds, ListDictionaries,
# SearchFixtures).
hex = { workspace = true }
# SHA-256 for the digest of the request criteria a `nextToken` binds.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
