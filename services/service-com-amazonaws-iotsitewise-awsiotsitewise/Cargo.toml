[package]
name = "service-com-amazonaws-iotsitewise-awsiotsitewise"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Id minting (SHA-256 seed -> UUIDv4) and the opaque hex pagination tokens, the
# same recipe the other services in this workspace use.
sha2 = { workspace = true }
hex = { workspace = true }
# The SQL parser for `ExecuteQuery`: the IoT SiteWise query language is SQL, so its
# statements are parsed by a real parser rather than matched on as text.
sqlparser = "0.59"
# `iso8601_span`: the ISO 8601 duration a tumbling window's interval and offset
# may be spelled as, read through the workspace's one maintained reading of that
# grammar rather than a second one here.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
