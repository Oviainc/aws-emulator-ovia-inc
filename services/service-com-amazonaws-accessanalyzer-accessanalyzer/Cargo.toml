[package]
name = "service-com-amazonaws-accessanalyzer-accessanalyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes a listing's continuation key as the opaque `nextToken` the pagination
# handlers hand out (and decodes it on resume).
hex = { workspace = true }
# Mints an `accessPreviewId`: the 128 unguessable bits a version-4 UUID carries are
# taken from a digest over the process's entropy, a counter and the clock.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Percent-encodes an ARN into the `{resourceArn}` httpLabel of the tagging operations,
# the way an SDK encodes a label value. Pinned here rather than referenced from the
# root `[workspace.dependencies]`, which this project does not allow editing.
percent-encoding = "2.3"

[lints]
workspace = true
