[package]
name = "service-com-amazonaws-fms-awsfms-20180101"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hashes the counter+clock seed the minted PolicyId / PolicyUpdateToken come from.
sha2 = { workspace = true }
# Hex-encodes those identifiers and the opaque ListPolicies pagination token.
hex = { workspace = true }
# The stores of the services that OWN the organisation's resources:
# `ListDiscoveredResources` DISCOVERS the inventory it reports from them through
# the shared engine (`state::discovered_resources`) rather than keeping a second
# copy of a resource here, so a VPC, firewall, load balancer, distribution or
# stage created over those services' own APIs is discoverable and associable with
# no propagation step. One crate per resource type the catalogue
# (`state::DISCOVERABLE_RESOURCE_TYPES`) covers.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
service-com-amazonaws-elasticloadbalancing-elasticloadbalancing-v7 = { workspace = true }
service-com-amazonaws-elasticloadbalancingv2-elasticloadbalancing-v10 = { workspace = true }
service-com-amazonaws-cloudfront-cloudfront2020-05-31 = { workspace = true }
service-com-amazonaws-apigateway-backplanecontrolservice = { workspace = true }
service-com-amazonaws-networkfirewall-networkfirewall-20201112 = { workspace = true }

[dev-dependencies]
# Percent-encodes the form values the ec2Query / awsQuery test calls carry,
# instead of hand-writing that encoder in the test suite.
percent-encoding = "2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
