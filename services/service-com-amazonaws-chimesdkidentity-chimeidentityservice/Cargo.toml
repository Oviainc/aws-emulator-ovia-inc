[package]
name = "service-com-amazonaws-chimesdkidentity-chimeidentityservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `chime_family`: the request-claim rule for the six services that share the `chime`
# SigV4 signing name, stated once rather than inlined in this service's `can_handle`.
# `chime_app_instance_admins`: the app-instance ADMIN directory this service WRITES when
# it promotes an identity, which Chime SDK Messaging reads the role from.
# `chime_identity_names`: the identity NAME directory this service WRITES whenever it
# registers, renames or deletes an identity, which Chime SDK Messaging reads the `Name` of
# a channel participant from.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the random bytes behind the uuid in a generated AppInstanceArn, and hex-codes
# both that uuid and the opaque NextToken a list operation pages with. Both crates are
# already in this workspace's dependency set, so the service adds no new locked crate.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
