[package]
name = "service-com-amazonaws-s3vectors-s3vectors"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
# `time` beyond the workspace default: a tag write holds its optimistic lock for the
# span it takes to commit, and its own caller is answered only once it has.
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The shared IAM policy grammar and the shared evaluation of a policy document against
# (action, resource, principal), which decides a vector bucket policy here.
service-common = { path = "../common" }
# A vector bucket policy names the principals it governs, and the STS store resolves
# which principal a request's access key id speaks for.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# A vector bucket or index encrypted with a customer managed KMS key is created through
# that key, so the KMS store answers whether the key may be used at all.
service-com-amazonaws-kms-trentservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The IAM store the identity-based authorization suite seeds: the user, its access key
# and its inline policies are the records `iam:CreateUser`, `iam:CreateAccessKey`,
# `iam:PutUserPolicy` and `iam:PutRolePolicy` write.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[lints]
workspace = true
