[package]
name = "service-com-amazonaws-ssmsap-ssmsap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes a listing's continuation key as the opaque `NextToken` `ListApplications`
# hands out (and decodes it on resume).
hex = { workspace = true }
# Mints the v4 UUID the model's `OperationId` pattern describes.
uuid = { version = "1", features = ["v4"] }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): `StopApplication$IncludeEc2InstanceShutdown` shuts down
# the Amazon EC2 instances of the application, which are EC2's resources, so
# `src/state/ec2_shutdown.rs` asks EC2 to stop them rather than inventing an instance
# state here. Only the generated client is needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# The EC2 service, mounted beside this one in tests/all/ec2_instance_shutdown.rs: the
# instance shutdown can only be driven end to end with the owner of the instances on the
# same engine. DEV-ONLY: this crate depends on no other service's crate outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
