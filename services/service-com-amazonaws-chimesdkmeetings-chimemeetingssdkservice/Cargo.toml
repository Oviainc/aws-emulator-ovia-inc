[package]
name = "service-com-amazonaws-chimesdkmeetings-chimemeetingssdkservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `chime_family`: the request-claim rule for the six services that share the `chime`
# SigV4 signing name, stated once rather than inlined in this service's `can_handle`.
service-common = { path = "../common" }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digests the id counter into the modelled GuidString MeetingId/AttendeeId and the
# opaque Attendee JoinToken.
sha2 = { workspace = true }
# Hex codec for the minted ids, the join token and the opaque ListAttendees NextToken.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
