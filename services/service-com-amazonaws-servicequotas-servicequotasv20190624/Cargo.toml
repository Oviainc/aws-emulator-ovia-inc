[package]
name = "service-com-amazonaws-servicequotas-servicequotasv20190624"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `service-common` carries the workspace's ONE rendering of AWS's
# `N validation error(s) detected: ` envelope (`validation_message::envelope_over`),
# which this service's request-validation front end puts its OWN clauses in
# (`src/service.rs`): the count word and the separator must not differ between two
# services.
service-common = { path = "../common" }
# Pagination tokens: base64 of the position a token names, over the standard
# alphabet the modelled `NextToken` pattern allows.
base64 = "0.22"
# Request ids are derived (counter + clock) rather than echoed or random-unstored.
sha2 = { workspace = true }
hex = { workspace = true }
# The AWS SDK for EC2, driven over the in-process callback
# (`OperationContext::callback`): a quota utilization report's numerator is the account's
# own consumption, and a VPC and the vCPUs of a running instance are EC2's resources, so
# `src/state/usage.rs` counts them by asking EC2 rather than keeping a count of its own.
# Only the generated client is needed — the emulator supplies the transport.
aws-sdk-ec2 = { version = "1", default-features = false }
# The AWS SDK for Organizations, driven over the same in-process callback: whether the
# calling account is in an AWS Organization — and whether that organization has all
# features enabled — is Organizations' own fact, and the whole quota request TEMPLATE
# plane stands behind it (`src/state/organization.rs`), so it is read from the service
# that owns it rather than copied into this one.
# Only the generated client is needed — the emulator supplies the transport.
aws-sdk-organizations = { version = "1", default-features = false }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `tokio::time::sleep` in tests/all/quota_workflow.rs, to wait past the span a
# quota increase request takes to be decided.
tokio = { workspace = true, features = ["time"] }
# The EC2 service, mounted beside this one in tests/all/quota_utilization_usage.rs: a
# utilization report's usage comes from the services that own the resources, so the rule
# can only be driven end to end with the owner of those resources on the same engine.
# DEV-ONLY: this crate takes no dependency on EC2 outside its tests.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }
# AWS Organizations, mounted beside this one in tests/all/quota_request_template.rs: the
# template plane stands behind the calling account's organization membership, which that
# service owns, so the rule can only be driven end to end with it on the same engine.
# DEV-ONLY: this crate takes no dependency on the Organizations EMULATOR outside its
# tests — the handler reads Organizations over the SDK client above.
service-com-amazonaws-organizations-awsorganizationsv20161128 = { workspace = true }
[lints]
workspace = true
