[package]
name = "service-com-amazonaws-ssm-amazonssm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `PutParameter`'s AllowedPattern is a regular expression the value must satisfy.
# The floor matches the version the vendored framework pins, so the tree resolves one.
regex = "1.12"
# `arn::parse_of`: the one parse a service reads a caller-supplied resource ARN with,
# which `DescribeDocument`'s `DocumentARN` name may be.
service-common = { path = "../common" }
# `CreateDocument`'s content is "in JSON or YAML format", and the document's schema
# version, description and parameters are read out of it. yaml-rust2 is a pure-Rust
# YAML 1.2 implementation, and YAML 1.2 is a superset of JSON, so one parser reads
# either spelling of the same document.
yaml-rust2 = { version = "0.10", default-features = false }
# `DocumentDescription$Hash` is "the Sha256 … hash created by the system when the
# document was created", rendered hex.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
