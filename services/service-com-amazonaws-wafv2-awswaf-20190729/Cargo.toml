[package]
name = "service-com-amazonaws-wafv2-awswaf-20190729"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256 over OS-seeded randomness, the clock and a counter, hex-rendered: the
# UUIDv4-shaped `EntityId` and `LockToken` values WAFv2 mints (`state::new_uuid`).
sha2 = { workspace = true }
hex = { workspace = true }
# The regular expressions a `Regex$RegexString` carries, matched with the maintained
# crate rather than a hand-written matcher: its automaton does not backtrack, so a
# caller-stored pattern cannot blow up the time one request's evaluation takes.
regex = "1.13"
# CIDR containment for an `IPSet`'s `Addresses`, the same version the sibling
# elasticloadbalancingv2/ses services declare it at: one parse of a CIDR range and one
# definition of which addresses it holds.
ipnet = "2"
# Percent-decoding a query argument's value and the `URL_DECODE` text transformation —
# the encoding itself is the crate's, as the sibling s3/apigateway suites do it, rather
# than another hand-written copy of RFC 3986.
percent-encoding = "2"
# The `BASE64_DECODE` text transformation, through the maintained coder every other
# service in this tree decodes base64 with (ec2, lambda, secretsmanager).
base64 = "0.22"
# The authenticated encryption an `APIKey` value is: the key WAFv2 answers is an
# encrypted token over the key's own definition, sealed with the maintained AEAD
# implementation rather than a hand-rolled one (`state::api_keys`). Only the cipher
# and the allocating interface, so the crate pulls in no random-number backend of its
# own — the key and the nonce come from this crate's own entropy source.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# The `HTML_ENTITY_DECODE` text transformation: the maintained decoder for HTML character
# references, so a named, decimal or hexadecimal reference is decoded the way a browser
# decodes it rather than by a hand-written table.
html-escape = "0.2"
# Exact decimal arithmetic over a `MonetizationAmountValue`, which the model carries
# as a string: a revenue total is a sum of money, so it is added as the decimal each
# amount spells rather than through a binary float (`state::monetization_amount`).
# The same crate the sibling dynamodb service reads a numeric attribute with.
bigdecimal = "0.4"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
