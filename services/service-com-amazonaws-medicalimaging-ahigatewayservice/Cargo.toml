[package]
name = "service-com-amazonaws-medicalimaging-ahigatewayservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes/decodes the opaque `nextToken` ListDatastores hands out.
hex = { workspace = true }
# Digests the canonical text of a search's filters into its page-token marker, so the
# marker's length does not grow with the filters the request carries.
sha2 = { workspace = true }
# `iam_role`: the one resolution of a caller-supplied IAM role ARN against the account's
# IAM records, which `StartDICOMImportJob` puts its `dataAccessRoleArn` through before a
# job is minted.
service-common = { path = "../common" }
# The AWS SDK for Amazon S3, driven over the in-process callback
# (`OperationContext::callback`): a DICOM import reads the objects of the `inputS3Uri`
# prefix it was asked to import. Only the generated client is needed — the emulator
# supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Reads the DICOM Part 10 files an import is handed with a maintained DICOM library, so
# the dataset an image set is built from is parsed rather than guessed at.
dicom-object = "0.10"
# The DICOM tag constants `dicom-object` reads an element by — the standard data
# dictionary, so an attribute is named by its keyword rather than by a literal group and
# element written here.
dicom-dictionary-std = "0.10"
# The `Tag` type those constants are, and the value conversions a read element's text and
# numbers come out of.
dicom-core = "0.10"
# The gzip format `GetImageSetMetadata` reports its metadata blob in
# (`contentEncoding: gzip`), applied with a maintained codec rather than written here.
flate2 = "1"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `sha2` is a regular dependency above (the search page-token marker's filter digest),
# which the test targets can use too, so it is not repeated here.

[lints]
workspace = true
