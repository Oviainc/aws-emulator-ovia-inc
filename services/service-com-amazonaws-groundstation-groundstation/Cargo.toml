[package]
name = "service-com-amazonaws-groundstation-groundstation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digests the per-process seed, the mint counter and the clock into the 16 bytes of a
# `Uuid`-shaped id (see `state::new_uuid`); `hex` renders them.
sha2 = { workspace = true }
hex = { workspace = true }
# Calendar arithmetic for `GetMinuteUsage`: the first instant of a requested month, and of
# the next one, in the proleptic Gregorian calendar (month lengths and the leap rule).
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
