[package]
name = "service-com-amazonaws-kafkaconnect-kafkaconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The ONE caller-supplied-ARN parse this emulator reads a `bucketArn` /
# `serviceExecutionRoleArn` with, instead of a second copy per service.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mints the UUID every ARN this service assigns carries, by hashing the store's
# own mint counter. Hashed with `sha2` rather than drawn from `uuid`'s v4
# generator so the suffix is DETERMINISTIC for a given sequence of calls (a test
# or a replay sees the same ARNs twice) while still being unique per resource.
sha2 = { workspace = true }
# Encodes the opaque `nextToken` both list operations page with.
hex = { workspace = true }
# The Amazon S3 client `CreateCustomPlugin` resolves the custom plugin file at
# `location.s3Location` with, over the in-process callback into this same
# emulator (no network client feature is enabled: the transport is the
# emulator's own).
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Percent-encodes an `@httpLabel` ARN into one URI path segment in the tests,
# with the same encoder the server side uses.
percent-encoding = "2"
# The tests wait out the clock-owed transitions, so they need tokio's timer on
# top of the workspace's macros/runtime features.
tokio = { workspace = true, features = ["time"] }
# The custom-plugin-file suite mounts the S3 service beside kafkaconnect on one
# engine, because `CreateCustomPlugin` resolves the plugin file it is given
# against Amazon S3 before it stores anything.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
