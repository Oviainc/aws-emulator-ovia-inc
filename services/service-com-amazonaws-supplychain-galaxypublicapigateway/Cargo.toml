[package]
name = "service-com-amazonaws-supplychain-galaxypublicapigateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Encodes the opaque `nextToken` ListInstances pages with.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# `tokio::time::sleep` lets the tests wait out the clock-owed instance transition; no
# handler sleeps, so the feature stays out of the production build.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
