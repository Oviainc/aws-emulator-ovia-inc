[package]
name = "service-com-amazonaws-computeoptimizerautomation-computeoptimizerautomationservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The principal an authorization refusal names is the identity STS reports for
# the credential the request signed with, so it is resolved from the STS store
# (see `state::caller_identity_arn`) rather than invented here: one credential
# must have one principal across this service and `sts:GetCallerIdentity`.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Minting a `ruleId` (16 chars of `[0-9A-Za-z]`) and fingerprinting a request for
# the client-token ledger are both digests; `hex` renders them.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
