[package]
name = "service-com-amazonaws-ebs-ebs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA256 is the only checksum algorithm the EBS direct APIs model, and every block's
# `Checksum` is computed over the bytes this service persisted.
sha2 = { workspace = true }
# Snapshot ids are lowercase hex (`^snap-[0-9a-f]+$`), and so is every opaque token this
# service mints for a caller to hand back in a URI query.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
