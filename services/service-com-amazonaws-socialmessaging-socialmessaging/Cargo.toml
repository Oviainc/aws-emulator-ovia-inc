[package]
name = "service-com-amazonaws-socialmessaging-socialmessaging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# How a constraint-violation clause states the value the caller submitted — including a
# list or a structure, which the framework's own violation can only summarise as a count.
service-common = { path = "../common" }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Digest behind the minted waba-/phone-number-id-/message ids, so each one is
# unique per call without hand-rolling a hash.
sha2 = { workspace = true }
# Renders that digest as the lowercase hex the model's id patterns expect.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Percent-encodes a query-bound member's value in the test harness, so an ARN-form id
# survives the round trip without a hand-rolled encoder.
percent-encoding = "2.3"

[lints]
workspace = true
