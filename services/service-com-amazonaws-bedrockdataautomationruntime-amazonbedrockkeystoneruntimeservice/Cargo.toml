[package]
name = "service-com-amazonaws-bedrockdataautomationruntime-amazonbedrockkeystoneruntimeservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The shared request-claim rule for a SigV4 signing name several services share.
service-common = { path = "../common" }
# The data-automation build-time service: it owns the projects and blueprints a
# submission references, so this service resolves those references against its store.
service-com-amazonaws-bedrockdataautomation-amazonbedrockkeystonebuildtimeservice = { workspace = true }
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The Amazon S3 client this service resolves a submission's input asset with, over the
# in-process callback into this same emulator (no network client feature is enabled: the
# transport is the emulator's own): a job's work begins by reading that asset, so whether
# the object store holds it is what the job's terminal outcome is settled on.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Percent-encoding for the ARN the build-time service binds in an `@httpLabel` path
# segment, which the reference-resolution suite creates and releases its fixtures
# through: the encoding is the crate's, as the sibling apigateway/medialive suites do it,
# rather than another hand-written copy of RFC 3986.
percent-encoding = "2"
# The integration tests poll a job across a clock-owed transition with
# `tokio::time::sleep`; the feature is enabled here so the library target does not carry
# it.
tokio = { workspace = true, features = ["time"] }
# The job-outcome suite mounts the Amazon S3 service beside this one on a single engine —
# the way the assembled emulator runs them — and stages the asset a submission points at
# in its store, because a job that cannot read its asset is the failure path under test.
service-com-amazonaws-s3-amazons3 = { workspace = true }

[lints]
workspace = true
