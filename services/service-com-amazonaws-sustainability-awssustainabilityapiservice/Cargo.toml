[package]
name = "service-com-amazonaws-sustainability-awssustainabilityapiservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The seeded dataset's values and the request fingerprint carried in a page token are
# SHA-256 digests, so they are stable across processes without any per-call randomness.
sha2 = { workspace = true }
# Opaque pagination cursors: hex keeps the cursor opaque and makes a token this service
# did not mint detectable, which is what lets a paginating operation refuse it.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
