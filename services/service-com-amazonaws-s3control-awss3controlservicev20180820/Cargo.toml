[package]
name = "service-com-amazonaws-s3control-awss3controlservicev20180820"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries the workspace's ONE caller-supplied-ARN parse, which the
# generic resource tagging operations read a `ResourceArn` through.
service-common = { path = "../common" }
# A BUCKET's tag set is the one Amazon S3's own `GetBucketTagging` /
# `PutBucketTagging` read and write, so the generic tagging operations reach it in
# THAT service's bucket store (`state::change_bucket_tags`) instead of holding a
# second copy here.
service-com-amazonaws-s3-amazons3 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Access point aliases are derived from the access point's identity with a
# SHA-256 digest, rendered as hex; `hex` also encodes the ListAccessPoints page
# token.
sha2 = { workspace = true }
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
