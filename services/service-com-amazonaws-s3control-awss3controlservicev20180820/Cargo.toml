[package]
name = "service-com-amazonaws-s3control-awss3controlservicev20180820"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# `service-common` carries the workspace's ONE caller-supplied-ARN parse, which the
# generic resource tagging operations read a `ResourceArn` through.
service-common = { path = "../common" }
# A BUCKET's tag set is the one Amazon S3's own `GetBucketTagging` /
# `PutBucketTagging` read and write, so the generic tagging operations reach it in
# THAT service's bucket store (`state::change_bucket_tags`) instead of holding a
# second copy here.
service-com-amazonaws-s3-amazons3 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true, features = ["time"] }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Access point aliases are derived from the access point's identity with a
# SHA-256 digest, rendered as hex; `hex` also encodes the ListAccessPoints page
# token.
sha2 = { workspace = true }
hex = { workspace = true }
# `aws-sdk-s3`: an S3 Batch Operations job's tasks ARE Amazon S3 requests — the
# manifest it runs over is read with `GetObject`, a generated manifest is
# selected with `ListObjectsV2`, and the job's copies, taggings, generated
# manifest and completion report are written with `CopyObject`,
# `PutObjectTagging`, `DeleteObjectTagging` and `PutObject` — each driven over
# the in-process callback (`OperationContext::callback`). Only the generated
# client is needed; the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# Reads and writes the CSV a batch job's manifest and its completion report are
# written in, as CSV defines quoting, embedded separators and embedded
# newlines — a manifest is caller-supplied input.
csv = "1.3"
# RFC 3986 percent-encoding for the `x-amz-copy-source` of a copy task, whose
# value "must be URL-encoded".
percent-encoding = "2"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
