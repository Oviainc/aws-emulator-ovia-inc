[package]
name = "service-com-amazonaws-mediaconvert-mediaconvert"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Opaque pagination tokens: hex-encode the cursor so it is not readable client state.
hex = { workspace = true }
# SHA-256: derives the account-specific label in the API endpoint URL
# `DescribeEndpoints` reports, from the account id and the region alone.
sha2 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# `time` for the one integration case that waits past a job's settle instant.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
