[package]
name = "service-com-amazonaws-mediaconvert-mediaconvert"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# Opaque pagination tokens: hex-encode the cursor so it is not readable client state.
hex = { workspace = true }
# SHA-256: derives the account-specific label in the API endpoint URL
# `DescribeEndpoints` reports, from the account id and the region alone.
sha2 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `eventbridge_client`: the ONE in-process EventBridge client an emulated service
# publishes an event through, so this crate configures no second copy of that hop.
service-common = { path = "../common" }
# The AWS SDK for EventBridge, driven over the in-process callback
# (`OperationContext::callback`): MediaConvert publishes a `MediaConvert Job State
# Change` event onto the account's default event bus as a job moves through its
# statuses (`state::job_events`). Only the generated client is needed — the emulator
# supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-eventbridge = { version = "1", default-features = false }
# The AWS SDK for S3, driven over the in-process callback
# (`OperationContext::callback`): `CreateJob` probes each of a job's
# `Settings.Inputs[].FileInput` S3 locations with `HeadObject` before the job is
# accepted, so a job that fails because an input cannot be opened is classified
# from what S3 actually answered. Only the generated client is needed — the
# emulator supplies the transport, so the SDK's own HTTPS stack is left out.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    # `BehaviorVersion::latest()` in `state.rs` is gated behind this feature, and the
    # Tokio runtime is what the callback transport is driven on — spelled out here, as
    # the sibling crates that build the same in-process client do, so a
    # `cargo build -p` of this crate alone resolves them too.
    "behavior-version-latest",
    "rt-tokio",
] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
# `time` for the one integration case that waits past a job's settle instant.
tokio = { workspace = true, features = ["time"] }
# EventBridge and SQS are mounted beside MediaConvert on one engine in the integration
# tests, because MediaConvert publishes a `MediaConvert Job State Change` event onto the
# default event bus as a job moves and a rule on that bus delivers it to an SQS queue:
# without them mounted there is nothing for the publication to reach.
service-com-amazonaws-eventbridge-awsevents = { workspace = true }
service-com-amazonaws-sqs-amazonsqs = { workspace = true }

[lints]
workspace = true
