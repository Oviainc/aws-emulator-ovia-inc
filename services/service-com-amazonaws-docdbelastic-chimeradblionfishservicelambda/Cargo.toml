[package]
name = "service-com-amazonaws-docdbelastic-chimeradblionfishservicelambda"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination cursors, and the hex rendering of a minted resource id.
hex = { workspace = true }
# Digests the counter + clock seed a minted cluster / snapshot id is built from.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `tokio::time::sleep` in the lifecycle suite waits out a clock-owed transition.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
