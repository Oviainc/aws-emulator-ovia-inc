[package]
name = "service-com-amazonaws-launchwizard-launchwizard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination tokens: the cursor is hex-encoded so a client cannot read a
# position out of a `nextToken` or forge one.
hex = { workspace = true }
# The digest `state::fresh_uuid_v4` lays out as a deployment id, so minting one
# pulls in no crate this workspace does not already build.
sha2 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# Tests forge a pagination token with the same encoding `state::encode_token` issues
# one with, rather than hand-rolling hex beside it.
hex = { workspace = true }

[lints]
workspace = true
