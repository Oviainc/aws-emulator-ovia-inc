[package]
name = "service-com-amazonaws-cloudsearch-a9searchcloudconfigservice2013"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# The lifecycle tests wait past `state::PROVISIONING_DELAY` for a transition the clock
# owes, which needs tokio's timer (the workspace feature set carries only the runtime).
# No other dev-dependency: the tests read the awsQuery XML through the emulator's own
# codec (`aws_smithy_schema_server::xml`), so this change locks no new crate.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
