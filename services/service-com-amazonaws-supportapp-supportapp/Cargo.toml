[package]
name = "service-com-amazonaws-supportapp-supportapp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Whether this account belongs to an organization, and which account manages that
# organization, is state the Organizations control plane owns:
# `RegisterSlackWorkspaceForOrganization` is an Organizations-scoped call, so it reads
# that store through the one shared engine instead of assuming an answer.
service-com-amazonaws-organizations-awsorganizationsv20161128 = { workspace = true }
# `iam_authorization`: the shared evaluation of IAM policy documents against an action on a
# resource, so this service's authorization gate (`src/state/authorization.rs`) reads a
# document exactly as every other service does. `iam_role`: which IAM entity a principal ARN
# names.
service-common = { path = "../common" }
# The STS store, for the identity an access key id speaks for: the principal
# `sts:GetCallerIdentity` answers for the credentials a request signed with.
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# The IAM store, for the identity-based policy documents in force on that principal.
service-com-amazonaws-iam-awsidentitymanagementv20100508 = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
# Builds the opaque-looking pagination tokens the listing tests send back: neither
# listing returns one, so every form of them has to be refused.
hex = { workspace = true }

[lints]
workspace = true
