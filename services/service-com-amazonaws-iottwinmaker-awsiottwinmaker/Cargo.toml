[package]
name = "service-com-amazonaws-iottwinmaker-awsiottwinmaker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Opaque pagination tokens: `nextToken` carries a hex-encoded resume key.
hex = { workspace = true }
# `CreateEntity` mints a uuid `entityId` when the request names none.
uuid = { version = "1", features = ["v4"] }
# `ExecuteQuery` compiles a query's SQL `LIKE` pattern into a matcher.
regex = "1.12"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
