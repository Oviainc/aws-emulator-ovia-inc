[package]
name = "service-com-amazonaws-translate-awsshinefrontendservice-20170701"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Derives a terminology's ARN revision and its presigned data location from the
# imported file's bytes (src/state.rs).
sha2 = { workspace = true }
# Hex-codes those digests (src/state.rs).
hex = { workspace = true }
# Parses the CSV and TSV custom-terminology input files ImportTerminology
# accepts (src/ops/import_terminology.rs).
csv = "1"
# Parses the TMX custom-terminology input files ImportTerminology accepts
# (src/ops/import_terminology.rs).
quick-xml = "0.41"
# Determines the source language of the text when TranslateText is asked for
# `auto` (src/ops/translate_text.rs, src/ops/translate_document.rs).
whatlang = "0.18"
# Reads and rewrites the Office Open XML package a Word document
# TranslateDocument translates is (src/ops/translate_document.rs).
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
