[package]
name = "service-com-amazonaws-iotdataplane-iotmoonrakerservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Mint the `traceId` this data plane returns in every response envelope it writes
# (`state::new_trace_id`): `sha2` spreads the clock, the process and a per-process
# counter over the id's hex digits, and `hex` renders them. Already workspace
# dependencies, and already used by this crate's tests.
sha2 = { workspace = true }
hex = { workspace = true }
# The IoT control plane's TOPIC RULES, in the SAME shared engine: an accepted `Publish` is
# what the rules engine runs on, so the data plane drives that service's evaluation
# (`state::rules_engine`) rather than holding a second copy of the rules.
service-com-amazonaws-iot-awsiotservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
