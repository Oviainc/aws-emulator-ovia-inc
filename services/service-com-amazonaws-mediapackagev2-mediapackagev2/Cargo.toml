[package]
name = "service-com-amazonaws-mediapackagev2-mediapackagev2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Entity tags and the opaque domain labels are digests of the resource's own content.
sha2 = { workspace = true }
# Hex encoding for those digests and for the opaque pagination token.
hex = { workspace = true }
# `ETag` is the base64 of a 32-byte digest, which is the form AWS hands entity tags out in.
base64 = "0.22"
# The object store `CreateHarvestJob` resolves a harvest destination against: the bucket is
# read out of Amazon S3's OWN state in this same shared engine, in memory, so a submission's
# destination is never a host anything dials.
service-com-amazonaws-s3-amazons3 = { workspace = true }
# `service-common` carries the ONE caller-supplied-ARN parse, which the CDN authorization
# and key-provider ARN members are read against.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
