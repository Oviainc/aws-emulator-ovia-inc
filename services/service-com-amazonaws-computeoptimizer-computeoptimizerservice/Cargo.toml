[package]
name = "service-com-amazonaws-computeoptimizer-computeoptimizerservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# Hex codec for the opaque `nextToken` GetRecommendationPreferences round-trips.
hex = { workspace = true }
# Digest for the selection fingerprint bound into the GetIdleRecommendations page token.
sha2 = { workspace = true }
# The Amazon ECS inventory an ECS service recommendation is computed over: the service's
# launch type, its task definition's task-level CPU/memory and its container definitions.
service-com-amazonaws-ecs-amazonec2containerservicev20141113 = { workspace = true }
# The Amazon RDS inventory an Amazon Aurora or RDS database recommendation is computed over:
# the DB instances the account owns, their DB instance class, engine and storage, and the
# classes that service publishes as orderable for an engine.
service-com-amazonaws-rds-amazonrdsv19 = { workspace = true }
# The observed utilization an ECS service recommendation is computed from: the
# `AWS/ECS` `CPUUtilization` / `MemoryUtilization` datapoints published for the service.
service-com-amazonaws-cloudwatch-graniteserviceversion20100801 = { workspace = true }
# The object store a recommendations export writes its .csv export file and .json metadata
# file into: "to an existing Amazon Simple Storage Service (Amazon S3) bucket that you
# specify".
service-com-amazonaws-s3-amazons3 = { workspace = true }
# The comma-separated-values codec the export file is written with.
csv = "1.3"

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# Amazon VPC's own records: an ECS service of the `awsvpc` network mode is placed in
# subnets Amazon ECS resolves against this store, so the suites that analyse one hold the
# subnet their placement names.
service-com-amazonaws-ec2-amazonec2 = { workspace = true }

[lints]
workspace = true
