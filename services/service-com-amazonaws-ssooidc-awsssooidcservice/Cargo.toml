[package]
name = "service-com-amazonaws-ssooidc-awsssooidcservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The IAM Identity Center instances of this account, whose access portal is what a
# device authorization's `startUrl` has to name: the instances are IAM Identity
# Center's own records, so this service resolves the portal against them rather
# than keeping a second copy of them.
service-com-amazonaws-ssoadmin-swbexternalservice = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
# `time` so an integration test can await the clock-owed device-authorization
# approval without blocking the test runtime's worker.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
