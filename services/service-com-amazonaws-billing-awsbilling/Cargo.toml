[package]
name = "service-com-amazonaws-billing-awsbilling"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
# The caller identity an `AccessDeniedException` message names is STS's own:
# `sts:GetCallerIdentity` and this service must answer with one principal for
# one credential, so the identity is resolved from the STS store (src/state.rs).
service-com-amazonaws-sts-awssecuritytokenservicev20110615 = { workspace = true }
# Hex-encodes the opaque `nextToken` the list operations hand out
# (ListBillingViews, ListSourceViewsForBillingView).
hex = { workspace = true }
# Digests the entry selection a `GetBillingPreferences` page was taken under, so
# its `nextToken` is bound to it at a fixed width.
sha2 = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true
