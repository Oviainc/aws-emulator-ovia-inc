[package]
name = "service-com-amazonaws-ses-simpleemailservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The digest behind every server-generated opaque id this service answers with
# (SendEmail's MessageId, a domain identity's verification token) and its hex
# rendering. Both are already in this crate's dependency closure.
sha2 = { workspace = true }
hex = { workspace = true }
# `ipnet`: the ONE reading of an IP address or range in CIDR notation, which a
# receipt IP address filter's `Cidr` is documented as carrying.
ipnet = "2"
# `mailparse`: the ONE reading of an RFC 5322 / MIME message, which
# `SendRawEmail`'s `RawMessage` carries — its header block, the address lists on
# its From:, To:, Cc: and Bcc: lines, and its textual part.
mailparse = "0.16"
# `email_address`: the ONE reading of a caller-supplied email address and domain name,
# shared with every other service whose model documents a member as one — the form this
# service documents (`UserName@[SubDomain.]Domain.TopLevelDomain`) is read through it
# rather than stated again here.
# `iam_authorization`: the shared evaluation of policy documents against
# (action, resource, principal), which decides whether the Amazon S3 destination a receipt
# rule's `S3Action` names really permits Amazon SES to write a received message into it.
# `s3_client`: the in-process Amazon S3 client that pre-flight reads the destination
# bucket's policy through (`state::s3_action_authorization`).
service-common = { path = "../common" }
# The same pre-flight reads the destination's two owners over the in-process callback, so the
# bucket policy and the key policy it judges are the ones those services themselves hold:
# `aws-sdk-s3` for the bucket's error codes and `aws-sdk-kms` for the key's manager and its
# key policy. Only the generated clients are needed — the emulator supplies the transport.
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# The `S3Action` destination suite mounts Amazon S3 and KMS beside this service on one
# engine, exactly as the assembled router mounts them, and makes every bucket, bucket policy
# and key through those services' OWN operations over the in-process callback. DEV-ONLY:
# this crate depends on no other service's crate outside its tests.
service-com-amazonaws-s3-amazons3 = { workspace = true }
service-com-amazonaws-kms-trentservice = { workspace = true }

[lints]
workspace = true
