[package]
name = "service-com-amazonaws-ses-simpleemailservice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# The digest behind every server-generated opaque id this service answers with
# (SendEmail's MessageId, a domain identity's verification token) and its hex
# rendering. Both are already in this crate's dependency closure.
sha2 = { workspace = true }
hex = { workspace = true }
# `email_address`: the ONE reading of a caller-supplied email address and domain name,
# shared with every other service whose model documents a member as one — the form this
# service documents (`UserName@[SubDomain.]Domain.TopLevelDomain`) is read through it
# rather than stated again here.
service-common = { path = "../common" }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[lints]
workspace = true
