[package]
name = "service-com-amazonaws-glacier-glacier"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
engine = { workspace = true }
smithy-macros = { workspace = true }
aws-smithy-schema = { workspace = true }
aws-smithy-schema-server = { workspace = true }
smithy-server-runtime = { workspace = true }
emulator-server = { workspace = true }
emulator-telemetry = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
aws-smithy-types = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# SHA-256, the primitive Glacier's SHA256 tree hash is built from.
sha2 = { workspace = true }
# Lowercase-hex rendering of a tree hash / a minted opaque id.
hex = { workspace = true }

[build-dependencies]
emulator-core-build-support = { workspace = true }

[dev-dependencies]
# `time` on top of the workspace features: the retrieval tests await the instant a job's
# completion falls due rather than blocking the runtime thread. No handler sleeps.
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
